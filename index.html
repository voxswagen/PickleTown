/* The nav links wrap onto three lines at 390px. On a phone the four places
   anyone actually goes become a bottom bar instead; everything else lives
   behind More. */
function TabBar({route, go, admin, onLogin, onSignOut, pending}){
  const [more,setMore] = useState(false);
  const tabs = [
    {k:"home", label:"Home"},
    {k:"book", label:"Book"},
    {k:"openplay", label:"Open play"},
    {k:"more", label:"More"}
  ];
  return (
    <>
      {more && (
        <div className="mb-veil" onClick={()=>setMore(false)}>
          <div className="mb-sheet mb-more" onClick={e=>e.stopPropagation()}>
            <span className="mb-grab"/>
            {admin ? (
              <>
                <button className="mb-morerow" onClick={()=>{go("requests"); setMore(false);}}>
                  Booking requests {pending>0 && <b>{pending}</b>}</button>
                <button className="mb-morerow" onClick={()=>{go("settings"); setMore(false);}}>Settings</button>
                <button className="mb-morerow danger" onClick={()=>{setMore(false); onSignOut();}}>Sign out</button>
              </>
            ) : (
              <button className="mb-morerow" onClick={()=>{setMore(false); onLogin();}}>Staff log in</button>
            )}
          </div>
        </div>
      )}
      <div className="tabbar">
        {tabs.map(t=>{
          const on = t.k === "more" ? more : route === t.k;
          return (
            <button key={t.k} className={"tab-b"+(on?" on":"")}
              onClick={()=> t.k==="more" ? setMore(v=>!v) : go(t.k)}>
              <span className="g">{TAB_ICONS[t.k]}</span>
              <span className="l">{t.label}</span>
              {t.k==="more" && admin && pending>0 && <i className="tab-dot"/>}
            </button>
          );
        })}
      </div>
    </>
  );
}

/* =========================== APP ================================= */
function App(){
  const today = toKey(new Date());
  const PAGES = ["home","book","openplay","requests","settings"];
  const [date,setDate] = useState(today);
  const [bookings,setBookings] = useState([]);
  const [loading,setLoading] = useState(true);
  const [busy,setBusy] = useState(false);
  const [me,setMe] = useState(null);
  const admin = !!me;
  useEffect(()=>{ let ok=true; staffRestore().then(v=>{ if(ok && v) setMe(v); }); return ()=>{ok=false;}; },[]);
  const [modal,setModal] = useState(null);
  const [lightbox,setLightbox] = useState(null);
  const [toast,setToast] = useState("");
  const [queue,setQueue] = useState([]);
  const [tick,setTick] = useState(nowMin());
  const [focusCourt,setFocusCourt] = useState(null);
  const [showPlan,setShowPlan] = useState(false);
  const scrollerRef = useRef(null);
  const [stamp,setStamp] = useState(0);
  const [demo,setDemo] = useState(false);
  const tRef = useRef(null);
  const phone = useIsPhone();

  const say = useCallback(m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(()=>setToast(""),3000); },[]);
  const bump = () => setStamp(s=>s+1);
  const isToday = date === today;

  /* first run: drop in a few sample bookings so the board isn't blank */
  useEffect(()=>{ (async ()=>{
    const seeded = await store.get("court:seeded");
    if (seeded) return;
    const base = Math.floor(nowMin()/30)*30;
    const at = t => Math.min(Math.max(t,OPEN),CLOSE-60);
    const now = new Date().toISOString();
    const mk = (court,start,len,name,phone,status) => ({
      id:makeId(), date:toKey(new Date()), court, start:at(start), end:at(start)+len,
      name, phone, notes:"", status, requestedAt:now,
      decidedAt: status==="confirmed"?now:null, decidedBy: status==="confirmed"?"admin":null,
      hasReceipt:false, source:"customer", demo:true
    });
    const samples = [
      mk(0, base-30, 90, "Maria Santos", "0917 555 0142", "confirmed"),
      mk(2, base, 60, "Jun Dela Cruz", "0918 555 0067", "confirmed"),
      mk(4, base+120, 60, "Rico Alvarez", "0920 555 0311", "confirmed"),
      mk(1, base+60, 60, "Bea Ramos", "0916 555 0298", "pending"),
    ];
    try {
      await saveDay(toKey(new Date()), samples);
      await store.set("court:seeded","1");
      setDemo(true); bump();
    } catch {}
  })(); },[]);

  useEffect(()=>{ let ok=true; setLoading(true);
    loadDay(date).then(b=>{ if(ok){ setBookings(b); setDemo(b.some(x=>x.demo)); setLoading(false); } });
    return ()=>{ ok=false; };
  },[date,stamp]);

  const loadQueue = useCallback(async ()=>{
    const keys = await store.list("court:day:");
    const out = [];
    for (const k of keys){
      const v = await store.get(k);
      try { (JSON.parse(v)||[]).forEach(b => b.status==="pending" && out.push(b)); } catch {}
    }
    out.sort((a,b)=> a.requestedAt < b.requestedAt ? -1 : 1);
    setQueue(out);
  },[]);
  useEffect(()=>{ loadQueue(); },[stamp,loadQueue]);

  useEffect(()=>{ const i = setInterval(()=>setTick(nowMin()),30000); return ()=>clearInterval(i); },[]);
  useEffect(()=> onBus(m => { if (m && m.type === "session") setStamp(s2=>s2+1); }), []);

  /* ---- derived ---- */
  const confirmed = bookings.filter(b=>b.status==="confirmed");
  const waiting = bookings.filter(b=>b.status==="pending");

  const courtState = useMemo(()=> CLUB.courts.map((_,c)=>{
    const mine = confirmed.filter(b=>b.court===c).sort((a,b)=>a.start-b.start);
    const live = isToday ? mine.find(b=>tick>=b.start && tick<b.end) : null;
    const next = isToday ? mine.find(b=>b.start>tick) : mine[0];
    return { live, next, count:mine.length };
  }),[bookings,tick,isToday]);

  const openNow = courtState.filter(s=>!s.live).length;

  const segments = useMemo(()=>{
    const cols = [];
    for (let c=0;c<COURTS;c++){
      const conf = SLOTS.map(m => confirmed.find(b=>b.court===c && m>=b.start && m<b.end) || null);
      const lead = SLOTS.map((m,i)=>{
        if (conf[i]) return null;
        const hits = waiting.filter(b=>b.court===c && m>=b.start && m<b.end)
                            .sort((a,b)=> a.requestedAt<b.requestedAt?-1:1);
        return hits.length ? {first:hits[0], total:hits.length} : null;
      });
      const segs = []; let i = 0;
      while (i < SLOTS.length){
        if (conf[i]){ const b=conf[i]; let n=0;
          while (i+n<SLOTS.length && conf[i+n] && conf[i+n].id===b.id) n++;
          segs.push({kind:"conf",booking:b,row:i,span:n}); i+=n;
        } else if (lead[i]){ const b=lead[i].first; let n=0,t=0;
          while (i+n<SLOTS.length && lead[i+n] && lead[i+n].first.id===b.id){ t=Math.max(t,lead[i+n].total); n++; }
          segs.push({kind:"wait",booking:b,others:t-1,row:i,span:n}); i+=n;
        } else { segs.push({kind:"free",row:i,span:1}); i++; }
      }
      cols.push(segs);
    }
    return cols;
  },[bookings]);

  const freeSlots = segments.reduce((n,s)=> n + s.filter(x=>x.kind==="free").length, 0);
  const isPast = m => date < today || (isToday && m + STEP <= tick);

  /* ---- actions ---- */
  async function submit({court,start,duration,name,phone,notes,receipt,method}){
    const rec = {
      id:makeId(), date, court, start, end:start+duration,
      name:name.trim(), phone:phone.trim(), notes:notes.trim(), method:method||"counter",
      status: admin ? "confirmed" : "pending",
      requestedAt:new Date().toISOString(),
      decidedAt: admin ? new Date().toISOString() : null, decidedBy: admin ? "admin" : null,
      hasReceipt: !!receipt, source: admin ? "admin" : "customer"
    };
    const fresh = await loadDay(date);
    if (fresh.some(b=>b.status==="confirmed" && clash(b,rec))){
      setBookings(fresh);
      return "That court time was just confirmed for someone else. Pick another slot.";
    }
    try {
      if (receipt) await store.set(RCPT(rec.id), receipt);
      await saveDay(date,[...fresh,rec]);
      setBookings([...fresh,rec]);
      addLog({ts:rec.requestedAt, action: admin?"booked":"requested", by:rec.source, name:rec.name,
        detail:`${CLUB.courts[court]} · ${fmtDateShort(date)} · ${fmtTime(start)}–${fmtTime(rec.end)}`});
      bump();
      if (admin) say(`Booked — ${CLUB.courts[court]}, ${fmtTime(start)}`);
      return null;
    } catch { return "Couldn't send that. Check your connection and try again."; }
  }

  async function decide(b,outcome){
    setBusy(true);
    try {
      const fresh = await loadDay(b.date);
      const at = new Date().toISOString();
      const next = fresh.map(x=>{
        if (x.id===b.id) return {...x, status:outcome, decidedAt:at, decidedBy:"admin"};
        if (outcome==="confirmed" && x.status==="pending" && clash(x,b))
          return {...x, status:"declined", decidedAt:at, decidedBy:"admin", declineReason:"Court taken"};
        return x;
      });
      await saveDay(b.date,next);
      if (b.date===date) setBookings(next);
      addLog({ts:at, action: outcome==="confirmed"?"approved":outcome, by:(me&&me.label)||"staff", name:b.name,
        detail:`${CLUB.courts[b.court]} · ${fmtDateShort(b.date)} · ${fmtTime(b.start)}–${fmtTime(b.end)}`});
      say(outcome==="confirmed" ? `Approved — ${b.name}` : outcome==="declined" ? "Request declined" : "Reservation cancelled");
      setModal(null); bump();
    } catch { say("That didn't save. Try again."); }
    setBusy(false);
  }

  async function clearDemo(){
    const fresh = await loadDay(today);
    await saveDay(today, fresh.filter(b=>!b.demo));
    setDemo(false); bump(); say("Sample bookings cleared");
  }

  const [hash,setHash] = useState(()=>location.hash.replace("#",""));
  useEffect(()=>{ const f=()=>setHash(location.hash.replace("#","")); window.addEventListener("hashchange",f);
    return ()=>window.removeEventListener("hashchange",f); },[]);
  const route = PAGES.includes(hash) ? hash : "home";

  const go = r => {
    if (r === "home"){ history.replaceState(null,"",location.pathname+location.search); setHash(""); }
    else location.hash = r;
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const openBooking = (court,start) => setModal({t:"book",court,start});

  /* open the schedule at the current hour, not at 6am */
  useEffect(()=>{
    if (route !== "book" || loading || !scrollerRef.current) return;
    const first = bookings.filter(b => b.status!=="declined" && b.status!=="cancelled")
      .reduce((m,b) => Math.min(m, b.start), Infinity);
    const target = isToday ? tick : (isFinite(first) ? first : 8*60);
    scrollerRef.current.scrollTop = Math.max(0, ((Math.max(OPEN, target-60) - OPEN)/STEP) * ROW_H);
  }, [route, date, loading]);

  /* ---- render ---- */
  if (hash === "tv") return <TVScreen/>;
  if (hash === "stack") return <StackView/>;

  return (
    <>
      <nav>
        <div className="nav-in">
          <button onClick={()=>go("home")} aria-label={CLUB.name} style={{display:"flex"}}>
            <LogoWord/>
          </button>
          <div className="nav-links">
            <button className={"navlink"+(route==="home"?" on":"")} onClick={()=>go("home")}>Home</button>
            <button className={"navlink"+(route==="book"?" on":"")} onClick={()=>go("book")}>Book a court</button>
            <button className={"navlink"+(route==="openplay"?" on":"")} onClick={()=>go("openplay")}>Open play</button>
            {admin && <button className={"navlink"+(route==="requests"?" on":"")} onClick={()=>go("requests")}>
              Requests{queue.length>0 && <span className="count">{queue.length}</span>}</button>}
            {admin && <button className={"navlink"+(route==="settings"?" on":"")} onClick={()=>go("settings")}>Settings</button>}
            {admin
              ? <>
                  <span className="pill" title={me.key}>{me.label}</span>
                  <button className="btn btn-sm" onClick={()=>{staffSignOut(); setMe(null); go("home"); say("Signed out");}}>Sign out</button>
                </>
              : <button className="btn btn-sm" onClick={()=>setModal({t:"login"})}>Log in</button>}
          </div>
        </div>
      </nav>

      {route==="home" && (admin
        ? <AdminHome pending={queue} stamp={stamp} tick={tick} onGo={go} onDecide={decide}
            busy={busy} onPhoto={setLightbox} setDate={setDate}/>
        : <Landing openNow={openNow} courtState={courtState} confirmed={confirmed} waiting={waiting}
            tick={tick} loading={loading} onBook={()=>go("book")} />)}

      {route==="book" && phone && (
        <MobileBook date={date} setDate={setDate} today={today} bookings={bookings} admin={admin}
          isPast={isPast} submit={submit} say={say}/>
      )}

      {route==="book" && !phone && (
        <div className="wrap">
          <div className="page-head">
            <div>
              <div className="eyebrow">{isToday ? "Today" : "Schedule"}</div>
              <div className="dateline" style={{marginTop:6}}>{fmtDate(date)}</div>
              {!isToday && <button className="btn btn-ghost btn-sm" style={{padding:"4px 0",marginTop:2}}
                onClick={()=>setDate(today)}>Back to today</button>}
            </div>
            <div className="datenav">
              <button className="arrow" aria-label="Previous day" onClick={()=>setDate(shiftDate(date,-1))}>‹</button>
              <input className="dateinput" type="date" value={date} onChange={e=>e.target.value && setDate(e.target.value)}/>
              <button className="arrow" aria-label="Next day" onClick={()=>setDate(shiftDate(date,1))}>›</button>
            </div>
          </div>

          {demo && (
            <div className="banner">
              <span>These are sample bookings so you can see how a busy day looks. Clear them when you're ready to go live.</span>
              <button className="btn btn-sm" onClick={clearDemo}>Clear samples</button>
            </div>
          )}

          <div className="chips">
            {CLUB.courts.map((name,c)=>{
              const s = courtState[c];
              return (
                <div key={c} className={"chip"+(s.live?" busy":"")}>
                  <div className="chip-top">
                    <span className={"dot "+(s.live?"busy":"open")}/>
                    <span className="chip-name">{name}</span>
                  </div>
                  <div className="chip-state">
                    {s.live
                      ? <>On court until {fmtShortTime(s.live.end)}</>
                      : isToday
                        ? (s.next ? <>Open · next {fmtShortTime(s.next.start)}</> : <>Open all evening</>)
                        : (s.count ? <>{s.count} booked</> : <>Nothing booked</>)}

          </div>

          <div className="plantrigger">
            <button className="btn btn-sm" onClick={()=>setShowPlan(v=>!v)}>
              {showPlan ? "Hide court layout" : "View court layout"}
            </button>
            {focusCourt!=null && (
              <span className="focuspill">
                Showing {CLUB.courts[focusCourt]}
                <button onClick={()=>setFocusCourt(null)} aria-label="Show all courts">×</button>
              </span>
            )}
          </div>

          {showPlan && (
            <div className="planwrap">

                </div>

              </div>
              <CourtPlan selected={focusCourt} onSelect={c=>setModal({t:"court", court:c})}
                status={c=>{
                  const cs = courtState[c];
                  return cs.live ? {busy:true, text:"until "+fmtShortTime(cs.live.end)}
                    : {busy:false, text: isToday ? (cs.next ? "free · "+fmtShortTime(cs.next.start) : "free") : (cs.count ? cs.count+" booked" : "free")};
                }}/>
            </div>
          )}

          <div className="sheet">
            <div className="grid ghead">
              <div className="hcell"><div className="hname">Time</div></div>
              {CLUB.courts.map((name,c)=>(
                <div className={"hcell"+(focusCourt!=null&&focusCourt!==c?" faded":"")} key={c}>
                  <div className="hname">{name}</div>
                  <div className="hstate">
                    <span className={"dot "+(courtState[c].live?"busy":"open")} style={{width:7,height:7}}/>
                    {courtState[c].live ? "In play" : "Open"}
                  </div>
                </div>
              ))}
            </div>
            <div className="scroller" ref={scrollerRef}>
              <div className="grid gbody">
                {isToday && tick>=OPEN && tick<CLOSE &&
                  <div className="nowline" style={{top:((tick-OPEN)/STEP)*ROW_H}}><span>NOW</span></div>}

                {SLOTS.map((m,i)=>(
                  <div key={"t"+m} className={"tlabel"+(m%60===0?" hour":"")} style={{gridColumn:1,gridRow:i+1}}>
                    {m%60===0 ? fmtTime(m) : ":30"}
                  </div>
                ))}

                {segments.map((segs,c)=> segs.map(s=>{
                  const style = {gridColumn:c+2, gridRow:`${s.row+1} / span ${s.span}`,
                    opacity: focusCourt!=null && focusCourt!==c ? .26 : 1};
                  if (s.kind==="conf"){
                    const b = s.booking;
                    const live = isToday && tick>=b.start && tick<b.end;
                    const done = isToday ? tick>=b.end : date<today;
                    return (
                      <button key={"c"+c+s.row} style={style}
                        className={"blk "+(live?"live":done?"done":"conf")}
                        onClick={()=>setModal({t:"detail",booking:b})}>
                        {live && <span className="eyebrow-live"><i/>On court</span>}
                        <span className="who">{b.name}</span>
                        <span className="when">{fmtShortTime(b.start)} – {fmtShortTime(b.end)}</span>
                      </button>
                    );
                  }
                  if (s.kind==="wait"){
                    return (
                      <button key={"w"+c+s.row} style={style} className="blk wait"
                        onClick={()=>setModal({t:"queue",court:c,start:s.booking.start,end:s.booking.end})}>
                        <span className="who">Awaiting approval</span>
                        <span className="when">{s.others>0 ? `${s.others+1} requests` : s.booking.name}</span>
                      </button>
                    );
                  }
                  const m = SLOTS[s.row], blocked = isPast(m) && !admin;
                  return (
                    <button key={"f"+c+s.row} style={style} disabled={blocked}
                      className={"cell"+(m%60===0?" hour":"")+(Math.floor(m/60)%2?" band":"")}
                      title={blocked ? "Time has passed" : `Request ${CLUB.courts[c]} at ${fmtTime(m)}`}
                      onClick={()=>openBooking(c,m)}/>
                  );
                }))}
              </div>
            </div>
          </div>

          <div className="scrollhint">Swipe the schedule sideways to see all six courts →</div>

          <div className="legend">
            <span><i className="key" style={{background:"linear-gradient(135deg,#E7818D,#DE6E7C)"}}/>On court now</span>
            <span><i className="key" style={{background:"var(--teal-deep)"}}/>Confirmed</span>
            <span><i className="key" style={{background:"var(--teal-soft)"}}/>Finished</span>
            <span><i className="key" style={{background:"var(--pink-soft)",border:"1.5px dashed var(--pink)"}}/>Awaiting approval</span>
            <span><i className="key" style={{background:"#fff",border:"1.5px solid var(--line)"}}/>Open — tap to request</span>
            <span style={{marginLeft:"auto"}}><b style={{color:"var(--teal-deep)"}}>{freeSlots}</b> open slots today</span>
          </div>
          <p className="mini" style={{marginTop:14,maxWidth:640}}>
            Requests aren't confirmed until the club approves them. Two people can ask for the same slot —
            we work through requests in the order they arrive.
          </p>
          <div style={{height:60}}/>
        </div>
      )}

      {route==="openplay" && <OpenPlay admin={admin} say={say}/>}

      {route==="requests" && admin &&
        <div className="wrap"><div className="page-head"><div>
          <div className="eyebrow pink">Waiting on you</div>
          <h2 style={{marginTop:6}}>Booking requests</h2>
        </div></div>
        <Queue list={queue} busy={busy} onDecide={decide} onPhoto={setLightbox}
          jump={d=>{setDate(d); go("book");}}/>
        <div style={{height:60}}/></div>}

      {route==="settings" && admin &&
        <SettingsPage stamp={stamp} busy={busy} onDecide={decide} onPhoto={setLightbox}
          jump={d=>{setDate(d); go("book");}} say={say} me={me} setMe={setMe}/>}



      {route==="home" && !admin && <Footer onStaff={()=>setModal({t:"login"})}/>}

      {phone && <>
        <div className="tabspacer"/>
        <TabBar route={route} go={go} admin={admin} pending={queue.length}
          onLogin={()=>setModal({t:"login"})}
          onSignOut={()=>{staffSignOut(); setMe(null); go("home"); say("Signed out");}}/>
      </>}

      {modal && modal.t==="court" && (
        <div className="veil" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="eyebrow">You picked</div>
            <h3 style={{marginTop:6}}>{CLUB.courts[modal.court]}</h3>
            <p className="lede">This is where it sits in the hall.</p>
            <CourtPlan selected={modal.court} compact/>
            <div className="actions">
              <button className="btn" onClick={()=>setModal(null)}>Pick another</button>
              <button className="btn btn-primary" onClick={()=>{setFocusCourt(modal.court); setShowPlan(false); setModal(null);}}>
                Show its free times
              </button>
            </div>
          </div>
        </div>
      )}

      {modal && modal.t==="login" &&
        <Login onClose={()=>setModal(null)} onDone={who=>{setMe(who); setModal(null); go("requests"); say(`Signed in — ${who.label}`);}}/>}
      {modal && modal.t==="book" &&
        <BookModal court={modal.court} start={modal.start} date={date} admin={admin}
          bookings={bookings} onClose={()=>setModal(null)} onSubmit={submit}/>}
      {modal && modal.t==="detail" &&
        <Detail booking={modal.booking} admin={admin} busy={busy} tick={tick} isToday={isToday}
          onPhoto={setLightbox} onClose={()=>setModal(null)} onCancel={()=>decide(modal.booking,"cancelled")}/>}
      {modal && modal.t==="queue" &&
        <QueueModal court={modal.court} start={modal.start} end={modal.end} date={date} bookings={bookings}
          admin={admin} busy={busy} onDecide={decide} onPhoto={setLightbox} onClose={()=>setModal(null)}
          onJoin={()=>openBooking(modal.court,modal.start)}/>}

      {lightbox && <div className="lightbox" onClick={()=>setLightbox(null)}><img src={lightbox} alt="Receipt"/></div>}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

function Login({onClose,onDone}){
  const [u,setU]=useState(""), [p,setP]=useState(""), [e,setE]=useState(""), [busy,setBusy]=useState(false);
  const go = async () => {
    setBusy(true);
    const who = await staffSignIn(u, p);
    setBusy(false);
    if (who) onDone(who);
    else setE("That username and password don't match.");
  };
  return (
    <div className="veil" onClick={onClose}>
      <div className="modal" onClick={ev=>ev.stopPropagation()}>
        <h3>Staff sign in</h3>
        <p className="lede">Approve requests, cancel bookings and open the records.</p>
        {/* an http:// page is one an attacker on the same network can rewrite,
            so say so where a password is about to be typed */}
        {!window.isSecureContext && (
          <div className="msg err">
            <b>This page isn't on a secure connection.</b> The address bar shows
            <b> http://</b>, not <b>https://</b>. Sign-in still works, but don't type a real
            password until the site's certificate is sorted — in Netlify, Domain management →
            HTTPS → Verify DNS configuration, then Provision certificate.
          </div>
        )}
        {e && <div className="msg err">{e}</div>}
        <div className="field"><span className="label">Username</span>
          <input autoFocus value={u} type="text" autoComplete="username"
            onChange={ev=>{setU(ev.target.value); setE("");}} onKeyDown={ev=>ev.key==="Enter"&&go()}/></div>
        <div className="field"><span className="label">Password</span>
          <input type="password" value={p} onChange={ev=>{setP(ev.target.value); setE("");}} onKeyDown={ev=>ev.key==="Enter"&&go()}/></div>
        <div className="actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={busy} onClick={go}>{busy?"Checking…":"Sign in"}</button>
        </div>
      </div>
    </div>
  );
}

function BookModal({court,start,date,admin,bookings,onClose,onSubmit}){
  const idx = SLOTS.indexOf(start);
  const maxRun = useMemo(()=>{
    const conf = bookings.filter(b=>b.status==="confirmed" && b.court===court);
    let n=0;
    for (let i=idx;i<SLOTS.length;i++){ const m=SLOTS[i];
      if (conf.some(b=>m>=b.start && m<b.end)) break; n++; }
    return n*STEP;
  },[idx,bookings,court]);
  const cap = admin ? maxRun : Math.min(maxRun, GUEST_MAX);
  const opts = []; for (let d=STEP; d<=cap; d+=STEP) opts.push(d);
  const [dur,setDur] = useState(opts.includes(60)?60:opts[0]||30);
  const [name,setName] = useState(""), [phone,setPhone] = useState(""), [notes,setNotes] = useState("");
  const [receipt,setReceipt] = useState(null), [err,setErr] = useState("");
  const [payref,setPayref] = useState("");
  const [method,setMethod] = useState("gcash");
  const [saving,setSaving] = useState(false), [sent,setSent] = useState(false);
  const fileRef = useRef(null);

  const pick = async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!f.type.startsWith("image/")){ setErr("That file isn't a photo. Use a JPG or PNG."); return; }
    try { const url = await shrinkPhoto(f);
      if (url.length > 4000000){ setErr("That photo is too big even after shrinking. Try another."); return; }
      setReceipt(url); setErr("");
    } catch { setErr("Couldn't read that photo. Try another one."); }
  };

  const go = async () => {
    if (!name.trim()){ setErr("Add the name the court is for."); return; }
    if (phone.replace(/\D/g,"").length < 7){ setErr("Add a mobile number we can reach you on."); return; }
    /* same rule as the phone flow: a customer request has to carry either a
       receipt or a reference, or the desk can't tie it to a payment */
    if (!admin && !receipt && !payref.trim()){
      setErr("Attach your receipt, or type the reference from your payment — we need one of the two.");
      return;
    }
    setSaving(true);
    const withRef = [notes.trim(), payref.trim() ? `Ref: ${payref.trim()}` : ""]
      .filter(Boolean).join(" · ");
    const problem = await onSubmit({court,start,duration:dur,name,phone,notes:withRef,receipt,method});
    setSaving(false);
    if (problem) setErr(problem); else if (admin) onClose(); else setSent(true);
  };

  if (sent) return (
    <div className="veil" onClick={onClose}>
      <div className="modal" onClick={ev=>ev.stopPropagation()} style={{textAlign:"center"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><Ball size={46} color="var(--teal)"/></div>
        <h3>Request sent</h3>
        <p className="lede" style={{marginBottom:16}}>{CLUB.courts[court]} · {fmtDate(date)}</p>
        <div className="msg ok">
          {fmtTime(start)} – {fmtTime(start+dur)} is with the club for review. We'll confirm on {phone}.
          The slot stays open to others until then.
        </div>
        <button className="btn btn-primary btn-block" onClick={onClose}>Done</button>
      </div>
    </div>
  );

  return (
    <div className="veil" onClick={onClose}>
      <div className="modal" onClick={ev=>ev.stopPropagation()}>
        <div className="eyebrow">{fmtDate(date)}</div>
        <h3 style={{marginTop:8}}>{CLUB.courts[court]} at {fmtTime(start)}</h3>
        <CourtPlan selected={court} compact/>
        <p className="lede">Ends at {fmtTime(start+dur)} · longest open run here is {fmtDur(maxRun)}</p>
        {!admin && <div className="msg info">Your request goes to the club for approval. First request in is first reviewed.</div>}
        {err && <div className="msg err">{err}</div>}

        <div className="field"><span className="label">Name</span>
          <input autoFocus value={name} placeholder="Who the court is for"
            onChange={e=>{setName(e.target.value); setErr("");}}/></div>
        <div className="row2">
          <div className="field"><span className="label">Mobile number</span>
            <input type="tel" inputMode="tel" value={phone} placeholder="Required"
              onChange={e=>{setPhone(e.target.value); setErr("");}}/></div>
          <div className="field"><span className="label">Length</span>
            <select value={dur} onChange={e=>setDur(Number(e.target.value))}>
              {opts.map(d=><option key={d} value={d}>{fmtDur(d)}</option>)}
            </select></div>
        </div>
        <PaymentPanel minutes={dur} method={method} setMethod={setMethod}/>

        <div className="field"><span className="label">Notes</span>
          <textarea value={notes} placeholder="Coaching, tournament, number of players…"
            onChange={e=>setNotes(e.target.value)}/></div>

        <div className="field"><span className="label">Payment reference</span>
          <input value={payref} placeholder={payRef(name||"Guest", date, court)} autoCapitalize="characters"
            onChange={e=>{setPayref(e.target.value); setErr("");}}/>
          <p className="mini" style={{marginTop:6}}>{admin
            ? "Optional for a staff booking."
            : <>Put <b>{payRef(name||"Guest", date, court)}</b> in the payment note and type it here — or
               attach the receipt below instead. We need one of the two to match your payment.</>}</p>
        </div>

        <div className="field"><span className="label">Payment receipt</span>
          {receipt ? (
            <>
              <img className="preview" src={receipt} alt="Receipt preview"/>
              <div className="actions" style={{marginTop:9}}>
                <button className="btn btn-sm" onClick={()=>fileRef.current.click()}>Replace photo</button>
                <button className="btn btn-sm btn-danger" onClick={()=>setReceipt(null)}>Remove</button>
              </div>
            </>
          ) : (
            <button className="drop" onClick={()=>fileRef.current.click()}>
              <b>Attach a photo of your receipt</b>
              {admin ? "Optional" : "Or fill in the reference above"} — a photo gets your request approved faster
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pick}/>
        </div>

        <div className="actions">
          <button className="btn" onClick={onClose}>Back</button>
          <button className="btn btn-primary" disabled={saving} onClick={go}>
            {saving ? "Sending…" : admin ? "Book and confirm" : "Send request"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Receipt({booking,onOpen,full}){
  const [url,setUrl] = useState(null);
  const [state,setState] = useState(booking.hasReceipt ? "loading" : "none");
  useEffect(()=>{ let ok=true;
    if (!booking.hasReceipt) return;
    store.get(RCPT(booking.id)).then(u=>{ if(!ok) return; if(u){setUrl(u); setState("ok");} else setState("gone"); });
    return ()=>{ ok=false; };
  },[booking.id,booking.hasReceipt]);
  if (state==="none") return <div className="thumb-ph">No receipt</div>;
  if (state==="loading") return <div className="thumb-ph">Loading</div>;
  if (state==="gone") return <div className="thumb-ph">Missing</div>;
  return full
    ? <img className="preview" src={url} alt="Receipt" style={{cursor:"zoom-in"}} onClick={()=>onOpen(url)}/>
    : <img className="thumb" src={url} alt="Receipt" onClick={()=>onOpen(url)}/>;
}

/* =========================== RECORDS ============================= */
const PAGE_SIZE = 25;

/* A native date input ignores `placeholder` — it always shows the browser's own
   mm/dd/yyyy — so the only way to say which end of the range a box is is a label. */
function DateRange({from, setFrom, to, setTo}){
  return (
    <>
      <label className="datefield"><span>Date from</span>
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)}/></label>
      <label className="datefield"><span>Date to</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)}/></label>
    </>
  );
}

/* Newest first, so the previous page is the newer one. */
function Pager({page, setPage, total, unit}){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (total <= PAGE_SIZE) return null;
  const first = page*PAGE_SIZE + 1, last = Math.min(total, (page+1)*PAGE_SIZE);
  return (
    <div className="pager">
      <span className="mini">Showing <b>{first}–{last}</b> of {total} {unit}</span>
      <div className="pagerbtns">
        <button className="btn btn-sm" disabled={page<=0} onClick={()=>setPage(p=>p-1)}>‹ Newer</button>
        <span className="mini">Page {page+1} of {pages}</span>
        <button className="btn btn-sm" disabled={page>=pages-1} onClick={()=>setPage(p=>p+1)}>Older ›</button>
      </div>
    </div>
  );
}

function Records({stamp,busy,onDecide,onPhoto,jump,boss}){
  const [rows,setRows] = useState([]);
  const [loading,setLoading] = useState(true);
  /* opens on today — a full history is rarely what the desk wants first */
  const todayKey = toKey(new Date());
  const [q,setQ] = useState("");
  const [from,setFrom] = useState(todayKey), [to,setTo] = useState(todayKey);
  const [status,setStatus] = useState("all");
  const [page,setPage] = useState(0);

  useEffect(()=>{ let ok=true;
    (async ()=>{
      setLoading(true);
      const keys = await store.list("court:day:");
      const all = [];
      for (const k of keys){ const v = await store.get(k); try { all.push(...(JSON.parse(v)||[])); } catch {} }
      all.sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : a.start-b.start);
      if (ok){ setRows(all); setLoading(false); }
    })();
    return ()=>{ ok=false; };
  },[stamp,busy]);

  const list = rows.filter(b=>{
    if (status!=="all" && b.status!==status) return false;
    if (from && b.date<from) return false;
    if (to && b.date>to) return false;
    if (q && !`${b.name} ${b.phone} ${b.notes} ${CLUB.courts[b.court]}`.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  const hours = list.filter(b=>b.status==="confirmed").reduce((n,b)=>n+(b.end-b.start),0)/60;
  useEffect(()=>{ setPage(0); },[q,from,to,status]);
  const shown = list.slice(page*PAGE_SIZE, page*PAGE_SIZE + PAGE_SIZE);

  const csv = () => {
    const head = ["Date","Court","Start","End","Minutes","Status","Name","Mobile","Payment","Notes","Receipt","Requested at","Decided at","Source"];
    const esc = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const lines = [head.join(",")].concat(list.map(b=>[
      b.date, CLUB.courts[b.court], fmtTime(b.start), fmtTime(b.end), b.end-b.start, b.status,
      b.name, b.phone, b.method||"", b.notes, b.hasReceipt?"Yes":"No",
      fmtStamp(b.requestedAt), b.decidedAt?fmtStamp(b.decidedAt):"", b.source
    ].map(esc).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"}));
    a.download = `pickle-town-bookings-${toKey(new Date())}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div className="card pad">
      <div className="filters">
        <input placeholder="Search name, number, court or notes" value={q} onChange={e=>setQ(e.target.value)}/>
        <select value={status} onChange={e=>setStatus(e.target.value)}>
          <option value="all">All statuses</option>
          <option value="pending">Awaiting approval</option>
          <option value="confirmed">Confirmed</option>
          <option value="declined">Declined</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <DateRange from={from} setFrom={setFrom} to={to} setTo={setTo}/>
        <button className="btn btn-sm" onClick={()=>{setQ("");setFrom(todayKey);setTo(todayKey);setStatus("all");}}>Today</button>
        <button className="btn btn-sm" onClick={()=>{setQ("");setFrom("");setTo("");setStatus("all");}}>All time</button>
        {boss && <button className="btn btn-sm btn-primary" disabled={!list.length} onClick={csv}>Export CSV</button>}
      </div>
      <div className="mini" style={{marginBottom:14}}>
        <b style={{color:"var(--teal-deep)",fontSize:14}}>{list.length}</b> records ·
        <b style={{color:"var(--teal-deep)",fontSize:14}}> {hours.toFixed(1)}</b> confirmed court hours
      </div>
      {loading ? <div className="empty">Loading records…</div>
        : !list.length ? <div className="empty">No records match these filters.</div> : (
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr>
              <th>Requested</th><th>Date</th><th>Court</th><th>Time</th><th>Name</th>
              <th>Mobile</th><th>Receipt</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>
              {shown.map(b=>(
                <tr key={b.id}>
                  <td style={{whiteSpace:"nowrap",color:"var(--soft)"}}>{fmtStamp(b.requestedAt)}</td>
                  <td><button className="btn btn-ghost btn-sm" style={{padding:0}} onClick={()=>jump(b.date)}>{fmtDateShort(b.date)}</button></td>
                  <td>{CLUB.courts[b.court]}</td>
                  <td style={{whiteSpace:"nowrap"}}>{fmtTime(b.start)} – {fmtTime(b.end)}</td>
                  <td>{b.name}</td>
                  <td style={{whiteSpace:"nowrap"}}>{b.phone||"—"}</td>
                  <td>{b.hasReceipt ? <Receipt booking={b} onOpen={onPhoto}/> : <span style={{color:"var(--soft)"}}>—</span>}</td>
                  <td><span className={"pill"+(b.status==="pending"?" wait":b.status==="confirmed"?"":" off")}>{b.status}</span></td>
                  <td>
                    {b.status==="pending" && (
                      <div style={{display:"flex",gap:6}}>
                        <button className="btn btn-sm btn-primary" disabled={busy} onClick={()=>onDecide(b,"confirmed")}>Approve</button>
                        <button className="btn btn-sm btn-danger" disabled={busy} onClick={()=>onDecide(b,"declined")}>Decline</button>
                      </div>
                    )}
                    {b.status==="confirmed" &&
                      <button className="btn btn-sm btn-danger" disabled={busy} onClick={()=>onDecide(b,"cancelled")}>Cancel</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <Pager page={page} setPage={setPage} total={list.length} unit="records"/>
        </div>
      )}
    </div>
  );
}

function ActivityLog({stamp}){
  const [log,setLog] = useState([]);
  const [loading,setLoading] = useState(true);
  const todayKey = toKey(new Date());
  const [from,setFrom] = useState(todayKey), [to,setTo] = useState(todayKey);
  const [page,setPage] = useState(0);
  useEffect(()=>{ let ok=true; setLoading(true);
    loadLog().then(l=>{ if(ok){ setLog(l); setLoading(false); } });
    return ()=>{ ok=false; };
  },[stamp]);
  useEffect(()=>{ setPage(0); },[from,to]);

  /* the stamp is an ISO string, so its first ten characters are the day */
  const list = log.filter(e => {
    const d = (e.ts||"").slice(0,10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
  const shown = list.slice(page*PAGE_SIZE, page*PAGE_SIZE + PAGE_SIZE);

  if (loading) return <div className="card pad"><div className="empty">Loading activity…</div></div>;
  if (!log.length) return <div className="card pad"><div className="empty">Nothing logged yet. Requests, approvals and cancellations show up here.</div></div>;
  return (
    <div className="card pad">
      <div className="filters">
        <DateRange from={from} setFrom={setFrom} to={to} setTo={setTo}/>
        <button className="btn btn-sm" onClick={()=>{setFrom(todayKey); setTo(todayKey);}}>Today</button>
        <button className="btn btn-sm" onClick={()=>{setFrom(""); setTo("");}}>All time</button>
      </div>
      <div className="mini" style={{marginBottom:14}}>
        <b style={{color:"var(--teal-deep)",fontSize:14}}>{list.length}</b> entr{list.length===1?"y":"ies"}
        {from||to ? " in this range" : " logged"}
      </div>
      {!list.length ? <div className="empty">Nothing logged in this range.</div> : shown.map((e,i)=>(
        <div className="logline" key={page*PAGE_SIZE+i}>
          <time>{fmtStamp(e.ts)}</time>
          <div>
            <span className={"pill"+(e.action==="requested"?" wait":["declined","cancelled"].includes(e.action)?" off":"")}>{e.action}</span>
            {" "}<b>{e.name}</b> — {e.detail} <span style={{color:"var(--soft)"}}>({e.by})</span>
          </div>
        </div>
      ))}
      <Pager page={page} setPage={setPage} total={list.length} unit="entries"/>
    </div>
  );
}

/* ===================== OPEN PLAY — CONTINUOUS STACK =====================
   No rounds. There is one queue and six courts. Whenever a court finishes, the
   four who were on it go to the BACK of the queue and the next four waiting at
   the FRONT walk on. Courts never wait for each other.
   A queue entry is a UNIT: one person, a locked pair who always partner, or a
   locked four who only play among themselves. Pulling from the front takes
   whichever units at the head of the queue add up to exactly four, so order is
   respected and nobody gets jumped. Equal games and equal rest fall out of the
   queue itself — you finish, you go to the back. */
const OP_KEY = "court:openplay";
const DEFAULT_GAME_MIN = 20;
const DEFAULT_TARGET = 11;
const byScore = s => (s && s.scoring) === "score";     // playing to a number, not a clock
/* Matched: the four are split into two named teams and the boards show "vs".
   Unmatched: the same four are simply the players on court, no sides.
   No teams is the default — most nights nobody wants sides read out. */
const isMatched = s => !!s && s.matched === true;
/* Manual stacking is the default: the desk decides who goes on, and a finished
   four comes back together at the back of the line. Auto has to be asked for. */
const isAuto = s => !!s && s.mode === "auto";
/* "Ana", "Ana and Jun", "Ana, Jun and Bea" — read out loud, so no Oxford comma */
const listNames = ns => !ns.length ? "" : ns.length === 1 ? ns[0]

  : `${ns.slice(0,-1).join(", ")} and ${ns[ns.length-1]}`;
const TICKER_PXPS = 42;              // ticker speed, pixels per second
const SAMPLE_48 = ["Maria","Jun","Bea","Rico","Ana","Paolo","Kim","Ver","Lito","Grace","Nina","Ram",
  "Joy","Dax","Ella","Migs","Tonio","Cess","Bernie","Kaye","Noel","Rhea","Jomar","Liza",

const pk = (a,b) => a < b ? a+"|"+b : b+"|"+a;

/* ---- timers ---- */
const remainRaw = t => t ? (t.left != null ? t.left : t.dur - Math.floor((Date.now()-t.start)/1000)) : null;
/* score games count up from zero instead of down to it */
const elapsedOf = t => t ? (t.left != null ? Math.max(0, t.dur - t.left) : Math.floor((Date.now()-t.start)/1000)) : null;
const remain = t => { const r = remainRaw(t); return r==null ? null : Math.max(0,r); };
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const clockText = r => r==null ? "—:—" : r>=0 ? mmss(r) : "+"+mmss(-r);

/* =========================== QUEUE ENGINE =========================== */
function applyGame(st, A, B){
  st.partners[pk(A[0],A[1])] = (st.partners[pk(A[0],A[1])]||0)+1;
  st.partners[pk(B[0],B[1])] = (st.partners[pk(B[0],B[1])]||0)+1;
  A.forEach(x => B.forEach(y => { st.opponents[pk(x,y)] = (st.opponents[pk(x,y)]||0)+1; }));
  [...A,...B].forEach(id => { st.games[id] = (st.games[id]||0)+1; });
}
const RECENT_GAMES = 14;   // how far back "you just played with them" counts
const PICK_WINDOW  = 10;   // how far down the queue we may look for a mix

function statsFrom(s){
  const st = {games:{}, partners:{}, opponents:{}, together:{}, recent:{}};
  s.players.forEach(p => { st.games[p.id] = p.handicap||0; });
  const hist = s.history||[];
  hist.forEach(g => {
    applyGame(st, g.teamA, g.teamB);
    const four = [...g.teamA, ...g.teamB];
    for (let a=0;a<four.length;a++) for (let b=a+1;b<four.length;b++)
      st.together[pk(four[a],four[b])] = (st.together[pk(four[a],four[b])]||0)+1;
  });
  hist.slice(-RECENT_GAMES).forEach(g => {
    const four = [...g.teamA, ...g.teamB];
    for (let a=0;a<four.length;a++) for (let b=a+1;b<four.length;b++)
      st.recent[pk(four[a],four[b])] = (st.recent[pk(four[a],four[b])]||0)+1;
  });
  return st;
}
function unitsOf(s){
  const active = s.players.filter(p => p.active !== false);
  const alive = new Set(active.map(p=>p.id)), taken = new Set(), units = [];
  (s.groups||[]).forEach(g => {
    const members = g.members.filter(id => alive.has(id));
    if ((g.mode||"pair") === "crew" && members.length >= 4){
      /* a private group: they take a court to themselves and rotate inside it */
      members.forEach(id => taken.add(id));
      units.push({id:g.id, kind:"crew", all:members, members:members.slice(0,4), size:4});
    } else if (members.length >= 2){
      const m = members.slice(0,2);
      m.forEach(id => taken.add(id));
      units.push({id:g.id, kind:"pair", all:m, members:m, size:2});
    }
  });
  active.forEach(p => { if (!taken.has(p.id)) units.push({id:p.id, kind:"solo", all:[p.id], members:[p.id], size:1}); });
  return units;
}

/* inside a private group of five or more, the four with fewest games go on */
function playingFour(u, st){
  if (u.kind !== "crew" || u.all.length <= 4) return u.members;
  return [...u.all]
    .sort((a,b) => ((st.games[a]||0)-(st.games[b]||0)) || (u.all.indexOf(a)-u.all.indexOf(b)))
    .slice(0,4);
}
const resolve = (units, st) => units.map(u => ({...u, members: playingFour(u, st)}));
const unitIndex = s => { const m={}; unitsOf(s).forEach(u=>m[u.id]=u); return m; };

/* the first units in the queue that add up to exactly four */
function fillCourt(units, need){
  if (need === 0) return [];
  for (let i=0; i<units.length; i++){
    if (units[i].size > need) continue;
    const rest = fillCourt(units.slice(i+1), need-units[i].size);
    if (rest) return [units[i], ...rest];
  }
  return null;
}
function bestSplit(ids, st){
  const [a,b,c,d] = ids;
  const opts = [[[a,b],[c,d]], [[a,c],[b,d]], [[a,d],[b,c]]];
  let best = opts[0], bestScore = Infinity;
  for (const [t1,t2] of opts){
    let sc = ((st.partners[pk(t1[0],t1[1])]||0) + (st.partners[pk(t2[0],t2[1])]||0)) * 10;
    t1.forEach(x => t2.forEach(y => { sc += (st.opponents[pk(x,y)]||0); }));
    if (sc < bestScore){ bestScore = sc; best = [t1,t2]; }
  }
  return best;
}
function makeTeams(units, st){
  if (units.length === 1) return bestSplit(units[0].members, st);
  if (units.length === 2){
    const [u,v] = units;
    if (u.size === 2 && v.size === 2) return [u.members, v.members];
    const g = u.size === 3 ? u : v, s = u.size === 3 ? v : u;
    return [[g.members[0],g.members[1]], [g.members[2], s.members[0]]];
  }
  if (units.some(u => u.size === 2)){
    const pair = units.find(u => u.size === 2);
    return [pair.members, units.filter(u=>u.size===1).map(u=>u.members[0])];
  }
  return bestSplit(units.map(u=>u.members[0]), st);
}

/* who walks on next, and after that, and after that — straight off the queue */
/* ---------------------------------------------------------------------------
   The line-up is REAL, not recalculated. Everyone waiting is assigned to a
   numbered stack the moment there's room, and that assignment sticks — if
   you're in stack 8 you stay in stack 8 until you play. A stack can sit with
   two people in it; the empty places fill as others finish and rejoin the back
   of the queue. Auto mode only decides WHO joins a stack when a place opens;
   it never re-shuffles a stack that's already formed.
--------------------------------------------------------------------------- */
const MAX_PENDING = 30;
const sizeOfUnits = (ids, idx) => (ids||[]).reduce((n,id)=>n+((idx[id]||{}).size||0), 0);
const assignedIds = s => new Set((s.pending||[]).flatMap(x => x.units||[]));

/* choose units to fill `need` places, mixing away from who they just played */
function pickUnits(avail, st, need, mode, withIds){
  if (need <= 0) return [];
  if (!avail.length) return null;
  if (mode === "manual") return fillCourt(avail, need);
  const win = avail.slice(0, PICK_WINDOW);
  const combos = [];
  (function walk(from, chosen, left){
    if (combos.length > 400) return;
    if (left === 0){ combos.push([...chosen]); return; }
    for (let i=from; i<win.length; i++){
      if (win[i].size > left) continue;
      chosen.push(win[i]); walk(i+1, chosen, left-win[i].size); chosen.pop();
    }
  })(0, [], need);
  if (!combos.length) return fillCourt(avail, need);
  let best = combos[0], bestScore = Infinity;
  combos.forEach(c => {
    const ids = [...(withIds||[]), ...c.flatMap(u => u.all || u.members)];
    let sc = 0;
    for (let a=0;a<ids.length;a++) for (let b=a+1;b<ids.length;b++)
      sc += (st.recent[pk(ids[a],ids[b])]||0)*6 + (st.together[pk(ids[a],ids[b])]||0);
    sc += c.reduce((n,u) => n + win.indexOf(u), 0) * 2;                        // stay near the front
    sc += c.flatMap(u => u.all||u.members).reduce((n,id) => n + (st.games[id]||0), 0) * 2;
    if (sc < bestScore){ bestScore = sc; best = c; }
  });
  return best;
}

/* take as many as we can, even if it's fewer than the places free —
   all-or-nothing was leaving a trail of one-player stacks */
function pickUpTo(avail, st, need, mode, withIds){
  for (let n=need; n>=1; n--){
    const got = pickUnits(avail, st, n, mode, withIds);
    if (got && got.length) return got;
  }
  return null;
}

/* Auto: everyone is assigned a stack and part-filled stacks top themselves up.
   Manual: nothing is assigned automatically — free players sit in the pool
   until you drag them in, and a foursome that finishes comes back together. */
function refill(s){
  const idx = unitIndex(s);
  const st = statsFrom(s);
  const pending = (s.pending||[])
    .map(x => ({...x, units:(x.units||[]).filter(id => idx[id])}))
    .filter(x => x.units.length || x.manual);
  const taken = new Set(pending.flatMap(x => x.units));
  /* dragged out to the free pool by hand — auto stacking leaves them there
     until someone drags them back in, otherwise they'd bounce straight back */
  const benched = new Set(s.bench||[]);
  /* someone locked into a pair while they are still mid-game must not be stacked
     onto a second court — their unit sits out until that game ends */
  const busyNow = new Set(onCourtIds(s));
  let avail = (s.queue||[]).map(id => idx[id])
    .filter(u => u && !taken.has(u.id) && !benched.has(u.id)
      && !(u.all || u.members).some(id => busyNow.has(id)));

  if (isAuto(s)){
    pending.forEach(stack => {
      if (stack.manual && !stack.units.length) return;    // an empty hand-made stack waits for you
      let need = 4 - sizeOfUnits(stack.units, idx);
      while (need > 0 && avail.length){
        const withIds = stack.units.flatMap(id => (idx[id].all || idx[id].members));
        const fill = pickUpTo(avail, st, need, "auto", withIds);
        if (!fill) break;
        fill.forEach(u => stack.units.push(u.id));
        avail = avail.filter(u => !fill.includes(u));
        need = 4 - sizeOfUnits(stack.units, idx);
      }
    });

    while (avail.length && pending.length < MAX_PENDING){
      const head = avail[0];
      avail = avail.slice(1);
      const rest = head.size < 4 ? pickUpTo(avail, st, 4-head.size, "auto", head.all || head.members) : [];
      const units = [head, ...(rest || [])];
      if (rest) avail = avail.filter(u => !rest.includes(u));
      pending.push({id:makeId(), units:units.map(u=>u.id)});
    }
  }

  pending.forEach(x => {
    const full = sizeOfUnits(x.units, idx) === 4;
    if (full && !x.teams){
      const chosen = x.units.map(id => idx[id]).filter(Boolean);
      const [A,B] = makeTeams(resolve(chosen, st), st);
      x.teams = [A,B];
    }
    if (!full) x.teams = null;
  });
  return {...s, pending};
}

/* what the boards show — read straight off the stored line-up */
function onDeck(s, howMany){
  const idx = unitIndex(s);
  const games = (s.pending||[]).slice(0, howMany||99).map(x => {
    const chosen = (x.units||[]).map(id => idx[id]).filter(Boolean);
    const players = chosen.flatMap(u => u.all || u.members);
    const full = players.length === 4;
    const teamA = x.teams ? x.teams[0] : players.slice(0,2);
    const teamB = x.teams ? x.teams[1] : players.slice(2,4);
    return {teamA, teamB, unitIds:x.units||[], stackId:x.id, full, manual:!!x.manual, players};
  });
  const taken = assignedIds(s);
  const waiting = (s.queue||[]).filter(id => !taken.has(id))
    .flatMap(id => { const u = idx[id]; return u ? (u.all || u.members) : []; });
  return {games, waiting};
}

/* Whatever unit those players belong to NOW. A pair locked while they were
   mid-game, or a group unlocked mid-game, leaves the court holding unit ids that
   no longer exist — going by the players themselves means nobody falls out. */
function unitsFor(s, playerIds){
  const idx = unitIndex(s);
  const out = [];
  playerIds.forEach(pid => {
    const u = Object.values(idx).find(x => (x.all || x.members).indexOf(pid) >= 0);
    if (u && out.indexOf(u.id) < 0) out.push(u.id);
  });
  return out;
}

/* a court finished: those four go to the back, the next full stack walks on */
function rotate(s, court, autoStart = true){
  let next = {...s,
    queue:[...(s.queue||[])], live:{...(s.live||{})},
    history:[...(s.history||[])], pending:[...(s.pending||[])].map(x=>({...x, units:[...(x.units||[])]}))};
  const cur = next.live[court];
  if (cur){
    const four = [...cur.teamA, ...cur.teamB].filter(Boolean);
    next.history.push({court, teamA:cur.teamA, teamB:cur.teamB, endedAt:new Date().toISOString()});
    delete next.live[court];
    const back = unitsFor(next, four);
    next.queue = [...next.queue.filter(id => back.indexOf(id) < 0), ...back];
    /* same four, same teams, back of the line — but only when they still add up
       to a court between them; a mid-game lock can tangle them with others */
    if (!isAuto(s) && sizeOfUnits(back, unitIndex(next)) === 4)
      next.pending = [...next.pending, {id:makeId(), units:[...back], teams:[cur.teamA, cur.teamB]}];
  }
  next = refill(next);
  const idx = unitIndex(next);
  const busyNow = new Set(onCourtIds(next));
  const free = x => !(x.units||[]).some(id =>
    (idx[id] ? (idx[id].all || idx[id].members) : []).some(pid => busyNow.has(pid)));
  const at = (next.pending||[]).findIndex(x => sizeOfUnits(x.units, idx) === 4 && free(x));
  let stack = at >= 0 ? next.pending[at] : null;
  let fromPending = at;

  /* The four who just came off are put back together as a stack, so on a quiet
     night they were the only COMPLETE stack and walked straight back on —
     jumping anyone waiting in a stack of two or three, who then never played.
     If the stack we picked is the one that just finished and somebody else is
     free, build the four from the front of the queue instead. That is the rule
     the queue is meant to run on: whoever is at the head of the line goes on. */
  const backNow = cur ? unitsFor(next, [...cur.teamA, ...cur.teamB].filter(Boolean)) : [];
  const sameFour = stack && backNow.length && stack.units.length === backNow.length
    && stack.units.every(u => backNow.indexOf(u) >= 0);
  const freeUnit = u => u && !(u.all || u.members).some(pid => busyNow.has(pid));
  const othersWaiting = (next.queue||[])
    .some(id => backNow.indexOf(id) < 0 && freeUnit(idx[id]));
  if (sameFour && othersWaiting){ stack = null; fromPending = -1; }

  /* Nothing complete to send on — take the first units in the queue that add up
     to exactly four. This mixes whoever was waiting with the players who have
     been resting longest, instead of leaving the court empty. */
  if (!stack){
    const avail = (next.queue||[]).map(id => idx[id]).filter(freeUnit);
    const picked = fillCourt(avail, 4);
    if (picked) stack = {id:makeId(), units:picked.map(u => u.id)};
  }

  if (stack){
    if (fromPending >= 0) next.pending = next.pending.filter((_,i) => i !== fromPending);
    /* whoever is going on must not be left sitting in another stack as well */
    next.pending = (next.pending||[]).map(x => {
      const kept = (x.units||[]).filter(id => stack.units.indexOf(id) < 0);
      return kept.length === (x.units||[]).length ? x : {...x, units:kept, teams:null};
    });
    const chosen = stack.units.map(id => idx[id]).filter(Boolean);
    const st = statsFrom(next);
    const [A,B] = stack.teams || makeTeams(resolve(chosen, st), st);
    next.live[court] = {units:stack.units, teamA:A, teamB:B,
      timer: autoStart ? {start:Date.now(), dur:(s.gameLength||DEFAULT_GAME_MIN)*60} : null,
      startedAt:new Date().toISOString()};
    next.queue = next.queue.filter(id => !stack.units.includes(id));
  }
  return refill(next);
}
const onCourtIds = s => Object.values(s.live||{}).flatMap(g => [...g.teamA, ...g.teamB]);

/* =========================== ROSTER EDITOR =========================== */
function Roster({players, groups, onAdd, onRemove, onRename, onGroup, onUngroup, st, busyIds}){
  const [name,setName] = useState("");
  const [sel,setSel] = useState([]);
  const [editing,setEditing] = useState(null);
  const [draft,setDraft] = useState("");
  const inputRef = useRef(null);
  const [err,setErr] = useState("");
  const active = players.filter(p=>p.active!==false);
  const busy = new Set(busyIds||[]);
  /* Two Nicoles on the board is nobody's friend — the TV, the call-outs and
     the player's own phone all find people by name. Case and stray spaces
     don't make a name different. Someone who has left frees theirs up. */
  const clash = (n, exceptId) => active.find(p =>
    p.id !== exceptId && p.name.trim().toLowerCase() === n.trim().toLowerCase());
  const groupOf = id => (groups||[]).find(g => g.members.includes(id) && g.members.filter(m=>active.some(p=>p.id===m)).length>=2);
  const add = () => {
    const n = name.trim();
    if (!n) return;
    const taken = clash(n);
    if (taken){
      setErr(`${taken.name} is already on the list — use a different name, like "${taken.name} B".`);
      inputRef.current && inputRef.current.select();
      return;
    }
    setErr(""); onAdd(n); setName("");
    inputRef.current && inputRef.current.focus();
  };
  const toggle = id => { if (groupOf(id) || busy.has(id)) return;
    setSel(v => v.includes(id) ? v.filter(x=>x!==id) : v.length<4 ? [...v,id] : v); };

  return (
    <>
      <div className="field">
        <span className="label">Add a player</span>
        <div style={{display:"flex", gap:9}}>
          <input ref={inputRef} value={name} placeholder="Name"
            onChange={e=>{setName(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&add()}/>
          <button className="btn btn-primary" onClick={add} disabled={!name.trim()}>Add</button>
        </div>
        {err && <div className="msg err" style={{marginTop:10}}>{err}</div>}
      </div>

      {active.length === 0 ? (
        <p className="mini">Nobody in yet. Type a name and press enter — the field stays ready for the next one.</p>
      ) : (
        <>
          <div className="label">{active.length} in · tap to select</div>
          <div className="rest-chips">
            {active.map(p => editing===p.id ? (
              <span className="chip-p editing" key={p.id}>
                <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
                  onKeyDown={e=>{
                    if (e.key==="Enter" && draft.trim()){
                      const taken = clash(draft, p.id);
                      if (taken){ setErr(`${taken.name} is already on the list — use a different name.`); return; }
                      setErr(""); onRename(p.id, draft.trim()); setEditing(null);
                    }
                    if (e.key==="Escape"){ setErr(""); setEditing(null); }
                  }}
                  onBlur={()=>{
                    const d = draft.trim();
                    if (d && d !== p.name){
                      const taken = clash(d, p.id);
                      /* clicking away with a name that is taken leaves the old one alone */
                      if (taken) setErr(`${taken.name} is already on the list — ${p.name} was left as they were.`);
                      else { setErr(""); onRename(p.id, d); }
                    }
                    setEditing(null);
                  }}/>
              </span>
            ) : (
              <span key={p.id}
                className={"chip-p"+(sel.includes(p.id)?" on":"")+(groupOf(p.id)?" locked":"")+(busy.has(p.id)?" playing":"")}
                onClick={()=>toggle(p.id)}
                title={busy.has(p.id) ? "On court right now — you can still rename them" : groupOf(p.id) ? "Locked in a group" : "Tap to select"}>
                {p.name}
                {st && <b className="chip-n">({st.games[p.id]||0})</b>}
                {onRename && <button className="chip-x pen"
                  title={busy.has(p.id) ? `Rename ${p.name} — works while they're on court` : "Rename "+p.name}
                  aria-label={"Rename "+p.name}
                  onClick={e=>{e.stopPropagation(); setDraft(p.name); setEditing(p.id);}}>✎</button>}
                <button className="chip-x" onClick={e=>{e.stopPropagation(); onRemove(p.id);}} aria-label={"Remove "+p.name}>×</button>
              </span>
            ))}
          </div>
        </>
      )}

      {sel.length>0 && (
        <div className="selbar">
          <span>{sel.length} selected</span>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            {sel.length===2 && <button className="btn btn-sm btn-primary" onClick={()=>{onGroup(sel,"pair"); setSel([]);}}>Lock as a pair</button>}
            {sel.length===4 && <button className="btn btn-sm btn-primary" onClick={()=>{onGroup(sel,"crew"); setSel([]);}}>Lock as a four — they only play each other</button>}
            {sel.length===3 && <span className="mini">Three won't fill a court. Pick one more for a four, or drop one for a pair</span>}
            {sel.length===1 && <span className="mini">Pick one more for a pair, or three more for a four</span>}
            <button className="btn btn-sm btn-ghost" onClick={()=>setSel([])}>Clear</button>
          </div>
        </div>
      )}

      {(groups||[]).some(g=>g.members.filter(id=>active.some(p=>p.id===id)).length>=2) && (
        <div style={{marginTop:16}}>
          <div className="label">Locked groups</div>
          {(groups||[]).map(g => {
            const mem = g.members.filter(id=>active.some(p=>p.id===id));
            if (mem.length<2) return null;
            const nm = id => (players.find(p=>p.id===id)||{}).name;
            return (
              <div className="lockrow" key={g.id}>
                <span className={"lock-kind"+((g.mode||"pair")==="crew"?" crew":"")}>
                  {(g.mode||"pair")==="crew" ? "Locked four" : "Pair"}</span>
                <span style={{flex:1}}>{mem.map(nm).join(" · ")}</span>
                <button className="btn btn-sm btn-ghost" onClick={()=>onUngroup(g.id)}>Unlock</button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

/* ---------- line-up editor: drag a player onto another to swap them ---------- */
function LockIcon(){
  return <svg className="lu-lock" width="9" height="9" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="5" y="10.5" width="14" height="10" rx="2.4" fill="currentColor"/>
    <path d="M8.4 10.5V7.8a3.6 3.6 0 0 1 7.2 0v2.7" stroke="currentColor" strokeWidth="2.4"/></svg>;
}

function LineUp({s, name, onSwap, onFront, onAddStack, onDropInStack, onPullFromStack, onPullToSpare, onDropStack, onReorder, compact}){
  const [drag,setDrag] = useState(null);
  const [over,setOver] = useState(null);
  const [ghost,setGhost] = useState(null);
  const [cardDrag,setCardDrag] = useState(null);
  const [cardOver,setCardOver] = useState(null);
  /* tap-to-place, for a touchscreen at the desk where dragging is fiddly:
     arm a free player, then tap the stack they should join */
  const [assign,setAssign] = useState(false);
  const [armed,setArmed] = useState(null);
  const overRef = useRef(null);
  const cardOverRef = useRef(null);
  const st = statsFrom(s);
  const idx = unitIndex(s);
  const deck = onDeck(s, 99);
  const matched = isMatched(s);

  const unitOf = pid => Object.values(idx).find(u => (u.all||u.members).includes(pid));
  const inGames = new Set(deck.games.flatMap(g => g.unitIds));
  const spare = (s.queue||[]).map(id => idx[id]).filter(u => u && !inGames.has(u.id));

  const grab = (e, unit, label, tap) => {
    e.preventDefault();
    const from = {x:e.clientX, y:e.clientY};
    let moved = false;
    const move = ev => {
      if (!moved){
        /* a few pixels of slop, so a tap on a name isn't read as a drag */
        if (Math.abs(ev.clientX-from.x) + Math.abs(ev.clientY-from.y) < 6) return;
        moved = true;
        setDrag(unit.id);
      }
      setGhost(g => g ? {...g, x:ev.clientX, y:ev.clientY} : {x:ev.clientX, y:ev.clientY, label});
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const hit = el && el.closest && el.closest("[data-unit]");
      const box = el && el.closest && el.closest("[data-stack]");
      const pool = el && el.closest && el.closest("[data-spare]");
      if (hit && hit.getAttribute("data-unit") !== unit.id)
        overRef.current = {kind:"unit", id:hit.getAttribute("data-unit")};
      else if (pool)
        overRef.current = {kind:"spare", id:"spare"};
      else if (box && !hit)
        overRef.current = {kind:"stack", id:box.getAttribute("data-stack")};
      else overRef.current = null;
      setOver(overRef.current);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      const target = overRef.current;
      setDrag(null); setOver(null); setGhost(null); overRef.current = null;
      if (!moved){ if (tap) tap(unit); return; }
      if (!target) return;
      if (target.kind === "stack") onDropInStack(target.id, unit.id);
      else if (target.kind === "spare") onPullToSpare(unit.id);
      else onSwap(unit.id, target.id);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };

  const grabCard = (e, sid, label) => {
    e.preventDefault(); e.stopPropagation();
    setCardDrag(sid); setGhost({x:e.clientX, y:e.clientY, label});
    const move = ev => {
      setGhost(g => g ? {...g, x:ev.clientX, y:ev.clientY} : g);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const box = el && el.closest && el.closest("[data-stack]");
      const id = box ? box.getAttribute("data-stack") : null;
      cardOverRef.current = (id && id !== sid) ? id : null;
      setCardOver(cardOverRef.current);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      const target = cardOverRef.current;
      setCardDrag(null); setCardOver(null); setGhost(null); cardOverRef.current = null;
      if (target) onReorder(sid, target);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };

  if (!(s.queue||[]).length)
    return <p className="mini" style={{marginTop:12, padding:compact?"0 2px":0}}>
      Nobody waiting — everyone is on court.</p>;

  const pending = s.pending || [];
  const empties = pending.filter(x => !(x.units||[]).length);
  const stackOf = uid => pending.find(x => (x.units||[]).includes(uid));

  /* A plain function, NOT a component. Declared as a component inside this
     render it would be a new type on every pass, so React would throw away
     every chip and its buttons twice a second with the clock tick — hover kept
     resetting and any click that straddled a rebuild was simply lost. */
  const chipFor = (pid, sid, key) => {
    const u = unitOf(pid);
    if (!u) return <span className="lu-chip" key={key}>{name(pid)}</span>;
    /* pulling someone out sticks in both modes now — they land on the bench in
       the free pool, so auto stacking won't put them straight back */
    const held = sid && stackOf(u.id);
    return (
      <span data-unit={u.id} key={key}
        className={"lu-chip"+(drag===u.id?" lifted":"")+(over&&over.id===u.id?" target":"")+(u.size>1?" tied":"")}
        onPointerDown={e=>grab(e, u, name(pid))}>
        {u.kind!=="solo" && <LockIcon/>}
        <span className="lu-nm">{name(pid)}</span>
        <b>({st.games[pid]||0})</b>
        {held && <button className="chip-x" title="Take out of the stack"
          aria-label={"Take "+name(pid)+" out of the stack"}
          onPointerDown={e=>e.stopPropagation()}
          onClick={e=>{e.stopPropagation(); onPullFromStack(held.id, u.id);}}>×</button>}
      </span>
    );
  };

  const grid = (
      <div className="lineup">
        {deck.games.map((g,i)=>{
          const sid = g.stackId;
          const slot = (pid,k) => pid
            ? chipFor(pid, sid, k)
            : <span className="lu-slot" key={"s"+k}>waiting for a player</span>;
          return (
            <div key={sid} data-stack={sid}
              className={"lu-card"+(i===0?" first":"")+(g.manual?" stackcard":"")
                +(!g.full?" partial":"")+(over&&over.kind==="stack"&&over.id===sid&&!g.full?" hot":"")
                +(cardDrag===sid?" lifted":"")+(cardOver===sid?" shifting":"")}>
              <div className="lu-head">
                <button className="cardgrip" title="Drag to reorder the stacks"
                  onPointerDown={e=>grabCard(e, sid, i===0?"Up next":`Stack ${i+1}`)}>
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                    <circle cx="5" cy="3" r="1.3"/><circle cx="11" cy="3" r="1.3"/>
                    <circle cx="5" cy="8" r="1.3"/><circle cx="11" cy="8" r="1.3"/>
                    <circle cx="5" cy="13" r="1.3"/><circle cx="11" cy="13" r="1.3"/>
                  </svg>
                </button>
                <span className={"qbadge"+(i===0?" now":"")}>
                  {i===0 ? "Up next" : `Stack ${i+1}`}
                </span>
                <span style={{display:"flex", gap:4}}>
                  {i>0 && <button className="qtop" title="Move to the front"
                    onClick={()=>onFront(g.unitIds)}>⤒</button>}
                  <button className="qtop" title="Clear this stack" onClick={()=>onDropStack(sid)}>×</button>
                </span>
              </div>
              {matched ? (
                <>
                  <div className="lu-team">{slot(g.teamA[0],0)}{slot(g.teamA[1],1)}</div>
                  <div className="lu-vs"><span>vs</span></div>
                  <div className="lu-team">{slot(g.teamB[0],2)}{slot(g.teamB[1],3)}</div>
                </>
              ) : (
                <div className="lu-team">
                  {[g.teamA[0],g.teamA[1],g.teamB[0],g.teamB[1]].map((pid,k)=>slot(pid,k))}
                </div>
              )}
              {!g.full && <span className="stacknote">{isAuto(s)
                ? "Fills as players finish" : "Drag someone in, or send it on short"}</span>}
            </div>
          );
        })}

        {!compact && (
          <button className="lu-card addcard" onClick={onAddStack}>
            <span className="addplus">+</span>
            <b>Add a stack</b>
            <span className="mini">Drag names in — it can go on with fewer than four</span>
          </button>
        )}
      </div>
  );

  const arm = u => { setArmed(v => v === u.id ? null : u.id); setAssign(true); };
  const chips = spare.map(u => (
    <span key={u.id} data-unit={u.id}
      className={"lu-chip"+(drag===u.id?" lifted":"")+(over&&over.id===u.id?" target":"")
        +(u.size>1?" tied":"")+(armed===u.id?" armed":"")}
      onPointerDown={e=>grab(e, u, name((u.all||u.members)[0]), arm)}>
      {u.kind!=="solo" && <LockIcon/>}
      <span className="lu-nm">{(u.all||u.members).map(name).join(u.kind==="crew"?", ":" + ")}</span>
      {u.kind==="solo" && <b>({st.games[u.all[0]]||0})</b>}
    </span>
  ));
  const hot = over && over.kind==="spare" ? " hot" : "";

  /* every stack that could still take the armed player — or, before anyone is
     armed, every stack with a gap at all */
  const armedUnit = armed ? idx[armed] : null;
  const room = deck.games.map((g,i) => ({
    id: g.stackId,
    label: i === 0 ? "Up next" : `Stack ${i+1}`,
    free: 4 - sizeOfUnits(g.unitIds, idx)
  })).filter(r => r.free > 0 && (!armedUnit || r.free >= armedUnit.size));
  const armedName = armedUnit ? (armedUnit.all || armedUnit.members).map(name).join(" + ") : "";
  const sendTo = sid => { onDropInStack(sid, armed); setArmed(null); };
  const closeAssign = () => { setAssign(false); setArmed(null); };

  const assignBar = assign && (
    <div className="dc-assign">
      {armed ? (
        <>
          <b>Send {armedName} to</b>
          <div className="dc-assignrow">
            {room.map(r => (
              <button key={r.id} onClick={()=>sendTo(r.id)}>{r.label} · {r.free} open</button>
            ))}
            <button className="new" onClick={()=>{ onAddStack(armed); setArmed(null); }}>+ New stack</button>
          </div>
        </>
      ) : (
        <>
          <b>Stacks with room</b>
          <div className="dc-assignrow">
            {room.length
              ? room.map(r => <button key={r.id} disabled>{r.label} · {r.free} open</button>)
              : <span className="mini">Every stack is full — start a new one.</span>}
          </div>
          <span className="mini" style={{flex:"none"}}>Tap a name below</span>
        </>
      )}
      <button className="dc-assigndone" onClick={closeAssign}>Done</button>
    </div>
  );

  /* On the console the bench is a pinned footer, not the end of a long scroll —
     the desk needs a walk-in dropped onto a stack without scrolling to find them. */
  if (compact) return (
    <>
      <div className="dc-scroll">{grid}</div>
      {assignBar}
      <div data-spare="1" className={"dc-bench"+hot}>
        <div className="dc-benchlab">
          <b>Free players</b>
          <span>{assign ? "Tap one, then a stack" : "Drag onto any stack"}</span>
        </div>
        <div className="dc-benchrow">
          {chips.length ? chips
            : <span className="mini">Everyone is in a stack — drop a name here to pull them out.</span>}
        </div>
        {/* while the bar is open it carries its own Done — one is enough */}
        {!assign && <button className="dc-send" onClick={()=>setAssign(true)}>Send to a stack…</button>}
      </div>
      {ghost && <span className="lu-ghost" style={{left:ghost.x, top:ghost.y}}>{ghost.label}</span>}
    </>
  );

  return (
    <>
      {grid}
      <div data-spare="1" className={"lu-spare"+hot}>
        <div className="label" style={{marginBottom:8}}>
          Free players — drag one in to stack them, or drag a name down here to take them out
        </div>
        {!spare.length && <p className="mini" style={{marginBottom:8}}>
          Everyone is in a stack. Drop a name here to pull them out.</p>}
        <div className="lu-team wrap">{chips}</div>
      </div>
      {ghost && <span className="lu-ghost" style={{left:ghost.x, top:ghost.y}}>{ghost.label}</span>}
    </>
  );
}

/* =========================== CONTROL PAGE =========================== */
function OpenPlay({admin, say}){
  const [s, ready] = useLiveSession(3000);
  const [local,setLocal] = useState(null);
  const [, setTick] = useState(0);
  const [tvFallback,setTvFallback] = useState(false);
  const [showShare,setShowShare] = useState(false);
  const [settings,setSettings] = useState(false);   // the gear drawer, shut until asked for
  const [zoom,setZoom] = useState(false);           // the stacks, blown up over the whole screen
  /* Cards or compact rows for the courts. A desk running six courts sets this
     once and wants it to stick, so it lives in the browser, not the session. */
  const [courtView,setCourtView] = useState(() => {
    try { return localStorage.getItem("pt:courtview") === "rows" ? "rows" : "cards"; }
    catch { return "cards"; }
  });
  const pickView = v => { setCourtView(v); try { localStorage.setItem("pt:courtview", v); } catch {} };
  const cur = local || s;

  useEffect(()=>{ setLocal(null); },[s && s.id]);
  useEffect(()=>{ const i=setInterval(()=>setTick(t=>t+1),500); return ()=>clearInterval(i); },[]);

  /* the console is meant to be exactly one screenful, so measure the nav bar
     rather than guess at its height — it changes when the links wrap */
  useEffect(()=>{
    if (!admin) return;
    const fit = () => {
      const nav = document.querySelector("nav");
      document.documentElement.style.setProperty("--dc-nav", (nav ? nav.offsetHeight : 57)+"px");
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  },[admin]);

  useEffect(()=>{
    if (!zoom) return;
    const esc = e => { if (e.key === "Escape") setZoom(false); };
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  },[zoom]);

  /* chime once when a court's clock runs out — the board is across the hall */
  const alerted = useRef({});
  useEffect(()=>{
    if (!admin || !cur || !cur.live || byScore(cur)) return;
    Object.keys(cur.live).forEach(c => {
      const g = cur.live[c];
      if (!g || !g.timer) return;
      const r = remainRaw(g.timer);
      const key = c+":"+(g.startedAt||"");
      if (r != null && r <= 0 && !alerted.current[key]){
        alerted.current[key] = true;
        chime();
        say(`${CLUB.courts[c]} — time's up`);
      }
    });
  });

  const save = async next => {
    setLocal(next);
    try { await store.set(OP_KEY, JSON.stringify(next)); shout({type:"session"}); }
    catch { say("Couldn't save the session"); }
  };
  /* courts changed, or the session started or ended — redo its bookings */
  const saveCourts = async next => { await save(next); syncOpenPlayCourts(next); };

  if (!ready) return <div className="wrap"><div className="card pad"><div className="empty">Loading open play…</div></div></div>;
  if (!cur || cur.status!=="running" || !cur.pending)
    return <div className="wrap"><Setup admin={admin} onStart={saveCourts}/><div style={{height:60}}/></div>;

  const name = id => (cur.players.find(p=>p.id===id)||{}).name || "—";
  const active = cur.players.filter(p=>p.active!==false);
  const st = statsFrom(cur);
  const playing = onCourtIds(cur);
  const deck = onDeck(cur, cur.courts.length);
  const nextGame = deck.games[0];

  /* Never read the empty slots out. A stack of two used to come out as
     "Nicole and, against and" — now it says plainly that it isn't full yet. */
