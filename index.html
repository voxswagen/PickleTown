  const callGame = (g, lead) => {
    const four = (g.players || [...(g.teamA||[]), ...(g.teamB||[])]).filter(Boolean);
    const named = four.map(name);
    if (named.length < 4){
      const short = 4 - named.length;
      const who = named.length
        ? `So far we have ${listNames(named)}.`
        : "Nobody in it yet.";
      return `${lead} The stack is still incomplete. ${who} We need ${short} more player${short===1?"":"s"}.`;
    }
    if (!isMatched(cur)) return `${lead} ${listNames(named)}.`;
    return `${lead} ${name(g.teamA[0])} and ${name(g.teamA[1])}, against ${name(g.teamB[0])} and ${name(g.teamB[1])}.`;
  };


  const finish = court => {
    const before = ((cur.live||{})[court] || {});
    const next = rotate(cur, court, true);
    save(next);
    const g = (next.live||{})[court];
    if (g){
      shout({type:"announce", text: callGame(g, `${CLUB.courts[court]}, walk on now.`)});
      /* tell the desk who walked on — with a short queue the same faces can come
         straight back, and without this it looks as though nothing happened */
      const who = [g.teamA[0], g.teamA[1], g.teamB[0], g.teamB[1]].filter(Boolean).map(name);
      const stayed = [...(before.teamA||[]), ...(before.teamB||[])]
        .filter(id => [...g.teamA, ...g.teamB].includes(id)).length;
      say(`${CLUB.courts[court]} — ${listNames(who)} on`
        + (stayed ? ` · ${stayed} stayed on, nobody else was free` : ""));
    } else {
      say(`${CLUB.courts[court]} is free — not enough players waiting to fill it`);
    }
  };
  const bumpTimer = (court, delta) => {
    const g = (cur.live||{})[court];
    if (!g || !g.timer) return;
    const t = g.timer;
    setTimer(court, t.left!=null ? {...t, left:Math.max(0,t.left+delta)} : {...t, start:t.start+delta*1000});
  };
  const resetTimer = court => setTimer(court, {start:Date.now(), dur:(cur.gameLength||DEFAULT_GAME_MIN)*60});
  const startIdle = () => {
    const live = {...(cur.live||{})};
    let n = 0;
    Object.keys(live).forEach(c => {
      if (!live[c].timer){ live[c] = {...live[c], timer:{start:Date.now(), dur:(cur.gameLength||DEFAULT_GAME_MIN)*60}}; n++; }
    });
    if (!n){ say("Every court is already running"); return; }
    save({...cur, live});
    say(n===1 ? "One clock started" : `${n} clocks started`);
  };
  const setTimer = (court, t) => {
    const live = {...cur.live};
    if (!live[court]) return;
    live[court] = {...live[court], timer:t};
    save({...cur, live});
  };
  /* 1. Late arrivals go to the BACK of the line. Auto-fill used to drop them
     into the first stack with a gap, which jumped everyone already waiting —
     now they take the last stack that still has room, or start a new one. */
  const addPlayer = n => {
    const handicap = active.length ? Math.min(...active.map(p=>st.games[p.id]||0)) : 0;
    const p = {id:makeId(), name:n, seq:cur.players.length, handicap, active:true};
    let next = {...cur, players:[...cur.players, p], queue:[...(cur.queue||[]), p.id]};
    const idx = unitIndex(next);
    const pending = (next.pending||[]).map(x => ({...x, units:[...(x.units||[])]}));
    /* only ever the LAST stack. A gap nearer the front belongs to whoever is
       still on court — dropping a walk-in into it jumps the whole line. */
    const last = pending.length - 1;
    const room = last >= 0 && sizeOfUnits(pending[last].units, idx) < 4;
    if (room){ pending[last].units.push(p.id); pending[last].teams = null; }
    else pending.push({id:makeId(), units:[p.id]});
    save(refill({...next, pending}));
    say(room ? `${n} added to stack ${pending.length} — the last one in the line`
             : `${n} added — new stack at the back of the line`);
  };
  const renamePlayer = (id, next) => {
    save({...cur, players: cur.players.map(p => p.id===id ? {...p, name:next} : p)});
    say("Name updated");
  };
  const removePlayer = id => {
    if (playing.includes(id)){
      say("They're on court — tap their name on the court to hand the slot to someone else");
      return;
    }
    /* taking one out of a locked four used to leave a live group of three that
       could never fill a court — unlock it first and the choice is deliberate */
    const held = (cur.groups||[]).find(g => g.members.includes(id)
      && g.members.filter(m => active.some(p => p.id === m)).length >= 2);
    if (held){
      const who = (cur.players.find(p=>p.id===id)||{}).name || "That player";
      say((held.mode||"pair") === "crew"
        ? `${who} is in a locked four — unlock it first, then remove them`
        : `${who} is locked as a partner — unlock the pair first, then remove them`);
      return;
    }
    save(refill({...cur,
      players: cur.players.map(p=>p.id===id?{...p,active:false}:p),
      queue: (cur.queue||[]).filter(q=>q!==id),
      pending: (cur.pending||[]).map(x=>({...x, units:(x.units||[]).filter(u=>u!==id), teams:null})),
      groups: (cur.groups||[]).map(g=>({...g, members:g.members.filter(m=>m!==id)}))}));
    say("Taken out of the queue");
  };
  /* Locking and unlocking should change who is tied to whom, and nothing else.
     A group unit takes exactly as many seats as it has people — a pair is two,
     a locked four is four — so swapping one for the other inside a stack always
     adds up, and the line-up the desk built by hand survives untouched. */
  const dropFromStacks = drop => (cur.pending||[])
    .map(x => ({...x, units:(x.units||[]).filter(id => drop.indexOf(id) < 0), teams:null}));

  const group = (ids, mode) => {
    const g = {id:makeId(), members:ids, mode:mode || (ids.length>=4 ? "crew" : "pair")};
    const q = (cur.queue||[]).filter(x=>!ids.includes(x));
    const at = Math.min(...ids.map(id => (cur.queue||[]).indexOf(id)).filter(i=>i>=0));
    /* everyone in it is mid-game: Math.min of nothing is Infinity, so they join
       at the back, which is where they belong until that game finishes */
    q.splice(Math.max(at,0), 0, g.id);
    /* already sharing one stack? it keeps them. Spread across stacks, or with
       one of them mid-game, there's no single right home — they come out and
       wait in the free players until the desk places them. */
    const homes = (cur.pending||[]).filter(x => (x.units||[]).some(u => ids.includes(u)));
    const together = homes.length === 1 && ids.every(id => homes[0].units.includes(id));
    const pending = together
      ? (cur.pending||[]).map(x => {
          if (x.id !== homes[0].id) return x;
          const spot = x.units.findIndex(u => ids.includes(u));
          const units = x.units.filter(u => !ids.includes(u));
          units.splice(spot, 0, g.id);
          return {...x, units, teams:null};
        })
      : dropFromStacks(ids);
    save(refill({...cur, groups:[...(cur.groups||[]), g], queue:q, pending}));
    const onCourt = ids.filter(id => playing.includes(id)).length;
    say((g.mode==="crew" ? "Locked as a four — they only play each other" : "Locked as partners")
      + (onCourt ? " · they join the queue when their game ends"
                 : together ? " · still in the same stack" : ""));
  };
  const ungroup = gid => {
    const g = (cur.groups||[]).find(x=>x.id===gid);
    if (!g) return;
    const idx = unitIndex(cur);
    const seats = (idx[gid]||{}).size || g.members.length;   // what the unit was holding
    const q = [...(cur.queue||[])];
    const at = q.indexOf(gid);
    if (at>=0) q.splice(at, 1, ...g.members); else q.push(...g.members);
    /* whichever stack held them keeps them — the unit is replaced in place by
       the people who were in it, so the stack still adds up to the same four */
    const pending = (cur.pending||[]).map(x => {
      const spot = (x.units||[]).indexOf(gid);
      if (spot < 0) return x;
      const units = [...x.units];
      units.splice(spot, 1, ...g.members.slice(0, seats));
      return {...x, units, teams:null};
    });
    save(refill({...cur, groups:(cur.groups||[]).filter(x=>x.id!==gid), queue:q, pending}));
    say("Unlocked — they stay where they are, just not tied together");
  };
  /* two names trade places, and only those two — the line-up is stored, not guessed */
  const moveInQueue = (moving, target) => {
    if (moving === target) return;
    const idx = unitIndex(cur);
    if (!idx[moving] || !idx[target]) return;
    if (idx[moving].size !== idx[target].size){
      say("Those two don't take the same number of places — unlock the pair first");
      return;
    }
    const swap = arr => (arr||[]).map(id => id===moving ? target : id===target ? moving : id);
    const swapP = arr => (arr||[]).map(pid => {
      const pm = idx[moving].all||idx[moving].members, pt = idx[target].all||idx[target].members;
      const a = pm.indexOf(pid); if (a>=0 && pt[a]!=null) return pt[a];
      const b = pt.indexOf(pid); if (b>=0 && pm[b]!=null) return pm[b];
      return pid;
    });
    save({...cur,
      queue: swap(cur.queue),
      pending: (cur.pending||[]).map(x => ({...x,
        units: swap(x.units),
        teams: x.teams ? [swapP(x.teams[0]), swapP(x.teams[1])] : null}))});
  };
  const gameToFront = ids => {
    const pending = [...(cur.pending||[])];
    const at = pending.findIndex(x => (x.units||[]).join() === (ids||[]).join());
    if (at <= 0) return;
    const [x] = pending.splice(at,1);
    pending.unshift(x);
    save({...cur, pending});
    say("Moved to the front of the line");
  };
  const toggleCourt = c => {
    if (cur.courts.includes(c)){
      if (cur.courts.length <= 1){ say("You need at least one court open"); return; }
      const g = (cur.live||{})[c];
      const live = {...(cur.live||{})}; delete live[c];
      const queue = g ? [...g.units, ...(cur.queue||[])] : [...(cur.queue||[])];
      saveCourts({...cur, courts:cur.courts.filter(x=>x!==c), live, queue});
      say(g ? `${CLUB.courts[c]} closed — those four go back to the front of the queue`
            : `${CLUB.courts[c]} closed`);
    } else {
      let next = {...cur, courts:[...cur.courts, c].sort((a,b)=>a-b)};
      next = rotate(next, c, true);
      saveCourts(next);
      const g = (next.live||{})[c];
      if (g){
        shout({type:"announce", text: callGame(g, `${CLUB.courts[c]} is open, walk on now.`)});
        say(`${CLUB.courts[c]} opened — next four are on`);
      } else say(`${CLUB.courts[c]} opened — nobody waiting to fill it yet`);
    }
  };
  const reorderStacks = (moving, target) => {
    const p = [...(cur.pending||[])];
    const from = p.findIndex(x=>x.id===moving);
    if (from < 0 || !p.some(x=>x.id===target)) return;
    const [x] = p.splice(from,1);
    p.splice(p.findIndex(y=>y.id===target), 0, x);
    save({...cur, pending:p});
  };
  /* a new stack, optionally born with someone already in it — that's the
     "+ New stack" option when sending a free player somewhere by tap */
  const addStack = (unitId) => {
    const id = makeId();
    if (!unitId) return save({...cur, pending:[...(cur.pending||[]), {id, units:[], manual:true}]});
    save(refill({...cur,
      bench:(cur.bench||[]).filter(x => x !== unitId),
      pending:[...(cur.pending||[]).map(x => ({...x, units:(x.units||[]).filter(i=>i!==unitId), teams:null})),
               {id, units:[unitId], manual:true}]}));
  };
  const dropStack = id => save(refill({...cur, pending:(cur.pending||[]).filter(x=>x.id!==id)}));
  /* 5. Dragged (or tapped) out of a stack: to the back of the line AND on the
     bench, so auto stacking leaves them in the free pool instead of putting
     them straight back where they came from. */
  const pullFromStack = (sid, unitId) => {
    const queue = [...(cur.queue||[]).filter(id=>id!==unitId), unitId];
    const bench = [...(cur.bench||[]).filter(id=>id!==unitId), unitId];
    save(refill({...cur, queue, bench,
      pending:(cur.pending||[]).map(x => x.id===sid
        ? {...x, units:(x.units||[]).filter(u=>u!==unitId), teams:null} : x)}));
    say("Moved to the free players");
  };
  /* dropped anywhere in the free-players strip — whichever stack held them */
  const pullToSpare = unitId => {
    const from = (cur.pending||[]).find(x => (x.units||[]).includes(unitId));
    if (!from){ say("They're already free"); return; }
    pullFromStack(from.id, unitId);
  };
  const dropInStack = (sid, unitId) => {
    const idx = unitIndex(cur);
    const bench = (cur.bench||[]).filter(id => id !== unitId);   // back in play
    const u = idx[unitId];
    const target = (cur.pending||[]).find(x=>x.id===sid);
    if (!u || !target) return;
    const room = 4 - (target.units||[]).filter(id=>id!==unitId)
      .reduce((n,id)=>n+((idx[id]||{}).size||0),0);
    if (u.size > room){ say("That stack is full"); return; }
    save(refill({...cur, bench, pending:(cur.pending||[]).map(x =>
      x.id===sid ? {...x, units:[...(x.units||[]).filter(i=>i!==unitId), unitId], teams:null}
                 : {...x, units:(x.units||[]).filter(i=>i!==unitId), teams:null})}));
  };
  const callNext = () => {
    if (!nextGame){ say("Nobody waiting in the queue"); return; }
    shout({type:"announce", text: callGame(nextGame, "Next up, please get ready.")});
    say("Called on the TV screen");
  };

  const base = location.href.split("#")[0];
  const openTv = () => { const w = window.open(base+"#tv","pt_tv"); if(!w){ setTvFallback(true); say("Your browser blocked the new tab — copy the link below"); } };
  const copy = async txt => { try { await navigator.clipboard.writeText(txt); say("Link copied"); } catch { setTvFallback(true); } };

  const gm = cur.gameLength || DEFAULT_GAME_MIN;
  const scored = byScore(cur);
  const waitingN = active.filter(p => !playing.includes(p.id)).length;
  const stackedIds = onDeck(cur, 99).games.flatMap(g => g.players);   // in a stack, not just the shown few
  /* six courts across is too thin to read a name — past four they go two deep */
  const courtCols = cur.courts.length <= 4 ? Math.max(1, cur.courts.length) : Math.ceil(cur.courts.length/2);

  /* One compact card per open court: the clock, how much of the game is left,
     the four names, and the two buttons the desk actually presses. */
  const CourtCard = court => {
    const g = (cur.live||{})[court];
    const raw = remainRaw(g && g.timer);
    const up = elapsedOf(g && g.timer);
    const over = !scored && raw != null && raw <= 0;
    const warn = !scored && raw != null && raw > 0 && raw <= 60;
    const dur = (g && g.timer && g.timer.dur) || gm*60;
    const four = g ? [g.teamA[0], g.teamA[1], g.teamB[0], g.teamB[1]] : [];
    return (
      <div className={"dc-court"+(over?" over":"")} key={court}>
        <div className="dc-crow">
          <span className="dc-cname">{CLUB.courts[court]}
            {scored && g && <em> · to {cur.target||DEFAULT_TARGET}</em>}</span>
          <span className={"dc-ctime"+(over?" out":warn?" warn":"")}>
            {over ? "Time's up" : scored ? (up==null?"—:—":mmss(up)) : clockText(raw)}</span>
          {admin && g && g.timer && (
            <div className="dc-mini">
              <button onClick={()=>bumpTimer(court,-60)} title="One minute off" aria-label="One minute off">−</button>
              <button onClick={()=>bumpTimer(court,60)} title="One minute on" aria-label="One minute on">+</button>
              <button onClick={()=>resetTimer(court)} title="Reset the clock" aria-label="Reset the clock">↺</button>
            </div>
          )}
        </div>
        {!scored && (
          <div className="dc-track">
            <i style={{width:(raw==null ? 0 : Math.max(0,Math.min(1, raw/dur))*100)+"%"}}/>
          </div>
        )}
        {g ? (
          <>
            {isMatched(cur) ? (
              <>
                <div className="dc-four"><b>{name(g.teamA[0])}</b><b>{name(g.teamA[1])}</b></div>
                <div className="dc-cvs"><span>vs</span></div>
                <div className="dc-four"><b>{name(g.teamB[0])}</b><b>{name(g.teamB[1])}</b></div>
              </>
            ) : (
              <div className="dc-four">
                {four.filter(Boolean).map((pid,k)=><b key={k}>{name(pid)}</b>)}
              </div>
            )}
            {admin && (
              <div className="dc-cacts">
                {!g.timer && <button className="btn btn-sm" onClick={()=>setTimer(court,{start:Date.now(), dur:gm*60})}>Start clock</button>}
                {g.timer && g.timer.left==null && <button className="btn btn-sm" onClick={()=>setTimer(court,{left:remain(g.timer), dur:g.timer.dur})}>Pause</button>}
                {g.timer && g.timer.left!=null && <button className="btn btn-sm" onClick={()=>setTimer(court,{start:Date.now()-(g.timer.dur-g.timer.left)*1000, dur:g.timer.dur})}>Resume</button>}
                <button className={"btn btn-sm "+(over?"btn-pink":"btn-primary")} onClick={()=>finish(court)}>Game done →</button>
              </div>
            )}
          </>
        ) : (
          <>
            <p className="dc-cempty">Empty — not enough players waiting to fill this court.</p>
            {admin && <div className="dc-cacts"><button className="btn btn-sm" onClick={()=>finish(court)}>Try to fill</button></div>}
          </>
        )}
      </div>
    );
  };

  /* The same court on one line — court, clock, a stub of a bar, the four names,
     and the only two buttons that matter mid-game. Six of these cost about as
     much height as one card, which is the whole point of the compact view. */
  const CourtRow = court => {
    const g = (cur.live||{})[court];
    const raw = remainRaw(g && g.timer);
    const up = elapsedOf(g && g.timer);
    const over = !scored && raw != null && raw <= 0;
    const warn = !scored && raw != null && raw > 0 && raw <= 60;
    const dur = (g && g.timer && g.timer.dur) || gm*60;
    const who = !g ? "" : isMatched(cur)
      ? `${name(g.teamA[0])} & ${name(g.teamA[1])} v ${name(g.teamB[0])} & ${name(g.teamB[1])}`
      : [g.teamA[0],g.teamA[1],g.teamB[0],g.teamB[1]].filter(Boolean).map(name).join(" · ");
    return (
      <div className={"dc-rowc"+(over?" over":"")} key={court}>
        <span className="rc-name">{CLUB.courts[court].replace("Court ","C")}</span>
        <span className={"rc-time"+(over?" out":warn?" warn":"")}>
          {over ? "Time's up" : scored ? (up==null?"—:—":mmss(up)) : clockText(raw)}</span>
        {!scored && (
          <span className="rc-bar">
            <i style={{width:(raw==null ? 0 : Math.max(0,Math.min(1, raw/dur))*100)+"%"}}/>
          </span>
        )}
        <span className={"rc-who"+(g?"":" empty")}>{g ? who : "Empty — nobody waiting to fill it"}</span>
        {g && g.timer && (
          <div className="dc-mini">
            {g.timer.left==null
              ? <button title="Pause" aria-label="Pause the clock"
                  onClick={()=>setTimer(court,{left:remain(g.timer), dur:g.timer.dur})}>‖</button>
              : <button title="Resume" aria-label="Resume the clock"
                  onClick={()=>setTimer(court,{start:Date.now()-(g.timer.dur-g.timer.left)*1000, dur:g.timer.dur})}>▶</button>}
            <button title="Reset the clock" aria-label="Reset the clock"
              onClick={()=>resetTimer(court)}>↺</button>
          </div>
        )}
        {g && !g.timer && (
          <button className="rc-start" onClick={()=>setTimer(court,{start:Date.now(), dur:gm*60})}>Start</button>
        )}
        <button className="rc-done" onClick={()=>finish(court)}>{g ? "Done →" : "Fill"}</button>
      </div>
    );
  };

  /* ---------------------------------------------------------------------------
     THE DESK CONSOLE
     One screenful, nothing to scroll past. The header and the courts hold their
     place; only the queue and the roster move. Everything the desk touches in a
     hurry — call next up, game done, add a walk-in — is reachable without a
     scroll, and the session settings hide behind the gear until they're wanted.
  --------------------------------------------------------------------------- */
  if (admin) return (
    <div className="dc">
      <header className="dc-head">
        <div className="dc-id">
          <div className="dc-live"><i/>Open play live</div>
          <h2 title={cur.title}>{cur.title}</h2>
        </div>

        <div className="dc-stats">
          <div className="dc-stat"><b>{playing.length}</b><span>On court</span></div>
          <div className="dc-stat"><b>{waitingN}</b><span>Waiting</span></div>
          <div className="dc-stat"><b>{(cur.history||[]).length}</b><span>Games done</span></div>
          <div className="dc-stat">
            <b>{scored ? (cur.target||DEFAULT_TARGET) : gm+"m"}</b>
            <span>{scored ? "Play to" : "Game length"}</span>
          </div>
          <div className="dc-stat">
            <b>{cur.until && cur.until < CLOSE ? fmtShortTime(cur.until) : "Close"}</b>
            <span>Runs until</span>
          </div>
        </div>

        <div className="dc-acts">
          <button className="btn btn-sm" onClick={()=>copy(base+"#stack")}>Copy player link</button>
          <a className="btn btn-sm btn-ghost" href={base+"#stack"} target="_blank" rel="noreferrer">Preview</a>
          <span className="dc-sep"/>
          <button className="btn" onClick={openTv}>Open TV screen</button>
          <button className="btn btn-pink" onClick={callNext}>Call next up</button>
          <button className={"dc-gear"+(settings?" on":"")} onClick={()=>setSettings(v=>!v)}
            title="Session settings" aria-label="Session settings" aria-expanded={settings}>⚙</button>
        </div>
      </header>

      {settings && (
        <div className="dc-settings">
          <span className="modeswitch">
            <button className={!scored?"on":""} onClick={()=>save({...cur, scoring:"time"})}>Timed</button>
            <button className={scored?"on":""} onClick={()=>save({...cur, scoring:"score"})}>To a score</button>
          </span>
          <span className="mini">{scored ? "Play to" : "Game length"}</span>
          {scored
            ? <Stepper value={cur.target||DEFAULT_TARGET} onChange={v=>save({...cur, target:v})} min={1} max={99} suffix="points"/>
            : <Stepper value={gm} onChange={v=>save({...cur, gameLength:v})}/>}
          <span className="modeswitch">
            <button className={isMatched(cur)?"on":""} onClick={()=>save({...cur, matched:true})}>Matched · vs</button>
            <button className={!isMatched(cur)?"on":""} onClick={()=>save({...cur, matched:false})}>No teams</button>
          </span>
          <span className="modeswitch">
            <button className={isAuto(cur)?"on":""} onClick={()=>save(refill({...cur, mode:"auto"}))}>Auto stack</button>
            <button className={!isAuto(cur)?"on":""} onClick={()=>save({...cur, mode:"manual"})}>Manual stack</button>
          </span>
          <span className="mini">Runs until</span>
          <select className="dc-until" value={Math.min(CLOSE, cur.until || CLOSE)}
            onChange={e=>saveCourts({...cur, until:Number(e.target.value)})}>
            {untilOptions(opStart(cur)).map(m =>
              <option key={m} value={m}>{m>=CLOSE ? "Closing" : fmtTime(m)}</option>)}
          </select>
          <button className="btn btn-sm" onClick={startIdle}>Start any stopped clocks</button>
          <span className="dc-hint">{(cur.until && cur.until < CLOSE)
            ? `The courts are held to ${fmtTime(cur.until)} and bookable after. Push it back if games overrun.`
            : "The courts are held right through to closing — nobody can book them today."}</span>
          <span className="dc-hint">{isAuto(cur)
            ? "Auto: everyone is given a stack and part-filled stacks top themselves up. Full stacks are never re-shuffled."
            : "Manual: nothing is assigned for you. A finished four comes back together at the end, and new players wait in the pool until you place them."}</span>
          <button className="btn btn-sm btn-danger" style={{marginLeft:"auto"}}
            onClick={()=>saveCourts({...cur, status:"ended"})}>End session</button>
        </div>
      )}

      {tvFallback && (
        <div className="msg info" style={{margin:"10px clamp(12px,1.5vw,20px) 0"}}>
          TV screen: <b>{base}#tv</b> · Players: <b>{base}#stack</b>
        </div>
      )}

      <div className="dc-body">
        <div className="dc-main">
          <section className="dc-courts">
            <div className="dc-secthead">
              <span className="label" style={{margin:0}}>Courts in play</span>
              <div className="rest-chips">
                {CLUB.courts.map((c,i)=>(
                  <button key={i} className={"chip-p dc-chip"+(cur.courts.includes(i)?" on":"")}
                    onClick={()=>toggleCourt(i)}>{c}</button>
                ))}
              </div>
              <div className="dc-viewgroup">
                <span className="dc-note">{courtView==="rows"
                  ? `${cur.courts.length} court${cur.courts.length===1?"":"s"} running · compact keeps the queue in view`
                  : "Open one and the next four walk straight on"}</span>
                <div className="dc-viewsw">
                  <button className={courtView!=="rows"?"on":""} onClick={()=>pickView("cards")}>Cards</button>
                  <button className={courtView==="rows"?"on":""} onClick={()=>pickView("rows")}>Compact</button>
                </div>
              </div>
            </div>
            {courtView==="rows"
              ? <div className="dc-rows">{cur.courts.map(CourtRow)}</div>
              : <div className="dc-courtgrid" style={{"--dc-cols":courtCols}}>{cur.courts.map(CourtCard)}</div>}
          </section>

          <section className="dc-queue">
            <div className="dc-qhead">
              <div>
                <div className="eyebrow pink">Next off the queue</div>
                <p className="mini" style={{marginTop:3}}>
                  Drag a name onto another to swap · drag a card by its grip to reorder
                </p>
              </div>
              <div style={{marginLeft:"auto", display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
                <button className="btn btn-sm" onClick={()=>addStack()}>+ Add a stack</button>
                {nextGame && <button className="btn btn-sm btn-pink" onClick={callNext}>Call these names</button>}
                <button className="dc-zoom" onClick={()=>setZoom(true)}
                  title="Open the stacks full screen" aria-label="Open the stacks full screen">⤢</button>
              </div>
            </div>
            <LineUp s={cur} name={name} onSwap={moveInQueue} onFront={gameToFront} onReorder={reorderStacks}
              onAddStack={addStack} onDropInStack={dropInStack} onPullFromStack={pullFromStack}
              onPullToSpare={pullToSpare} onDropStack={dropStack} compact/>
          </section>
        </div>

        {zoom && (
          <div className="dc-veil" onClick={()=>setZoom(false)}>
            <div className="dc-modal" onClick={e=>e.stopPropagation()}>
              <div className="dc-qhead">
                <div>
                  <div className="eyebrow pink">Next off the queue</div>
                  <p className="mini" style={{marginTop:3}}>
                    Drag a name onto another to swap · drag a card by its grip to reorder
                  </p>
                </div>
                <div style={{marginLeft:"auto", display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
                  <button className="btn btn-sm" onClick={()=>addStack()}>+ Add a stack</button>
                  {nextGame && <button className="btn btn-sm btn-pink" onClick={callNext}>Call these names</button>}
                  <button className="dc-zoom on" onClick={()=>setZoom(false)}
                    title="Back to the desk" aria-label="Back to the desk">×</button>
                </div>
              </div>
              <LineUp s={cur} name={name} onSwap={moveInQueue} onFront={gameToFront} onReorder={reorderStacks}
                onAddStack={addStack} onDropInStack={dropInStack} onPullFromStack={pullFromStack}
                onPullToSpare={pullToSpare} onDropStack={dropStack} compact/>
            </div>
          </div>
        )}

        <DeskRoster players={cur.players} groups={cur.groups} st={st}
          busyIds={playing} stackedIds={stackedIds}
          onAdd={addPlayer} onRemove={removePlayer} onRename={renamePlayer}
          onGroup={group} onUngroup={ungroup}/>
      </div>
    </div>
  );

  /* players and passers-by get the same board, read only */
  return (
    <div className="wrap">
      <div className="page-head">
        <div>
          <div className="eyebrow">Open play · {fmtDate(cur.date)}</div>
          <h2 style={{marginTop:6}}>{cur.title}</h2>
          <p className="mini" style={{marginTop:6}}>
            {playing.length} on court · {waitingN} waiting · {(cur.history||[]).length} games played
          </p>
        </div>
      </div>

      <div className="linkbar">
        <div>
          <div className="label" style={{marginBottom:4}}>Follow the queue on your phone</div>
          <span className="mini">Who's on, the queue order and how far off you are.</span>
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <button className="btn btn-sm" onClick={()=>copy(base+"#stack")}>Copy player link</button>
          <a className="btn btn-sm btn-ghost" href={base+"#stack"} target="_blank" rel="noreferrer">Open it</a>
        </div>
      </div>
      {tvFallback && <div className="msg info">Players: <b>{base}#stack</b></div>}

      <div className="dc-courtgrid" style={{"--dc-cols":courtCols}}>{cur.courts.map(CourtCard)}</div>

      <div className="card pad" style={{marginTop:26}}>
        <div className="eyebrow pink">Next off the queue</div>
        {deck.games.length ? (
          <div className="op-grid" style={{marginTop:14}}>
            {deck.games.map((g,i)=>(
              <div key={i} style={{fontSize:14, lineHeight:1.7}}>
                <div className="match-court">{i===0?"Up next":`${i+1}${i===1?"nd":i===2?"rd":"th"} in line`}</div>
                {isMatched(cur) ? (
                  <>
                    {name(g.teamA[0])} &amp; {name(g.teamA[1])}<br/>
                    <span style={{color:"var(--soft)"}}>vs</span><br/>
                    {name(g.teamB[0])} &amp; {name(g.teamB[1])}
                  </>
                ) : g.players.map(name).join(" · ")}
              </div>
            ))}
          </div>
        ) : <p className="mini" style={{marginTop:12}}>Nobody waiting — everyone is on court.</p>}
      </div>

      <div className="card pad" style={{marginTop:26}}>
        <div className="eyebrow">Players</div>
        <div style={{marginTop:14}} className="rest-chips">
          {active.map(p=>(
            <span className="chip-p" key={p.id} style={{cursor:"default"}}>
              {p.name}<b className="chip-n">({st.games[p.id]||0})</b></span>
          ))}
        </div>
        <div style={{marginTop:18}}>
          <button className="disclose" onClick={()=>setShowShare(v=>!v)}>
            <span className="label" style={{margin:0}}>Fair share</span>
            <span className="mini">{showShare ? "Hide" : "Show"} games played · <i className={"chev"+(showShare?" up":"")}>›</i></span>
          </button>
          {showShare && active.slice().sort((a,b)=>(st.games[b.id]||0)-(st.games[a.id]||0)).map(p=>{
            const g = st.games[p.id]||0, max = Math.max(1,...active.map(x=>st.games[x.id]||0));
            return (
              <div className="roster-row" key={p.id}>
                <span style={{flex:1}}>{p.name}
                  {playing.includes(p.id) && <span className="mini" style={{color:"var(--pink-deep)"}}> · on court</span>}</span>
                <span className="bar" style={{width:Math.round(90*g/max)+6}}/>
                <span className="mini" style={{minWidth:76, textAlign:"right"}}>{g} game{g===1?"":"s"}</span>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{height:60}}/>
    </div>
  );
}

/* ---------- the roster rail: add, search, filter, rename, lock, remove ----------
   It is the one column that stays put while the queue moves, so everything the
   desk does to a person lives here and nowhere else. */
function DeskRoster({players, groups, st, busyIds, stackedIds, onAdd, onRemove, onRename, onGroup, onUngroup}){
  const [name,setName] = useState("");
  const [find,setFind] = useState("");
  const [tab,setTab] = useState("All");
  const [sel,setSel] = useState([]);
  const [editing,setEditing] = useState(null);
  const [draft,setDraft] = useState("");
  const [byGames,setByGames] = useState(false);
  const [err,setErr] = useState("");
  const inputRef = useRef(null);
  const active = players.filter(p=>p.active!==false);
  const busy = new Set(busyIds||[]);
  const stacked = new Set(stackedIds||[]);
  /* Two Nicoles on the board is nobody's friend — the TV, the call-outs and the
     player's own phone all find people by name. */
  const clash = (n, exceptId) => active.find(p =>
    p.id !== exceptId && p.name.trim().toLowerCase() === n.trim().toLowerCase());
  const groupOf = id => (groups||[]).find(g => g.members.includes(id)
    && g.members.filter(m => active.some(p => p.id === m)).length >= 2);

  const add = () => {
    const n = name.trim();
    if (!n) return;
    const taken = clash(n);
    if (taken){
      setErr(`${taken.name} is already on the list — use a different name, like "${taken.name} B".`);
      inputRef.current && inputRef.current.select();
      return;
    }
    setErr(""); onAdd(n); setName("");
    inputRef.current && inputRef.current.focus();
  };
  /* Someone mid-game is still tappable — the desk often lines the next lock up
     while the game is still running. Four is the ceiling: a locked unit is a
     court's worth, never more. */
  const toggle = id => { if (groupOf(id)) return;
    setSel(v => v.includes(id) ? v.filter(x=>x!==id) : v.length<4 ? [...v,id] : v); };
  const commit = p => {
    const d = draft.trim();
    if (d && d !== p.name){
      const taken = clash(d, p.id);
      /* clicking away with a name that is taken leaves the old one alone */
      if (taken) setErr(`${taken.name} is already on the list — ${p.name} was left as they were.`);
      else { setErr(""); onRename(p.id, d); }
    }
    setEditing(null);
  };

  const TONE = {
    court: ["var(--teal)", "On court", "var(--teal-deep)", "var(--teal-soft)"],
    queue: ["#E0D2C8", "In queue", "#8C9B97", "var(--sand)"],
    free:  ["var(--pink)", "Free", "var(--pink-deep)", "var(--pink-soft)"]
  };
  const stateOf = p => busy.has(p.id) ? "court" : stacked.has(p.id) ? "queue" : "free";

  const locked = (groups||[]).filter(g => g.members.filter(id=>active.some(p=>p.id===id)).length >= 2);
  /* P1, F2 — a short tag so a locked player is recognisable at a glance in the
     list, and the same tag names them in the locked-together strip below */
  const tagOf = id => {
    const i = locked.findIndex(g => g.members.includes(id));
    return i < 0 ? "" : ((locked[i].mode||"pair") === "crew" ? "F" : "P") + (i+1);
  };

  const f = find.trim().toLowerCase();
  let shown = active
    .filter(p => tab !== "Locked" || groupOf(p.id))
    .filter(p => tab === "All" || tab === "Locked"
      || (tab === "On court" ? busy.has(p.id) : !busy.has(p.id)))
    .filter(p => !f || p.name.toLowerCase().includes(f));
  if (byGames) shown = [...shown].sort((a,b) => (st.games[b.id]||0) - (st.games[a.id]||0));

  const nums = active.map(p => st.games[p.id]||0);
  const spread = nums.length ? Math.max(...nums) - Math.min(...nums) : 0;
  const nameOf = id => (players.find(p=>p.id===id)||{}).name || "—";
  const canLock = sel.length === 2 || sel.length === 4;
  const selHint = sel.length === 2 ? "They always play on the same side."
    : sel.length === 4 ? "They always go on court together."
    : sel.length === 1 ? "Pick one more for a pair."
    : "Pick one more for a four, or drop one for a pair.";

  return (
    <aside className="dc-side">
      <div className="dc-sidetop">
        <div style={{display:"flex", alignItems:"baseline", gap:8}}>
          <span className="eyebrow">Players</span>
          <span className="mini" style={{marginLeft:"auto"}}>{active.length} in · {shown.length} shown</span>
        </div>
        <div className="dc-srow">
          <input ref={inputRef} value={name} placeholder="Add a player"
            onChange={e=>{setName(e.target.value); setErr("");}} onKeyDown={e=>e.key==="Enter"&&add()}/>
          <button className="btn btn-primary" onClick={add} disabled={!name.trim()}>Add</button>
        </div>
        <div className="dc-srow">
          <input className="find" value={find} placeholder="Search the roster"
            onChange={e=>setFind(e.target.value)}/>
        </div>
        <div className="dc-tabs">
          {["All","On court","Waiting","Locked"].map(t=>(
            <button key={t} className={tab===t?"on":""} onClick={()=>setTab(t)}>{t}</button>))}
        </div>
        <p className="dc-tabhint">Tap 2 for a pair · tap 4 for a four — on court counts</p>
        {err && <div className="msg err" style={{margin:"8px 0 0", fontSize:12, padding:"9px 11px"}}>{err}</div>}
      </div>

      <div className="dc-list">
        {!shown.length && <p className="mini">{active.length
          ? "Nobody matches that."
          : "Nobody in yet. Type a name above and press enter — the field stays ready for the next one."}</p>}
        {shown.map(p => {
          const tone = TONE[stateOf(p)];
          const held = groupOf(p.id);
          const tag = tagOf(p.id);
          if (editing === p.id) return (
            <div className="dc-p" key={p.id}>
              <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
                onKeyDown={e=>{
                  if (e.key==="Enter") commit(p);
                  if (e.key==="Escape"){ setErr(""); setEditing(null); }
                }}
                onBlur={()=>commit(p)}/>
            </div>
          );
          return (
            <div className={"dc-p"+(sel.includes(p.id)?" sel":"")+(held?" tied":"")} key={p.id}>
              <i style={{background:tone[0]}}/>
              <button className="nm" onClick={()=>toggle(p.id)}
                title={held ? "Already locked — unlock the unit to pick them again" : "Tap to select"}>{p.name}</button>
              {tag && <span className="lk">{tag}</span>}
              <span className="st" style={{color:tone[2], background:tone[3]}}>{tone[1]}</span>
              <span className="gm">{st.games[p.id]||0}</span>
              <button className="chip-x pen" aria-label={"Rename "+p.name}
                title={busy.has(p.id) ? `Rename ${p.name} — works while they're on court` : "Rename "+p.name}
                onClick={()=>{setDraft(p.name); setEditing(p.id);}}>✎</button>
              <button className="chip-x" onClick={()=>onRemove(p.id)} aria-label={"Remove "+p.name}>×</button>
            </div>
          );
        })}
      </div>

      {sel.length>0 && (
        <div className="dc-selbar">
          <div className="dc-selhead">
            <span>{sel.length} selected</span>
            <button onClick={()=>setSel([])}>Clear</button>
          </div>
          <div className="dc-selnames">{sel.map(nameOf).join(" · ")}</div>
          <div className="dc-selact">
            <button className="btn btn-sm btn-primary" disabled={!canLock}
              onClick={()=>{ if (canLock){ onGroup(sel, sel.length===4 ? "crew" : "pair"); setSel([]); } }}>
              {sel.length===4 ? "Lock as a four" : "Lock as a pair"}</button>
            <span className="mini">{selHint}</span>
          </div>
        </div>
      )}

      {locked.length>0 && (
        <div className="dc-locks">
          {locked.map((g,i) => {
            const mem = g.members.filter(id=>active.some(p=>p.id===id));
            const crew = (g.mode||"pair") === "crew";
            return (
              <div className={"dc-lock"+(crew?" crew":"")} key={g.id}>
                <b>{(crew?"F":"P")+(i+1)}</b>
                <span>{mem.map(nameOf).join(crew ? " · " : " + ")}</span>
                <button onClick={()=>onUngroup(g.id)}>Unlock</button>
              </div>
            );
          })}
        </div>
      )}

      <div className="dc-foot">
        <span className="label" style={{margin:0}}>Fair share</span>
        <span className="mini">{spread<=1
          ? "Everyone within 1 game of each other"
          : `${spread} games between the most and the least`}</span>
        <button className="btn btn-sm btn-ghost" style={{marginLeft:"auto", padding:"4px 9px", fontSize:11.5}}
          onClick={()=>setByGames(v=>!v)}>{byGames ? "Queue order" : "Sort by games ⤾"}</button>
      </div>
    </aside>
  );
}

/* ------------------------------ setup -------------------------------- */
function Setup({admin, onStart}){
  const [title,setTitle] = useState("");
  const [courts,setCourts] = useState([0,1,2]);
  const [gameLength,setGameLength] = useState(DEFAULT_GAME_MIN);
  const [mode,setMode] = useState("manual");
  const [matched,setMatched] = useState(false);
  const [scoring,setScoring] = useState("time");
  const [target,setTarget] = useState(DEFAULT_TARGET);
  /* the window the session holds its courts for — four hours covers the usual
     club night, and anything past it stays bookable */
  const opFrom = Math.max(OPEN, Math.min(CLOSE-STEP, Math.floor(nowMin()/STEP)*STEP));
  const [until,setUntil] = useState(Math.min(CLOSE, opFrom + 240));
  const [players,setPlayers] = useState([]);
  const [groups,setGroups] = useState([]);
  const [err,setErr] = useState("");

  if (!admin) return (
    <div className="card pad" style={{marginTop:30}}>
      <div className="empty"><Ball size={40} color="var(--teal-line)"/>
        <div>No open play running right now. Staff can start a session from here.</div></div>
    </div>
  );

  const onCourt = courts.length*4;
  const fill48 = () => {
    const have = new Set(players.map(p=>p.name.toLowerCase()));
    const add = SAMPLE_48.filter(n=>!have.has(n.toLowerCase()));
    setPlayers(v => [...v, ...add.map((n,i)=>({id:makeId(), name:n, seq:v.length+i, handicap:0, active:true}))]);
    setErr("");
  };

  const start = () => {
    if (!courts.length){ setErr("Pick at least one court."); return; }
    if (players.length < 4){ setErr("You need at least four players to open a court."); return; }
    let s = {
      id:makeId(), date:toKey(new Date()),
      title: title.trim() || `${fmtDateShort(toKey(new Date()))} open play`,
      courts, gameLength, players, groups, mode, scoring, target, matched, until,
      queue: unitsOf({players, groups}).map(u=>u.id),
      live:{}, history:[], pending:[], status:"running", startedAt:new Date().toISOString()
    };
    if (!fillCourt(unitsOf(s), 4)){
      setErr("These groups can't fill a court between them. Unlock one, or add players who can partner up."); return;
    }
    if (mode === "manual"){                               // blocks of four, in the order they signed in
      let pool = unitsOf(s);
      const pend = [];
      while (pool.length){
        const grp = fillCourt(pool, 4);
        if (!grp) break;
        pool = pool.filter(u => !grp.includes(u));
        pend.push({id:makeId(), units:grp.map(u=>u.id)});
      }
      s = {...s, pending:pend};
    }
    s = refill(s);
    courts.forEach(c => { s = rotate(s, c, true); });
    onStart(s);
  };

  return (
    <>
      <div className="page-head"><div>
        <div className="eyebrow">Open play</div>
        <h2 style={{marginTop:6}}>Start a session</h2>
        <p className="lede" style={{marginTop:8}}>
          One queue, however many courts. A court finishes, those four go to the back and the next four
          walk on — courts never wait for each other. Lock two who always partner, or four who only play
          among themselves, and the queue works around them.
        </p>
      </div></div>

      <div className="card pad">
        {err && <div className="msg err">{err}</div>}
        <div className="row2">
          <div className="field"><span className="label">Session name</span>
            <input value={title} placeholder="Thursday night open play" onChange={e=>setTitle(e.target.value)}/></div>
          <div className="field"><span className="label">Games end on</span>
            <span className="modeswitch">
              <button className={scoring==="time"?"on":""} onClick={()=>setScoring("time")}>The clock</button>
              <button className={scoring==="score"?"on":""} onClick={()=>setScoring("score")}>A score</button>
            </span>
          </div>
          <div className="field">
            <span className="label">{scoring==="score" ? "Play to" : "Game length"}</span>
            {scoring==="score"
              ? <Stepper value={target} onChange={setTarget} min={1} max={99} suffix="points"/>
              : <Stepper value={gameLength} onChange={setGameLength}/>}
          </div>
        </div>

        <div className="field" style={{maxWidth:340}}>
          <span className="label">Runs until</span>
          <select value={until} onChange={e=>setUntil(Number(e.target.value))}>
            {untilOptions(opFrom).map(m =>
              <option key={m} value={m}>{m>=CLOSE ? "Closing · 12 AM" : fmtTime(m)}</option>)}
          </select>
          <p className="mini" style={{marginTop:8}}>
            The courts you pick below are held from {fmtTime(opFrom)} to{" "}
            {until>=CLOSE ? "closing" : fmtTime(until)} and can't be booked in that window.
            Outside it they stay open for bookings, so a three-hour session doesn't
            swallow the rest of the day. You can push this back later if games overrun.
          </p>
        </div>

        <div className="field"><span className="label">Teams</span>
          <span className="modeswitch big">
            <button className={matched?"on":""} onClick={()=>setMatched(true)}>Matched · vs</button>
            <button className={!matched?"on":""} onClick={()=>setMatched(false)}>No teams</button>
          </span>
          <p className="mini" style={{marginTop:8}}>{matched
            ? "The four are split into two sides. Every board shows vs, and the call-out names one team against the other."
            : "Just the four on court, no sides. Nothing says vs anywhere, and the call-out simply reads the names."}</p>
        </div>

        <div className="field"><span className="label">Stacking</span>
          <span className="modeswitch big">
            <button className={mode==="auto"?"on":""} onClick={()=>setMode("auto")}>Auto stack</button>
            <button className={mode==="manual"?"on":""} onClick={()=>setMode("manual")}>Manual stack</button>
          </span>
          <p className="mini" style={{marginTop:8}}>{mode==="manual"
            ? "You build the line-up. Stacks start as fours in sign-in order, a finished four comes back together, and anyone new waits in the free pool until you drag them in."
            : "Everyone is placed for you, in order, and nobody who is already in a full stack gets moved. Part-filled stacks top up as players finish."}</p>
        </div>

        <div className="field"><span className="label">Courts in use</span>
          <div className="rest-chips">
            {CLUB.courts.map((c,i)=>(
              <button key={i} className={"chip-p"+(courts.includes(i)?" on":"")}
                onClick={()=>setCourts(v=>v.includes(i)?v.filter(x=>x!==i):[...v,i].sort((a,b)=>a-b))}>{c}</button>
            ))}
          </div>
        </div>

        <hr style={{border:"none", borderTop:"1px solid var(--line)", margin:"20px 0"}}/>

        <div className="samplebar">
          <span className="mini">Testing the layout?</span>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <button className="btn btn-sm" onClick={fill48}>Fill 48 sample players</button>
            {players.length>0 && <button className="btn btn-sm btn-ghost" onClick={()=>{setPlayers([]); setGroups([]);}}>Clear roster</button>}
          </div>
        </div>

        <Roster players={players} groups={groups}
          onRename={(id,next)=>setPlayers(v=>v.map(p=>p.id===id?{...p,name:next}:p))}
          onAdd={n=>{setPlayers(v=>[...v,{id:makeId(),name:n,seq:v.length,handicap:0,active:true}]); setErr("");}}
          onRemove={id=>{
            const held = groups.find(g => g.members.includes(id) && g.members.length >= 2);
            if (held){
              const who = (players.find(p=>p.id===id)||{}).name || "That player";
              setErr((held.mode||"pair") === "crew"
                ? `${who} is in a private group — unlock the group first, then remove them`
                : `${who} is locked as a partner — unlock the pair first, then remove them`);
              return;
            }
            setErr(""); setPlayers(v=>v.filter(p=>p.id!==id));}}
          onGroup={(ids,mode)=>setGroups(v=>[...v,{id:makeId(), members:ids, mode:mode||(ids.length>=4?"crew":"pair")}])}
          onUngroup={gid=>setGroups(v=>v.filter(g=>g.id!==gid))}/>

        {players.length>0 && (
          <p className="mini" style={{marginTop:16}}>
            {Math.min(players.length,onCourt)} start on court · {Math.max(0,players.length-onCourt)} start in the queue
          </p>
        )}
        <button className="btn btn-primary btn-block" style={{marginTop:16}} onClick={start}>Open the courts</button>
      </div>
    </>
  );
}

/* ============================ TV SCREEN ============================
   Courts on the left, the queue standing still on the right. A scrolling
   ticker made a player wait for their name to come round; a rail that turns a
   page every few seconds shows the same thing and can be read at a glance. */
const TV_PAGE_SECS = 7, TV_RAIL_ROWS = 6;

function TVScreen(){
  const [s, ready] = useLiveSession(1500);
  const [sound,setSound] = useState(false);
  const [flash,setFlash] = useState(false);
  const [, setTick] = useState(0);
  const [page,setPage] = useState(0);
  const [dim,setDim] = useState(false);
  const pagesRef = useRef(1);
  useEffect(()=>{ const i=setInterval(()=>setTick(t=>t+1),500); return ()=>clearInterval(i); },[]);

  /* one minute left, then time's up — called on each court as it happens */
  const spoken = useRef({});
  useEffect(()=>{
    if (!sound || !s || !s.live || byScore(s)) return;
    Object.keys(s.live).forEach(c => {
      const g = s.live[c];
      if (!g || !g.timer) return;
      const r = remainRaw(g.timer);
      if (r == null) return;
      const tag = c+":"+(g.startedAt||"");
      if (r <= 60 && r > 0 && !spoken.current[tag+":60"]){
        spoken.current[tag+":60"] = 1;
        speak(`One minute left on ${CLUB.courts[c]}.`);
      }
      if (r <= 0 && !spoken.current[tag+":0"]){
        spoken.current[tag+":0"] = 1;
        chime();
        setTimeout(()=>speak(`Time's up on ${CLUB.courts[c]}.`), 700);
      }
    });
  });

  useEffect(()=> onBus(m => {
    if (!m || m.type!=="announce") return;
    setFlash(true); setTimeout(()=>setFlash(false), 7000);
    if (sound){ chime(); setTimeout(()=>speak(m.text), 700); }
  }), [sound]);

  /* the rail turns a page on its own, fading out and back so the eye follows */
  useEffect(()=>{
    const iv = setInterval(()=>{
      if (pagesRef.current <= 1) return;
      setDim(true);
      setTimeout(()=>{ setPage(p => (p+1) % pagesRef.current); setDim(false); }, 500);
    }, TV_PAGE_SECS*1000);
    return ()=>clearInterval(iv);
  },[]);

  if (!ready) return <div className="tv"><div className="empty">Loading…</div></div>;
  if (!s || s.status!=="running" || !s.pending)
    return <div className="tv"><div className="empty">No open play running.</div></div>;

  const name = id => (s.players.find(p=>p.id===id)||{}).name || "—";
  const nm = id => id ? name(id) : OPEN_SPOT;
  const nmStr = id => id ? name(id) : "";
  const matched = isMatched(s);
  const scored = byScore(s);
  const deck = onDeck(s, 60);
  const dur = (s.gameLength || DEFAULT_GAME_MIN) * 60;
  const n = s.courts.length;
  /* three courts fill a single row rather than leaving a hole in a 2x2 */
  const cols = n <= 3 ? Math.max(n,1) : n === 4 ? 2 : 3;
  const big = n <= 4;
  const now = new Date();
  const url = location.href.split("#")[0] + "#stack";

  const remainOn = c => { const g = (s.live||{})[c]; return remainRaw(g && g.timer); };
  /* the courts whose clock has run out, in the order they ran out */
  const finished = s.courts.filter(c => { const r = remainOn(c); return !scored && r != null && r <= 0; });

  const games = deck.games;
  const nx = games[0];
  const rest = games.slice(1);
  const pages = Math.max(1, Math.ceil(rest.length / TV_RAIL_ROWS));
  pagesRef.current = pages;
  const pg = Math.min(page, pages - 1);
  const shown = rest.slice(pg*TV_RAIL_ROWS, pg*TV_RAIL_ROWS + TV_RAIL_ROWS);

  const stacksWaiting = (s.pending||[]).length;
  const waitingPlayers = games.reduce((t,g)=>t+g.players.length,0) + deck.waiting.length;
  const avgWait = n ? Math.round(stacksWaiting / n * (s.gameLength||DEFAULT_GAME_MIN)) : 0;

  /* which court this stack is waiting on: one that is already over, or the one
     closest to the horn */
  const cue = (() => {
    if (!n) return "";
    if (finished.length) return `${CLUB.courts[finished[0]]} now`;
    let best = null, bestR = Infinity;
    s.courts.forEach(c => { const r = remainOn(c); if (r != null && r < bestR){ bestR = r; best = c; } });
    return best == null ? "When a court frees up" : `${CLUB.courts[best]} at the horn`;
  })();
  /* a court that is over hands off to the next stack in line, in order */
  const handoffFor = c => { const i = finished.indexOf(c); return i >= 0 ? games[i] : null; };
  const four = g => [g.teamA[0],g.teamA[1],g.teamB[0],g.teamB[1]];
  const spot = (pid, at) => (
    <div className={"tvc-spot "+at}>
      <div className="tvc-fig">
        <Face name={nmStr(pid)} className="tvc-face"/>
        <div className="tvc-who">{nm(pid)}</div>
      </div>
    </div>
  );
  const faces = g => four(g).map((pid,k)=><Face key={k} name={nmStr(pid)}/>);
  const sep = matched ? " & " : " · ";

  return (
    <div className="tv">
      <header className="tvh">
        <div className="tvh-l">
          <div className="tv-brand">
            <LogoWord className="tv-logo" light/>
            <div className="tv-live">
              <i/><span className="tv-sess">
                {now.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}).toUpperCase()} · OPEN PLAY
              </span>
            </div>
          </div>
          <span className="tv-rule"/>
          <div className="tv-stats">
            <div className="tv-stat"><b>{n}</b><span>Courts live</span></div>
            <div className="tv-stat"><b>{stacksWaiting}</b><span>Stacks waiting</span></div>
            <div className="tv-stat"><b>~{avgWait} min</b><span>Average wait</span></div>
            <div className="tv-stat">
              <b>{scored ? (s.target||DEFAULT_TARGET) : (s.gameLength||DEFAULT_GAME_MIN)+" min"}</b>
              <span>{scored ? "Play to" : "Game length"}</span>
            </div>
          </div>
        </div>

        <div className="tvh-r">
          <div className="tv-qr">
            <img alt="Scan to follow the queue"
              src={"https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&ecc=M&data="+encodeURIComponent(url)}
              onError={e=>{ e.currentTarget.parentNode.classList.add("noqr"); }}/>
            <div>
              <b>Full queue<br/>on your phone</b>
              <span>{url.replace(/^https?:\/\//,"")}</span>
            </div>
          </div>
          <span className="tv-rule"/>
          <div className="tv-clockwrap">
            <div className="tv-time">{now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
            <div className="tv-tools">
              <button className={"tv-sound"+(sound?"":" off")}
                onClick={()=>{ if(!sound) chime(); setSound(v=>!v); }}>
                {sound ? "Sound on" : "Sound off"}
              </button>
              <HomeDot/>
            </div>
          </div>
        </div>
      </header>

      <div className="tv-body">
        <main className={"tv-row"+(big?" big":"")}
          style={{gridTemplateColumns:`repeat(${cols},minmax(0,1fr))`,
            "--tvname": big ? "clamp(20px,3.1vw,72px)" : "clamp(16px,2.1vw,48px)"}}>
          {s.courts.map(court => {
            const g = (s.live||{})[court];
            const raw = remainOn(court);
            const up = elapsedOf(g && g.timer);
            const over = !scored && raw != null && raw <= 0;
            const warn = !scored && raw != null && raw > 0 && raw <= 60;
            const pctLeft = scored ? 1 : raw == null ? 0 : Math.max(0, Math.min(1, raw/dur));
            const ho = over ? handoffFor(court) : null;
            /* eight shots a loop; a different length per court so three cards
               side by side don't rally in unison */
            const rally = 7.2 + (court % 3) * .8;
            /* a paused timer freezes its remaining seconds in t.left, and a game
               that hasn't been started has no timer at all — the ball waits for
               both, so the board never shows a rally on a court nobody is on */
            const ticking = !!(g && g.timer && g.timer.left == null);
            return (
              <section className={"tvc"+(over?" over":warn?" warn":"")} key={court}>
                <div className="tvc-top">
                  <span className="tvc-name">{CLUB.courts[court]}</span>
                  {/* a paused clock outranks the one-minute warning: the desk stopped
                      it deliberately and the board should not still be counting down */}
                  <span className="tvc-chip">{!g ? "Open" : scored ? `First to ${s.target||DEFAULT_TARGET}`
                    : over ? "Time's up" : !ticking ? "Clock stopped"
                    : warn ? "1 minute left" : "In play"}</span>
                  <span className="tvc-time">{scored
                    ? (up==null ? (g ? "Ready" : "—:—") : mmss(up))
                    : over ? "Rotating" : raw==null ? (g ? "Ready" : "—:—") : mmss(raw)}</span>
                </div>
                {!scored && <div className="tvc-bar"><i style={{width:(pctLeft*100)+"%"}}/></div>}
                <div className="tvc-plot" style={{"--facesz": big ? "3.3vw" : "2.4vw"}}>
                  <div className="tvc-fx" aria-hidden="true"><i className="lines"/><i className="net"/></div>
                  {!g ? <div className="tvc-open">Court open</div> : <>
                    {/* the rally, gone the moment time is up */}
                    {/* no animation at all while the clock is stopped: a paused one
                        still pins the ball to whatever keyframe it froze on, and an
                        inline animation outranks anything the sheet can say */}
                    {!over && <div className={"tvc-ball"+(ticking?"":" held")} aria-hidden="true"
                      style={ticking ? {animation:`tvRally${"ABCD"[court%4]} ${rally}s linear infinite`} : null}>
                      <i style={ticking ? {animation:`tvArc ${rally/8}s infinite`} : null}><b/></i></div>}
                    {spot(g.teamA[0],"a")}
                    {spot(g.teamA[1],"b")}
                    {spot(g.teamB[0],"c")}
                    {spot(g.teamB[1],"d")}
                    {matched && <span className="tvc-vsmark">vs</span>}
                  </>}
                </div>
                {ho && (
                  <div className="tvc-hand">
                    <span>Court goes to</span>
                    <span className="hf">{faces(ho)}</span>
                    <b>{joinNodes(four(ho).map(nm), " · ")}</b>
                  </div>
                )}
              </section>
            );
          })}
        </main>

        <aside className="tv-rail">
          <div className="tvr-head">
            <b>The queue</b>
            <span>{stacksWaiting} stack{stacksWaiting===1?"":"s"} · {waitingPlayers} player{waitingPlayers===1?"":"s"}</span>
          </div>

          <div className={"tvr-next"+(flash?" flash":"")}>
            <div className="tvr-nexthead">
              <b>Up next</b>
              {nx && <span>{nx.full ? cue : `Waiting on ${4-nx.players.length} more`}</span>}
            </div>
            {nx
              ? <div className="tvr-nextnames">{four(nx).map((pid,k)=>(
                  <div key={k}><Face name={nmStr(pid)}/><b>{nm(pid)}</b></div>))}</div>
              : <div className="tvr-empty">Everyone is on court</div>}
          </div>

          <div className={"tvr-list"+(dim?" dim":"")}>
            {shown.map((g,i)=>{
              const ord = pg*TV_RAIL_ROWS + i + 2;
              return (
                <div className="tvr-row" key={g.stackId}>
                  <span className="tvr-ord">{ord}</span>
                  <span className="tvr-cluster">{faces(g)}</span>
                  <div className="tvr-who">
                    <div>{joinNodes([nm(g.teamA[0]), nm(g.teamA[1])], sep)}</div>
                    <div>{joinNodes([nm(g.teamB[0]), nm(g.teamB[1])], sep)}</div>
                  </div>
                  <span className="tvr-eta">~{Math.round((ord-1) * (s.gameLength||DEFAULT_GAME_MIN) / Math.max(1,n))}m</span>
                </div>
              );
            })}
          </div>

          {pages > 1 && (
            <div className="tvr-page">
              <span>Showing {pg*TV_RAIL_ROWS+2}–{pg*TV_RAIL_ROWS+shown.length+1} of {games.length}</span>
              <div className="tvr-dots">
                {Array.from({length:pages}).map((_,i)=><i key={i} className={i===pg?"on":""}/>)}
              </div>
            </div>
          )}

          <div className="tvr-rule">Finish your game and you go to the back of the line. Names are
            called on this board and read out loud.</div>
        </aside>
      </div>
    </div>
  );
}

function HomeDot(){
  return (
    <button className="homedot" onClick={()=>{ location.hash = ""; }} aria-label="Back to the site" title="Back to the site">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M3.6 10.5L12 3.6l8.4 6.9V20a1 1 0 0 1-1 1h-4.6v-6H9.2v6H4.6a1 1 0 0 1-1-1z"
          stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
      </svg>
    </button>
  );
}

/* ====================== PLAYER LINK — READ ONLY ====================== */
function StackView(){
  const [s, ready] = useLiveSession(4000);
  const [q,setQ] = useState("");
  const [notify,setNotify] = useState(false);
  const [passing,setPassing] = useState(false);
  const [, setTick] = useState(0);
  const fired = useRef(null);
  useEffect(()=>{ const i=setInterval(()=>setTick(t=>t+1),1000); return ()=>clearInterval(i); },[]);

  const save = async next => { try { await store.set(OP_KEY, JSON.stringify(next)); shout({type:"session"}); } catch {} };

  const name = id => (s && (s.players.find(p=>p.id===id)||{}).name) || "—";
  const slotName = id => id ? name(id) : OPEN_SPOT;
  const term = q.trim().toLowerCase();
  const deck = s && s.pending ? onDeck(s, 20) : {games:[], waiting:[]};
  const gameMin = (s && s.gameLength) || DEFAULT_GAME_MIN;
  const courtCount = (s && s.courts && s.courts.length) || 1;

  /* where the searched name sits */
  let me = null;
  if (s && s.pending && term.length > 1){
    const onCourt = (s.courts||[]).find(c => {
      const g = (s.live||{})[c];
      return g && [...g.teamA,...g.teamB].some(id => name(id).toLowerCase().includes(term));
    });
    if (onCourt != null){
      me = {onCourt, court:onCourt};
    } else {
      const i = deck.games.findIndex(g => g.players.some(id => name(id).toLowerCase().includes(term)));
      if (i >= 0) me = {pos:i, game:deck.games[i]};
      else if (deck.waiting.some(id => name(id).toLowerCase().includes(term))) me = {loose:true};
    }
  }

  /* nudge them when their group reaches the front */
  useEffect(()=>{
    if (!notify || !me || me.pos !== 0) return;
    if (fired.current === term) return;
    fired.current = term;
    try {
      if (window.Notification && Notification.permission === "granted")
        new Notification("You're up next at Pickle Town", {body:"Head to the first court that finishes."});
    } catch {}
  }, [notify, me && me.pos, term]);

  const askNotify = async () => {
    try {
      if (window.Notification && Notification.permission !== "granted") await Notification.requestPermission();
    } catch {}
    setNotify(true);
  };

  const doPass = () => {
    if (!me || me.pos == null || !s) return;
    const idx = unitIndex(s);
    const mine = (me.game.unitIds||[]).find(uid => {
      const u = idx[uid];
      return u && (u.all||u.members).some(id => name(id).toLowerCase().includes(term));
    });
    if (!mine) return;
    const next = refill({...s,
      queue: [...(s.queue||[]).filter(id=>id!==mine), mine],
      pending: (s.pending||[]).map(x => ({...x, units:(x.units||[]).filter(u=>u!==mine), teams:null}))});
    save(next);
    setPassing(false);
  };

  if (!ready) return <div className="pv"><div className="pv-empty">Loading…</div></div>;
  if (!s || s.status!=="running" || !s.pending)
    return (
      <div className="pv">
        <div className="pv-head"><div className="pv-brand"><img className="pv-mark" src={LOGO_ICON} alt=""/><div>
          <b>Pickle Town</b><span className="pv-live"><i/>No session running</span></div></div></div>
        <div className="pv-body"><div className="pv-note">There's no open play on right now. Check with the desk.</div></div>
      </div>
    );

  const now = new Date();
  const playing = onCourtIds(s).length;
  const stacksWaiting = (s.pending||[]).length;
  const eta = i => Math.round(i * gameMin / courtCount) + 2;   // a rough guide only in score games

  return (
    <div className="pv">
      <header className="pv-head">
        <div className="pv-top">
          <div className="pv-brand">
            <img className="pv-mark" src={CLUB.logoUrl || LOGO_ICON} alt=""/>
            <div>
              <b>Pickle Town</b>
              <span className="pv-live"><i/>{now.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}).toUpperCase()} OPEN PLAY</span>
            </div>
          </div>
          <div className="pv-clock">
            <b>{now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</b>
            <span>Live board</span>
          </div>
        </div>
        <div className="pv-stats">
          <div><b>{playing}</b><span>On court</span></div>
          <div><b>{stacksWaiting}</b><span>Stacks waiting</span></div>
          <div><b>{(s.history||[]).length}</b><span>Games played</span></div>
        </div>
      </header>

      <div className="pv-body">
        <div>
          <div className="pv-search">
            <span className="pv-ring"/>
            <input value={q} onChange={e=>{setQ(e.target.value); setPassing(false);}}
              placeholder="Type your name to find your spot"/>
            {q && <button onClick={()=>{setQ(""); setPassing(false);}} aria-label="Clear">×</button>}
          </div>

          {me && me.onCourt != null && (
            <div className="pv-me on">
              <div className="pv-me-row">
                <span className="pv-badge live">▶</span>
                <div>
                  <em>You're on court</em>
                  <b>{CLUB.courts[me.court]}</b>
                  <span>{(() => { const t = remainRaw(((s.live||{})[me.court]||{}).timer);
                    if (byScore(s)){ const e2 = elapsedOf(((s.live||{})[me.court]||{}).timer);
                      return e2==null ? "Play on" : mmss(e2)+" on court · first to "+(s.target||DEFAULT_TARGET); }
                    return t==null ? "Play on" : t<=0 ? "Time's up — wrap it up" : mmss(t)+" left"; })()}</span>
                </div>
              </div>
            </div>
          )}

          {me && me.pos != null && (
            <div className="pv-me">
              <div className="pv-me-row">
                <span className="pv-badge">{me.pos+1}</span>
                <div>
                  <em>Your spot in the queue</em>
                  <b>{slotName(me.game.teamA[0])} &amp; {slotName(me.game.teamA[1])} v {slotName(me.game.teamB[0])} &amp; {slotName(me.game.teamB[1])}</b>
                  <span>{me.pos===0
                    ? "You're up next — head to the first court that finishes."
                    : `About ${eta(me.pos)} min out · ${me.pos} group${me.pos===1?"":"s"} ahead`}</span>
                </div>
              </div>
              {passing ? (
                <div className="pv-acts">
                  <button className="pv-btn ghost" onClick={()=>setPassing(false)}>Keep my spot</button>
                  <button className="pv-btn" onClick={doPass}>Yes, go to the back</button>
                </div>
              ) : (
                <div className="pv-acts">
                  <button className={"pv-btn"+(notify?" done":"")} onClick={askNotify}>
                    {notify ? "You'll be told when you're up" : "Notify me when I'm up"}
                  </button>
                  <button className="pv-btn ghost" onClick={()=>setPassing(true)}>Pass</button>
                </div>
              )}
            </div>
          )}

          {me && me.loose && <div className="pv-note">You're checked in but not in a stack yet — the desk will place you.</div>}
          {term.length>1 && !me && <div className="pv-note">No one in the queue matches <b>{q}</b>. Check in at the desk to be added.</div>}
        </div>

        <div>
          <div className="pv-sec">
            <span>On court now</span>
            <em>{s.courts.length} court{s.courts.length===1?"":"s"} · {byScore(s) ? `games to ${s.target||DEFAULT_TARGET}` : `${gameMin}-min games`}</em>
          </div>
          <div className="pv-courts">
            {s.courts.map(c => {
              const g = (s.live||{})[c];
              const raw = remainRaw(g && g.timer);
              const scored = byScore(s);
              const up = elapsedOf(g && g.timer);
              const over = !scored && raw != null && raw <= 0;
              const pct = raw == null ? 0 : Math.max(0, Math.min(1, raw/(gameMin*60)));
              const mine = g && term.length>1 && [...g.teamA,...g.teamB].some(id=>name(id).toLowerCase().includes(term));
              return (
                <div className={"pv-court"+(over?" over":"")+(mine?" mine":"")} key={c}>
                  <div className="pv-court-top">
                    <span className="pv-court-name">{CLUB.courts[c]}</span>
                    <span className="pv-chip">{!g ? "Open" : scored ? `To ${s.target||DEFAULT_TARGET}` : over ? "Time's up" : raw==null ? "Ready" : "Playing"}</span>
                    <span className="pv-time">{!g ? "—" : scored ? (up==null?"—:—":mmss(up)) : over ? "Rotating" : raw==null ? "—:—" : mmss(raw)}</span>
                  </div>
                  {!byScore(s) && <div className="pv-bar"><i style={{width:(pct*100)+"%"}}/></div>}
                  {g ? (
                    isMatched(s) ? (
                      <div className="pv-teams">
                        <div className="a"><div>{name(g.teamA[0])}</div><div>{name(g.teamA[1])}</div></div>
                        <span>vs</span>
                        <div className="b"><div>{name(g.teamB[0])}</div><div>{name(g.teamB[1])}</div></div>
                      </div>
                    ) : (
                      <div className="pv-four">
                        {[g.teamA[0],g.teamA[1],g.teamB[0],g.teamB[1]].filter(Boolean)
                          .map((pid,k)=><div key={k}>{name(pid)}</div>)}
                      </div>
                    )
                  ) : <div className="pv-open">Waiting for players</div>}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <div className="pv-sec">
            <span>Next on court — in order</span>
            <em>{deck.games.length} group{deck.games.length===1?"":"s"}</em>
          </div>
          <div className="pv-queue">
            {deck.games.map((g,i)=>{
              const isMe = term.length>1 && g.players.some(id=>name(id).toLowerCase().includes(term));
              return (
                <div className={"pv-row"+(i===0?" first":"")+(isMe?" me":"")} key={g.stackId}>
                  <span className={"pv-num"+(i===0?" up":"")}>{i===0 ? "UP NEXT" : i+1}</span>
                  <div className="pv-match">
                    <div>{isMatched(s)
                      ? <>{slotName(g.teamA[0])} &amp; {slotName(g.teamA[1])}<i>v</i>{slotName(g.teamB[0])} &amp; {slotName(g.teamB[1])}</>
                      : joinNodes([g.teamA[0],g.teamA[1],g.teamB[0],g.teamB[1]].map(slotName), " · ")}</div>
                    {isMe && <em>That's you</em>}
                    {!g.full && <em className="soft">Waiting on {4-g.players.length} more</em>}
                  </div>
                  <span className="pv-eta">{i===0 ? "Next court" : "~"+eta(i)+" min"}</span>
                </div>
              );
            })}
            {!deck.games.length && <div className="pv-note">Nobody waiting — everyone is on court.</div>}
          </div>
          <div className="pv-rule">
            <span/>
            <div>Finish your game and your group goes to the back of the line. The board calls the next
              names out loud, so listen for yours.</div>
          </div>
        </div>

        <div className="pv-foot">Updates on its own · {now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
      </div>
    </div>
  );
}

/* number box with minus and plus, one minute at a time */
function Stepper({value, onChange, min=1, max=180, suffix="min"}){
  const set = v => onChange(Math.min(max, Math.max(min, isNaN(v)?min:v)));
  return (
    <div className="stepper">
      <button onClick={()=>set(value-1)} disabled={value<=min} aria-label="One minute less">−</button>
      <input type="number" inputMode="numeric" value={value} min={min} max={max}
        onChange={e=>set(parseInt(e.target.value,10))}/>
      <span>{suffix}</span>
      <button onClick={()=>set(value+1)} disabled={value>=max} aria-label="One minute more">+</button>
    </div>
  );
}


/* ========================= STAFF ACCOUNTS =========================
   superadmin  — everything, including rates, payment details and staff
   admin1      — morning shift: the desk, requests and open play
   admin2      — evening shift: the same
   All three start on the password 1234 and can change their own
   username and password from Settings → Your account.            */
const STAFF_KEY = "court:staff";
/* `locked` is the one account nobody can remove, whatever it gets renamed to.
   Roles and usernames are all editable; that flag is the only thing that isn't. */
const DEFAULT_STAFF = [
  {key:"superadmin", role:"super", label:"Super admin",   locked:true},
  {key:"kitoliver",  role:"super", label:"Super admin"},
  {key:"admin1",     role:"shift", label:"Morning shift"},
  {key:"admin2",     role:"shift", label:"Evening shift"}
];

/* SHA-256 by hand. crypto.subtle only exists in a secure context, so on a plain
   http:// origin — a custom domain whose certificate hasn't been issued yet,
   say — it is undefined. The old fallback returned "plain:<password>", which
   never matched a stored hash, so every sign-in failed with no explanation.
   This produces the identical digest, checked against WebCrypto. */
const SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256Hex(str){
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b = Array.from(new TextEncoder().encode(str));
  const bits = b.length * 8;
  b.push(0x80);
  while (b.length % 64 !== 56) b.push(0);
  b.push(0,0,0,0,(bits>>>24)&255,(bits>>>16)&255,(bits>>>8)&255,bits&255);
  const w = new Array(64), rotr = (x,n) => (x>>>n) | (x<<(32-n));
  for (let i=0;i<b.length;i+=64){
    for (let t=0;t<16;t++) w[t] = (b[i+4*t]<<24)|(b[i+4*t+1]<<16)|(b[i+4*t+2]<<8)|b[i+4*t+3];
    for (let t=16;t<64;t++){
      const s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15]>>>3);
      const s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2]>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    let a=H[0],b1=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let t=0;t<64;t++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e&f) ^ (~e&g);
      const t1 = (h + S1 + ch + SHA_K[t] + w[t]) | 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a&b1) ^ (a&c) ^ (b1&c);
      const t2 = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b1; b1=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b1)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x>>>0).toString(16).padStart(8,"0")).join("");
}

async function sha(text){
  const msg = "pt:" + text;
  try {
    if (typeof crypto !== "undefined" && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  } catch {}
  return sha256Hex(msg);
}

async function loadStaff(){
  const v = await store.get(STAFF_KEY);
  if (v){ try { const a = JSON.parse(v); if (Array.isArray(a) && a.length) return a; } catch {} }
  const hash = await sha("1234");
  const seeded = DEFAULT_STAFF.map(d => ({...d, hash, email:""}));
  try { await store.set(STAFF_KEY, JSON.stringify(seeded)); } catch {}
  return seeded;
}
const saveStaff = list => store.set(STAFF_KEY, JSON.stringify(list));

async function staffSignIn(who, pass){
  const list = await loadStaff();
  const acct = list.find(a => a.key.toLowerCase() === who.trim().toLowerCase());
  if (!acct) return null;
  if (acct.hash !== await sha(pass)) return null;
  /* with Supabase on, also take a real session so this staff member can
     write the protected rows (rates, payment details, QR images) */
  if (SB && acct.email){
    try { await SB.auth.signInWithPassword({email:acct.email, password:pass}); } catch {}
  }
  const me = {key:acct.key, role:acct.role, label:acct.label};
  try { sessionStorage.setItem("court:me", JSON.stringify(me)); } catch {}
  return me;
}
async function staffSignOut(){
  if (SB){ try { await SB.auth.signOut(); } catch {} }
  try { sessionStorage.removeItem("court:me"); } catch {}
}
async function staffRestore(){
  try { const v = sessionStorage.getItem("court:me"); return v ? JSON.parse(v) : null; } catch { return null; }
}
const isSuper = me => !!me && me.role === "super";

/* ------------------------ your own account ------------------------ */
function AccountPanel({me, say, onRenamed}){
  const [user,setUser] = useState(me.key);
  const [pass,setPass] = useState("");
  const [again,setAgain] = useState("");
  const [email,setEmail] = useState("");
