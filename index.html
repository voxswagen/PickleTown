  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");

  useEffect(()=>{ loadStaff().then(l => {
    const a = l.find(x=>x.key===me.key);
    if (a) setEmail(a.email||"");
  }); },[me.key]);

  const save = async () => {
    const u = user.trim();
    if (!u){ setErr("Pick a username."); return; }
    if (pass && pass !== again){ setErr("The two passwords don't match."); return; }
    if (pass && pass.length < 4){ setErr("Use at least four characters."); return; }
    setBusy(true);
    try {
      const list = await loadStaff();
      if (list.some(a => a.key !== me.key && a.key.toLowerCase() === u.toLowerCase())){
        setErr("Someone already uses that username."); setBusy(false); return;
      }
      const next = await Promise.all(list.map(async a => a.key !== me.key ? a
        : ({...a, key:u, email:email.trim(), hash: pass ? await sha(pass) : a.hash})));
      await saveStaff(next);
      if (SB && pass){ try { await SB.auth.updateUser({password:pass}); } catch {} }
      onRenamed({...me, key:u});
      setPass(""); setAgain(""); setErr("");
      say("Your account is updated");
    } catch { setErr("Couldn't save that."); }
    setBusy(false);
  };

  return (
    <div className="card pad">
      <div className="eyebrow">Signed in as {me.label}</div>
      <p className="mini" style={{marginTop:6, maxWidth:520}}>
        Change your own username and password here. Leave the password blank to keep the one you have.
      </p>
      {err && <div className="msg err" style={{marginTop:14}}>{err}</div>}
      <div className="row2" style={{marginTop:14}}>
        <div className="field"><span className="label">Username</span>
          <input value={user} onChange={e=>{setUser(e.target.value); setErr("");}}/></div>
        {ONLINE && <div className="field"><span className="label">Linked email (Supabase)</span>
          <input value={email} type="email" placeholder="you@pickletown.ph"
            onChange={e=>setEmail(e.target.value)}/></div>}
      </div>
      <div className="row2">
        <div className="field"><span className="label">New password</span>
          <input type="password" value={pass} autoComplete="new-password"
            onChange={e=>{setPass(e.target.value); setErr("");}}/></div>
        <div className="field"><span className="label">Repeat it</span>
          <input type="password" value={again} autoComplete="new-password"
            onChange={e=>{setAgain(e.target.value); setErr("");}}/></div>
      </div>
      <button className="btn btn-primary" disabled={busy} onClick={save}>
        {busy ? "Saving…" : "Save my account"}
      </button>
      {ONLINE && (
        <p className="mini" style={{marginTop:14, maxWidth:560}}>
          The linked email is the Supabase account used to save rates and payment details. Create it under
          Authentication → Users with the same password, or ask the super admin to.
        </p>
      )}
    </div>
  );
}

/* --------------------- everyone's accounts (super) --------------------- */
function StaffPanel({me, say, onRenamed}){
  const [list,setList] = useState(null);
  const [busy,setBusy] = useState(false);
  const [editing,setEditing] = useState(null);   // which username is being typed
  const [draft,setDraft] = useState("");
  useEffect(()=>{ loadStaff().then(setList); },[]);
  if (!list) return <div className="card pad"><div className="empty">Loading…</div></div>;

  /* The keyholder account. The flag survives a rename; the fallbacks cover a
     database seeded before the flag existed. */
  const keyholder = (list.find(a=>a.locked) || list.find(a=>a.key==="superadmin")
    || list.find(a=>a.role==="super") || {}).key;
  const supers = list.filter(a=>a.role==="super").length;

  const write = async next => { setBusy(true); setList(next); try { await saveStaff(next); } catch { say("Couldn't save"); } setBusy(false); };
  const setField = (key, field, val) => {
    /* demoting the last super admin would lock everyone out of this very screen */
    if (field === "role" && val !== "super" && supers === 1
        && (list.find(a=>a.key===key)||{}).role === "super"){
      say("Keep at least one super admin"); return;
    }
    write(list.map(a => a.key===key ? {...a, [field]:val} : a));
  };
  const rename = async a => {
    const u = draft.trim();
    setEditing(null);
    if (!u || u === a.key) return;
    if (list.some(x => x.key !== a.key && x.key.toLowerCase() === u.toLowerCase())){
      say(`Someone already signs in as ${u}`); return;
    }
    await write(list.map(x => x.key===a.key ? {...x, key:u} : x));
    /* renaming yourself has to move the signed-in session with it */
    if (a.key === me.key && onRenamed) onRenamed({...me, key:u});
    say(`${a.key} signs in as ${u} now`);
  };
  const reset = async key => {
    const hash = await sha("1234");
    write(list.map(a => a.key===key ? {...a, hash} : a));
    say("Password reset to 1234");
  };
  const add = async role => {
    const stem = role === "super" ? "super" : "admin";
    let n = role === "super" ? 2 : 3;
    while (list.some(a=>a.key===stem+n)) n++;
    write([...list, {key:stem+n, role, label: role==="super" ? "Super admin" : "Shift "+n,
      hash: await sha("1234"), email:""}]);
    say(`Added ${stem}${n} · password 1234 · rename it by tapping the username`);
  };
  const remove = key => {
    if (key === keyholder){ say("That one stays — it's the account that can never be locked out"); return; }
    if (key === me.key){ say("You can't remove the account you're using"); return; }
    if (supers === 1 && (list.find(a=>a.key===key)||{}).role === "super"){
      say("Keep at least one super admin"); return;
    }
    write(list.filter(a=>a.key!==key));
  };

  return (
    <div className="card pad">
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:14, flexWrap:"wrap"}}>
        <div>
          <div className="eyebrow">Who can sign in</div>
          <p className="mini" style={{marginTop:6, maxWidth:520}}>
            Shift accounts run the desk: requests, bookings and open play. Super admins can also change
            rates, payment details and these accounts.
          </p>
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <button className="btn btn-sm" onClick={()=>add("shift")} disabled={busy}>Add a shift account</button>
          <button className="btn btn-sm" onClick={()=>add("super")} disabled={busy}>Add a super admin</button>
        </div>
      </div>

      <div style={{marginTop:18, overflowX:"auto"}}>
        <table>
          <thead><tr><th>Username</th><th>Shift name</th><th>Role</th><th></th></tr></thead>
          <tbody>
            {list.map(a => (
              <tr key={a.key}>
                <td>
                  {editing === a.key ? (
                    <input autoFocus value={draft}
                      onChange={e=>setDraft(e.target.value)}
                      onKeyDown={e=>{ if (e.key==="Enter") rename(a); if (e.key==="Escape") setEditing(null); }}
                      onBlur={()=>rename(a)}
                      style={{padding:"7px 10px", border:"1.5px solid var(--teal)", borderRadius:9,
                        fontSize:13.5, width:150}}/>
                  ) : (
                    <button className="username" disabled={busy}
                      title={`Rename ${a.key}`} aria-label={`Rename ${a.key}`}
                      onClick={()=>{ setDraft(a.key); setEditing(a.key); }}>
                      <b>{a.key}</b>
                      {a.key===keyholder && <span className="keyholder" title="This account can't be removed">keyholder</span>}
                      {a.key===me.key && <span className="mini"> · you</span>}
                      <i>✎</i>
                    </button>
                  )}
                </td>
                <td>
                  <input value={a.label} onChange={e=>setField(a.key,"label",e.target.value)}
                    style={{padding:"7px 10px", border:"1.5px solid var(--line)", borderRadius:9, fontSize:13.5, width:150}}/>
                </td>
                <td>
                  <select value={a.role} onChange={e=>setField(a.key,"role",e.target.value)}
                    style={{padding:"7px 10px", border:"1.5px solid var(--line)", borderRadius:9, fontSize:13.5}}>
                    <option value="shift">Shift admin</option>
                    <option value="super">Super admin</option>
                  </select>
                </td>
                <td>
                  <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                    <button className="btn btn-sm" disabled={busy} onClick={()=>reset(a.key)}>Reset password</button>
                    <button className="btn btn-sm btn-danger" disabled={busy || a.key===keyholder}
                      title={a.key===keyholder ? "This account can never be removed" : "Remove "+a.key}
                      onClick={()=>remove(a.key)}>Remove</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="mini" style={{marginTop:16, maxWidth:600}}>
        Tap a username to change it — that's what they type to sign in, so tell them before you do.
        Reset puts an account back to the password <b>1234</b>; ask them to change it from Settings →
        Your account when they next sign in. The <b>keyholder</b> account can be renamed and
        re-passworded like any other, but never removed, so the club can't lock itself out.
      </p>
    </div>
  );
}

const SETTINGS_KEY = "court:settings";
const QR_KEY = m => `court:qr:${m}`;
const DEFAULT_SETTINGS = {
  rate: 500,
  bankName: "", bankAccountName: "", bankAccountNumber: "",
  gcashName: "", gcashNumber: "",
  note: "Rates can change at the counter — please confirm on arrival."
};

async function loadSettings(){
  const v = await store.get(SETTINGS_KEY);
  try { return {...DEFAULT_SETTINGS, ...(v ? JSON.parse(v) : {})}; } catch { return {...DEFAULT_SETTINGS}; }
}
const priceFor = (minutes, rate) => Math.round((minutes/60) * (rate||DEFAULT_SETTINGS.rate));
const peso = n => "₱" + n.toLocaleString();

function QrBox({method, label}){
  const [url,setUrl] = useState(null);
  const [state,setState] = useState("loading");
  useEffect(()=>{ let ok = true;
    store.get(QR_KEY(method)).then(v => { if(!ok) return; if (v){ setUrl(v); setState("ok"); } else setState("none"); });
    return ()=>{ ok = false; };
  },[method]);
  if (state === "loading") return <div className="qrbox"><span className="mini">Loading…</span></div>;
  if (state === "none") return <div className="qrbox"><span className="mini">No {label} QR uploaded yet — staff can add one in Settings</span></div>;
  return <img className="qrimg" src={url} alt={label+" QR code"}/>;
}

function CopyRow({label, value}){
  const [done,setDone] = useState(false);
  if (!value) return null;
  const copy = async () => {
    try { await navigator.clipboard.writeText(value); setDone(true); setTimeout(()=>setDone(false),1600); } catch {}
  };
  return (
    <div className="payrow">
      <span className="paycol">
        <span className="paylabel">{label}</span>
        <span className="payval">{value}</span>
      </span>
      <button className="btn btn-sm btn-ghost paycopy" onClick={copy}>{done ? "Copied" : "Copy"}</button>
    </div>
  );
}

          <div className="field"><span className="label">Account number</span>
            <input value={cfg.bankAccountNumber} onChange={e=>set("bankAccountNumber",e.target.value)}/></div>
          <div className="qredit">
            {qr.bank ? <img className="qrimg" src={qr.bank} alt="Bank QR"/> : <div className="qrbox"><span className="mini">No QR yet</span></div>}
            <button className="btn btn-sm" onClick={()=>bankRef.current.click()}>{qr.bank?"Replace QR":"Upload QR"}</button>
            <input ref={bankRef} type="file" accept="image/*" style={{display:"none"}}
              onChange={e=>upload("bank", e.target.files && e.target.files[0])}/>
          </div>
        </div>

        <div>
          <div className="eyebrow pink">GCash</div>
          <div className="field" style={{marginTop:12}}><span className="label">Account name</span>
            <input value={cfg.gcashName} onChange={e=>set("gcashName",e.target.value)}/></div>
          <div className="field"><span className="label">Mobile number</span>
            <input value={cfg.gcashNumber} placeholder="09xx xxx xxxx" onChange={e=>set("gcashNumber",e.target.value)}/></div>
          <div className="qredit">
            {qr.gcash ? <img className="qrimg" src={qr.gcash} alt="GCash QR"/> : <div className="qrbox"><span className="mini">No QR yet</span></div>}
            <button className="btn btn-sm" onClick={()=>gcashRef.current.click()}>{qr.gcash?"Replace QR":"Upload QR"}</button>
            <input ref={gcashRef} type="file" accept="image/*" style={{display:"none"}}
              onChange={e=>upload("gcash", e.target.files && e.target.files[0])}/>
          </div>
        </div>
      </div>

      <button className="btn btn-primary" style={{marginTop:20}} disabled={saving} onClick={save}>
        {saving ? "Saving…" : "Save payment details"}
      </button>
      <p className="mini" style={{marginTop:12}}>
        QR images are shown to customers on the booking form. They're stored with the site, so upload them once.
      </p>
    </div>
  );
}

/* ========================== ADMIN DASHBOARD ========================= */
function AdminHome({pending, stamp, tick, onGo, onDecide, busy, onPhoto, setDate}){
  const today = toKey(new Date());
  const [rows,setRows] = useState([]);
  const [op,setOp] = useState(null);
  const [rate,setRate] = useState(DEFAULT_SETTINGS.rate);

  useEffect(()=>{ let ok=true;
    loadDay(today).then(b=>{ if(ok) setRows(b); });
    store.get(OP_KEY).then(v=>{ try{ if(ok) setOp(v?JSON.parse(v):null); }catch{} });
    loadSettings().then(c=>{ if(ok) setRate(c.rate); });
    return ()=>{ ok=false; };
  },[stamp, today]);

  const confirmed = rows.filter(b=>b.status==="confirmed").sort((a,b)=>a.start-b.start);
  const live = confirmed.filter(b => tick>=b.start && tick<b.end);
  const upcoming = confirmed.filter(b => b.start>tick).slice(0,5);
  const minutes = confirmed.reduce((n,b)=>n+(b.end-b.start),0);
  const opRunning = op && op.status==="running" && op.live;

  return (
    <div className="wrap">
      <div className="page-head"><div>
        <div className="eyebrow">{fmtDate(today)}</div>
        <h2 style={{marginTop:6}}>Today at Pickle Town</h2>
      </div></div>

      <div className="dash">
        <button className={"dashcard"+(pending.length?" alert":"")} onClick={()=>onGo("requests")}>
          <span className="dashn">{pending.length}</span>
          <span className="dashl">Requests waiting</span>
          <span className="mini">{pending.length ? "Tap to review" : "All caught up"}</span>
        </button>
        <button className="dashcard" onClick={()=>{setDate(today); onGo("book");}}>
          <span className="dashn">{live.length}<i>/{CLUB.courts.length}</i></span>
          <span className="dashl">Courts in play</span>
          <span className="mini">{live.length ? live.map(b=>CLUB.courts[b.court].replace("Court ","")).join(", ")+" busy" : "All courts free"}</span>
        </button>
        <button className="dashcard" onClick={()=>{setDate(today); onGo("book");}}>
          <span className="dashn">{confirmed.length}</span>
          <span className="dashl">Bookings today</span>
          <span className="mini">{(minutes/60).toFixed(1)} court hours · about {peso(Math.round(minutes/60*rate))}</span>
        </button>
        <button className={"dashcard"+(opRunning?" go":"")} onClick={()=>onGo("openplay")}>
          <span className="dashn">{opRunning ? onCourtIds(op).length : "—"}</span>
          <span className="dashl">Open play</span>
          <span className="mini">{opRunning ? `${(op.queue||[]).length} in the queue` : "Not running"}</span>
        </button>
      </div>

      <div className="dashrow">
        <div className="card pad">
          <div className="eyebrow pink">Needs approving</div>
          {pending.length ? (
            <>
              {pending.slice(0,3).map((b,i)=>(
                <div className="req" key={b.id}>
                  <div className="rank">{i+1}</div>
                  <div className="req-main">
                    <div className="req-name">{b.name}</div>
                    <div className="req-meta">
                      {b.phone} · {CLUB.courts[b.court]}<br/>
                      {fmtDateShort(b.date)} · {fmtTime(b.start)} – {fmtTime(b.end)} · {peso(priceFor(b.end-b.start, rate))}
                      {b.hasReceipt && <> · receipt attached</>}
                    </div>
                    <div className="req-acts">
                      <button className="btn btn-sm btn-primary" disabled={busy} onClick={()=>onDecide(b,"confirmed")}>Approve</button>
                      <button className="btn btn-sm btn-danger" disabled={busy} onClick={()=>onDecide(b,"declined")}>Decline</button>
                    </div>
                  </div>
                </div>
              ))}
              {pending.length>3 && <button className="btn btn-sm" onClick={()=>onGo("requests")}>See all {pending.length}</button>}
            </>
          ) : <p className="mini" style={{marginTop:10}}>Nothing waiting. New requests land here as they come in.</p>}
        </div>

        <div className="card pad">
          <div className="eyebrow">Coming up today</div>
          {upcoming.length ? upcoming.map(b=>(
            <div className="upnext" key={b.id}>
              <span className="uptime">{fmtTime(b.start)}</span>
              <span className="upmain"><b>{b.name}</b><span className="mini"> · {CLUB.courts[b.court]} · {fmtDur(b.end-b.start)}</span></span>
            </div>
          )) : <p className="mini" style={{marginTop:10}}>Nothing else booked today.</p>}
          <div style={{display:"flex", gap:8, marginTop:16, flexWrap:"wrap"}}>
            <button className="btn btn-sm" onClick={()=>{setDate(today); onGo("book");}}>Today's sheet</button>
            <button className="btn btn-sm" onClick={()=>onGo("openplay")}>{opRunning?"Open play board":"Start open play"}</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>onGo("settings")}>Records</button>
          </div>
        </div>
      </div>
      <div style={{height:60}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
