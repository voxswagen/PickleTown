.courtbar .chip-p{padding:7px 12px; font-size:13px}
.courtbar .chip-p.on{background:var(--teal-deep); color:#fff}
.courtbar .chip-p.on .chip-n{color:#fff; opacity:.75; font-size:10px; letter-spacing:.06em; text-transform:uppercase}


/* ---------------- floor plan ---------------- */
.planwrap{background:#E8848B; border-radius:20px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow)}
.planhead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  flex-wrap:wrap; margin-bottom:14px}
.planhead .label,.planhead .mini{color:rgba(255,255,255,.92)}
.planhead .btn{background:rgba(255,255,255,.9)}
.plan{display:grid; grid-template-columns:repeat(6,1fr); gap:14px}
.plan-court{position:relative; aspect-ratio:20/44; background:#3FA394; border:2.5px solid #fff;
  border-radius:4px; padding:0; overflow:hidden; transition:transform .12s, box-shadow .12s}
.plan-court:not(:disabled){cursor:pointer}
.plan-court:not(:disabled):hover{transform:translateY(-2px); box-shadow:0 10px 22px -12px rgba(0,0,0,.6)}
.plan-court.on{box-shadow:0 0 0 4px #fff, 0 12px 26px -12px rgba(0,0,0,.7); transform:translateY(-2px)}
.plan-court.busy{background:#2C7C71}
.plan-court.busy .pl-kitchen{background:#BDCBC6}
.pl-net{position:absolute; left:-4px; right:-4px; top:calc(50% - 1.5px); height:3px; background:#fff}
.pl-kitchen{position:absolute; left:0; right:0; top:34.1%; height:31.8%; background:#D5DEDA;
  border-top:2px solid #fff; border-bottom:2px solid #fff}
.pl-mid{position:absolute; left:calc(50% - 1px); width:2px; top:0; bottom:0;
  background:linear-gradient(#fff 0 34.1%, transparent 34.1% 65.9%, #fff 65.9% 100%)}
.pl-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.45)}
.pl-label b{font-family:var(--serif); font-size:clamp(20px,2.6vw,34px); line-height:1}
.pl-label em{font-style:normal; font-size:10.5px; letter-spacing:.04em; opacity:.95; text-align:center;
  padding:0 4px; line-height:1.3}
.plan.compact{gap:6px; margin:12px 0 16px}
.plan.compact .plan-court{aspect-ratio:20/34; border-width:1.5px; opacity:.45}
.plan.compact .plan-court.on{opacity:1; box-shadow:0 0 0 3px var(--pink)}
.plan.compact .pl-label b{font-size:13px}
.hcell.faded{opacity:.35}
@media (max-width:700px){
  .plan{grid-template-columns:repeat(3,1fr); gap:10px}
  .planwrap{padding:12px; border-radius:16px}
  .pl-label em{font-size:9.5px}
}


/* ---------------- stacks and mode ---------------- */
.modeswitch{display:inline-flex; gap:4px; background:#fff; border:1.5px solid var(--line);
  border-radius:12px; padding:3px}
.modeswitch button{padding:7px 14px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--soft)}
.modeswitch button.on{background:var(--teal-deep); color:#fff}
.modeswitch.big button{padding:10px 18px; font-size:14px}
.stackcard{border-style:dashed; border-color:var(--teal); background:var(--teal-soft)}
.stackcard.hot{background:#fff; border-style:solid; box-shadow:0 0 0 3px var(--teal-line)}
.qbadge.ready{background:var(--teal-deep); color:#fff}
.lu-chip.inslot{background:#fff; width:100%; justify-content:space-between}
.lu-slot{display:block; padding:10px 12px; border:1.5px dashed var(--line); border-radius:10px;
  font-size:12px; color:var(--soft); margin-bottom:6px; text-align:center; background:#FBF8F5}
.addstack{margin-top:14px}



.addcard{border:1.5px dashed var(--line); background:var(--cream); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px; text-align:center; min-height:150px; box-shadow:none}
.addcard:hover{border-color:var(--teal); background:var(--teal-soft)}
.addplus{font-size:26px; line-height:1; color:var(--teal-deep)}
.addcard b{font-size:14px}
.stacknote{display:block; font-size:11px; color:var(--teal-deep); opacity:.85; margin-top:8px; line-height:1.4}
.disclose{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  padding:11px 0; border-top:1px solid var(--line)}
.disclose:hover .mini{color:var(--ink)}
.chev{display:inline-block; font-style:normal; transform:rotate(90deg); transition:transform .15s}
.chev.up{transform:rotate(-90deg)}


/* ---------------- dark feature panel ---------------- */
.panel-dark{background:#1F3B37; color:#fff; border-radius:26px; padding:clamp(24px,3.4vw,46px);
  display:grid; grid-template-columns:1fr 1.05fr; gap:clamp(24px,3vw,48px); align-items:center;
  background-image:radial-gradient(600px 300px at 88% -10%, rgba(77,178,164,.22), transparent 60%),
    radial-gradient(500px 260px at 4% 108%, rgba(231,129,141,.18), transparent 62%)}
.pd-left{min-width:0}
.panel-dark h2{color:#fff; margin-top:14px; font-size:clamp(28px,3.4vw,44px); line-height:1.06}
.pd-lede{color:#B7CBC7; font-size:16px; line-height:1.65; margin:18px 0 0; max-width:44ch}
.pd-cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px}
.btn-light{background:#fff; border-color:#fff; color:#1F3B37}
.btn-light:hover{background:#F0F5F3; border-color:#F0F5F3}
.btn-outline{background:transparent; border-color:rgba(255,255,255,.35); color:#fff}
.btn-outline:hover{border-color:#fff; background:rgba(255,255,255,.08)}
.pd-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pd-card{background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12); border-radius:18px;
  padding:20px; display:flex; flex-direction:column}
.pd-n{font-family:var(--serif); font-size:clamp(26px,2.6vw,34px); color:#6FC5B7; line-height:1; margin-bottom:12px}
.pd-card b{font-size:14.5px; margin-bottom:6px}
.pd-card span:last-child{font-size:13.5px; line-height:1.6; color:#A9BFBB}
@media (max-width:900px){
  .panel-dark{grid-template-columns:1fr; gap:26px; border-radius:20px}
}
@media (max-width:520px){
  .pd-grid{grid-template-columns:1fr}
  .pd-cta .btn{flex:1 1 100%; justify-content:center}
}


.username{display:inline-flex; align-items:center; gap:7px; padding:5px 8px; margin:-5px -8px;
  border-radius:9px; text-align:left}
.username:hover{background:var(--sand)}
.username:hover i{opacity:1}
.username b{font-size:14px}
.username i{font-style:normal; font-size:11.5px; color:var(--teal-deep); opacity:.35}
.username:disabled{cursor:default}
.username:disabled:hover{background:none}
.keyholder{font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 7px; border-radius:999px; background:var(--teal-soft); color:var(--teal-deep)}

.datefield{display:flex; flex-direction:column; gap:3px; min-width:0}
.datefield>span{font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--soft)}
.datefield input{width:100%}
.pager{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
.pagerbtns{display:flex; align-items:center; gap:10px}
.pager .mini b{color:var(--ink)}

.chip-p.editing{padding:4px 6px}
.chip-p.editing input{width:110px; border:1.5px solid var(--teal); border-radius:999px;
  padding:5px 11px; font-size:13.5px; background:#fff; color:var(--ink)}
.chip-x.pen{font-size:12px; opacity:.8; color:var(--teal-deep)}
.chip-x.pen:hover{opacity:1; color:var(--teal-deep)}
/* someone on court is still renameable — keep the pencil obvious */
.chip-p.playing .chip-x.pen{opacity:1}
.tv-topline{display:flex; align-items:center; gap:clamp(10px,1.4vw,18px)}


.cardgrip{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; flex:none;
  color:var(--soft); background:var(--sand); cursor:grab; touch-action:none; margin-right:2px}
.cardgrip:active{cursor:grabbing; background:var(--teal-soft); color:var(--teal-deep)}
.lu-card.lifted{opacity:.4}
.lu-card.shifting{box-shadow:inset 4px 0 0 0 var(--teal), var(--shadow)}
.lu-card.partial{border-style:dashed}

/* ==================== DESK CONSOLE — the staff open play screen ====================
   One screenful. The page itself never scrolls: the header, the settings drawer
   and the courts hold their place, and only the queue and the roster move. */
.dc{height:calc(100vh - var(--dc-nav,57px)); height:calc(100dvh - var(--dc-nav,57px));
  display:flex; flex-direction:column; min-height:0; overflow:hidden}

.dc-head{flex:none; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:10px clamp(12px,1.5vw,20px); border-bottom:1px solid var(--line);
  background:rgba(253,249,245,.9)}
.dc-id{flex:none; min-width:0}
.dc-live{display:flex; align-items:center; gap:7px; font-size:9.5px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; color:var(--pink-deep)}
.dc-live i{width:7px; height:7px; border-radius:50%; background:var(--pink); display:block;
  flex:none; animation:dcblink 1.6s infinite}
@keyframes dcblink{50%{opacity:.28}}
.dc-id h2{font-size:clamp(17px,1.4vw,22px); line-height:1.05; margin:4px 0 0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:24ch}
.dc-stats{display:flex; gap:7px; flex-wrap:wrap; min-width:0}
.dc-stat{padding:7px 12px; border-radius:12px; background:#fff; border:1px solid var(--line); min-width:74px}
.dc-stat b{display:block; font-family:var(--serif); font-weight:600; font-size:19px; line-height:1;
  color:var(--teal-deep); font-variant-numeric:tabular-nums}
.dc-stat span{display:block; font-size:8.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:#8C9B97; margin-top:4px}
.dc-acts{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  justify-content:flex-end}
.dc-acts .btn{padding:9px 15px; font-size:12.5px}
.dc-sep{width:1px; height:26px; background:var(--line); display:block; flex:none; margin:0 2px}
.dc-gear{width:36px; height:36px; border-radius:50%; font-size:15px; line-height:1; flex:none;
  display:grid; place-items:center; border:1.5px solid var(--line); background:#fff; color:var(--soft)}
.dc-gear:hover{border-color:var(--teal); color:var(--teal-deep)}
.dc-gear.on{background:var(--ink); border-color:var(--ink); color:#fff}

.dc-settings{flex:none; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:11px clamp(12px,1.5vw,20px); background:var(--sand); border-bottom:1px solid var(--line)}
.dc-settings .stepper{padding:2px; border-radius:999px}
.dc-settings .stepper button{width:28px; height:28px; font-size:17px; border-radius:50%}
.dc-settings .stepper input{width:44px; font-size:15px}
.dc-settings .modeswitch{border-radius:999px; padding:3px}
.dc-settings .modeswitch button{border-radius:999px}
.dc-until{height:34px; padding:0 10px; border-radius:999px; border:1.5px solid var(--line);
  background:#fff; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink)}
.dc-hint{font-size:11.5px; color:#8C9B97; line-height:1.45; max-width:36ch}

.dc-body{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 336px;
  grid-template-rows:minmax(0,1fr); gap:14px; padding:12px clamp(12px,1.5vw,20px) 14px}
.dc-main{min-width:0; min-height:0; display:flex; flex-direction:column; gap:12px}
.dc-secthead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px}
.dc-secthead .rest-chips{gap:5px}
.dc-chip{padding:6px 11px; font-size:11.5px; background:#fff; border-color:var(--line);
  color:#8C9B97; white-space:nowrap}
.dc-chip.on{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff}
.dc-chip:hover{border-color:var(--teal)}
.dc-cname em{font-style:normal; color:var(--soft); letter-spacing:.06em}
.dc-viewgroup{margin-left:auto; display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  justify-content:flex-end}
.dc-viewgroup .dc-note{margin-left:0}
.dc-viewsw{flex:none; display:flex; gap:3px; padding:3px; background:#fff;
  border:1px solid var(--line); border-radius:999px}
.dc-viewsw button{padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:600; color:#8C9B97}
.dc-viewsw button:hover{color:var(--ink)}
.dc-viewsw button.on{background:var(--teal-deep); color:#fff}

/* ---- compact courts: one line each, so the queue keeps the room ---- */
.dc-rows{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.dc-rowc{display:flex; align-items:center; gap:9px; min-width:0; padding:8px 11px;
  border-radius:12px; background:#fff; border:1px solid var(--line);
  border-left:3px solid var(--teal-deep)}
.dc-rowc.over{border-color:var(--pink-line); border-left-color:var(--pink);
  box-shadow:0 8px 18px -16px rgba(231,129,141,.9)}
.rc-name{flex:none; font-size:10.5px; font-weight:700; letter-spacing:.1em; white-space:nowrap;
  color:var(--teal-deep)}
.dc-rowc.over .rc-name{color:var(--pink-deep)}
.rc-time{flex:none; min-width:44px; font-family:var(--serif); font-size:15px; line-height:1;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.rc-time.warn{color:var(--pink-deep)}
.rc-time.out{font-size:12px; font-weight:600; color:var(--pink-deep)}
.rc-bar{flex:none; width:44px; height:3px; border-radius:3px; overflow:hidden;
  background:rgba(34,64,60,.09)}
.rc-bar i{display:block; height:100%; border-radius:3px; transition:width 1s linear;
  background:linear-gradient(90deg,var(--teal-deep),var(--teal))}
.dc-rowc.over .rc-bar i{background:var(--pink)}
.rc-who{flex:1; min-width:60px; font-family:var(--serif); font-size:14.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rc-who.empty{font-family:var(--sans); font-size:11.5px; color:#8C9B97}
.dc-rowc .dc-mini{margin-left:0}
.rc-start,.rc-done{flex:none; padding:6px 12px; border-radius:999px; white-space:nowrap;
  font-size:11.5px; font-weight:600}
.rc-start{background:#fff; border:1.5px solid var(--line); color:var(--ink)}
.rc-start:hover{border-color:var(--teal)}
.rc-done{color:#fff; background:var(--teal-deep); border:1.5px solid var(--teal-deep)}
.rc-done:hover{background:#267065; border-color:#267065}
.dc-rowc.over .rc-done{background:var(--pink); border-color:var(--pink)}
.dc-rowc.over .rc-done:hover{background:var(--pink-deep); border-color:var(--pink-deep)}
.dc-note{margin-left:auto; font-size:11.5px; color:#8C9B97}

/* ---- courts: one compact card each, side by side ---- */
.dc-courts{flex:none; min-width:0}
.dc-courtgrid{display:grid; grid-template-columns:repeat(var(--dc-cols,3),minmax(0,1fr)); gap:12px}
.dc-court{min-width:0; padding:11px 13px 12px; border-radius:16px; background:#fff;
  border:1px solid var(--line); border-top:3px solid var(--teal-deep);
  box-shadow:0 1px 2px rgba(34,64,60,.04)}
.dc-court.over{border-color:var(--pink-line); border-top-color:var(--pink);
  box-shadow:0 10px 22px -18px rgba(231,129,141,.9)}
.dc-crow{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dc-cname{font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--teal-deep); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis}
.dc-court.over .dc-cname{color:var(--pink-deep)}
.dc-ctime{font-family:var(--serif); font-size:19px; line-height:1; font-variant-numeric:tabular-nums;
  white-space:nowrap; flex:none}
.dc-ctime.warn{color:var(--pink-deep)}
.dc-ctime.out{font-size:14px; color:var(--pink-deep); font-weight:600}
.dc-mini{margin-left:auto; display:flex; gap:3px; flex:none}
.dc-mini button{width:22px; height:22px; border-radius:50%; line-height:1; font-size:11px;
  display:grid; place-items:center; border:1px solid var(--line); background:#FBF7F3; color:var(--soft)}
.dc-mini button:hover{border-color:var(--teal); color:var(--teal-deep)}
.dc-track{height:3px; border-radius:3px; background:rgba(34,64,60,.09); margin-top:8px; overflow:hidden}
.dc-track i{display:block; height:100%; border-radius:3px; transition:width 1s linear;
  background:linear-gradient(90deg,var(--teal-deep),var(--teal))}
.dc-court.over .dc-track i{background:var(--pink)}
.dc-four{display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin-top:9px}
.dc-four b{font-family:var(--serif); font-weight:600; font-size:16.5px; line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.dc-cvs{display:flex; align-items:center; gap:8px; margin:5px 0}
.dc-cvs::before,.dc-cvs::after{content:""; height:1px; background:var(--line); flex:1}
.dc-cvs span{font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--pink-deep)}
.dc-cempty{font-size:11.5px; color:#8C9B97; line-height:1.5; margin:10px 0}
.dc-cacts{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.dc-cacts .btn{padding:7px 12px; font-size:11.5px}

/* ---- the queue panel: the only tall thing on the left ---- */
.dc-queue{--dc-pad:15px; flex:1; min-height:0; display:flex; flex-direction:column; background:#fff;
  border:1.5px solid var(--line); border-radius:18px; padding:13px var(--dc-pad) 0}
.dc-zoom{width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center;
  font-size:14px; line-height:1; border:1.5px solid var(--line); background:#fff; color:var(--soft)}
.dc-zoom:hover{border-color:var(--teal); color:var(--teal-deep)}
.dc-zoom.on{background:var(--ink); border-color:var(--ink); color:#fff; font-size:17px}

/* the bench is pinned to the foot of the panel — a walk-in is dropped onto a
   stack without scrolling to the end of the queue to find them */
.dc-bench{flex:none; display:flex; align-items:center; gap:12px;
  margin:8px calc(-1 * var(--dc-pad,15px)) 0; padding:9px var(--dc-pad,15px) 11px;
  border-top:1px solid var(--line); background:#FBF7F3; border-radius:0 0 16px 16px;
  transition:background .12s, box-shadow .12s}
.dc-bench.hot{background:var(--teal-soft); box-shadow:inset 0 0 0 2px var(--teal)}
.dc-benchlab{flex:none}
.dc-benchlab b{display:block; font-size:9.5px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:#8C9B97}
.dc-benchlab span{display:block; font-size:10.5px; color:#B4A79E; margin-top:2px}
.dc-benchrow{flex:1; min-width:0; display:flex; align-items:center; gap:6px;
  overflow-x:auto; padding:2px 0 4px}
.dc-benchrow .lu-chip{flex:none; white-space:nowrap; padding:6px 12px; font-size:12.5px;
  background:#fff; border:1px solid var(--line)}
.dc-benchrow .lu-chip.tied{background:var(--pink-soft); border-color:var(--pink-line)}
.dc-benchrow .lu-chip b{margin-left:4px}
.dc-benchrow::-webkit-scrollbar{height:6px}
.dc-benchrow::-webkit-scrollbar-thumb{background:#DCCFC6; border-radius:6px}
.dc-benchrow .lu-chip.armed{background:var(--teal-soft); border-color:var(--teal);
  box-shadow:0 0 0 2px rgba(77,178,164,.28)}
.dc-send{flex:none; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:600;
  white-space:nowrap; background:#fff; border:1.5px solid var(--line); color:var(--ink)}
.dc-send:hover{border-color:var(--teal)}
.dc-send.on{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff}

/* tap-to-place: for a touchscreen at the desk, where dragging is fiddly */
.dc-assign{flex:none; display:flex; align-items:center; gap:10px;
  margin:8px calc(-1 * var(--dc-pad,15px)) 0; padding:10px var(--dc-pad,15px);
  background:var(--teal-soft); border-top:1px solid var(--teal-line)}
.dc-assign>b{flex:none; font-size:9.5px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--teal-deep)}
.dc-assignrow{flex:1; min-width:0; display:flex; align-items:center; gap:6px;
  overflow-x:auto; padding:2px 0}
.dc-assignrow button{flex:none; white-space:nowrap; padding:7px 13px; border-radius:999px;
  background:#fff; border:1.5px solid var(--teal-line); color:var(--ink);
  font-size:12px; font-weight:600}
.dc-assignrow button:hover:not(:disabled){border-color:var(--teal-deep)}
.dc-assignrow button:disabled{opacity:.55; cursor:default}
.dc-assignrow button.new{background:transparent; border-style:dashed}
.dc-assignrow::-webkit-scrollbar{height:6px}
.dc-assignrow::-webkit-scrollbar-thumb{background:#BFDDD7; border-radius:6px}
.dc-assigndone{flex:none; padding:7px 12px; border-radius:999px; background:transparent;
  border:1px solid var(--teal-line); color:var(--teal-deep); font-size:12px; font-weight:600}
.dc-assigndone:hover{background:#fff}

/* the stacks, blown up over the whole screen, for when the panel is too small */
.dc-veil{position:fixed; inset:0; z-index:60; display:flex; padding:2.4vh 2.2vw;
  background:rgba(34,64,60,.44); backdrop-filter:blur(3px)}
.dc-modal{--dc-pad:18px; flex:1; min-width:0; display:flex; flex-direction:column; background:#fff;
  border:1.5px solid var(--line); border-radius:20px; padding:15px var(--dc-pad) 0;
  box-shadow:0 34px 80px -34px rgba(34,64,60,.75)}
.dc-modal .dc-scroll .lineup{grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); gap:14px}
.dc-modal .dc-scroll .lu-card{padding:13px 14px 14px; border-radius:16px}
.dc-modal .dc-scroll .lu-chip{font-size:15px; padding:10px 13px}
.dc-modal .dc-scroll .lu-slot{padding:10px 12px; font-size:12.5px}
.dc-modal .dc-scroll .lu-vs{margin:9px 0}
.dc-modal .dc-scroll .stacknote{font-size:11.5px}
.dc-modal .dc-benchrow .lu-chip{font-size:14px; padding:8px 14px}
.dc-qhead{flex:none; display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:9px}
.dc-scroll{flex:1; min-height:0; overflow-y:auto; padding-right:5px}
.dc-scroll .lineup{grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:10px; margin-top:0}
.dc-scroll .lu-card{padding:10px 11px 11px; border-radius:14px}
.dc-scroll .lu-chip{font-size:12.5px; padding:6px 9px}
.dc-scroll .lu-slot{padding:7px 10px; font-size:11px; margin-bottom:4px}
.dc-scroll .lu-vs{margin:7px 0}
.dc-scroll .lu-spare{margin-top:12px; padding-top:11px}
.dc-scroll::-webkit-scrollbar,.dc-list::-webkit-scrollbar{width:8px}
.dc-scroll::-webkit-scrollbar-thumb,.dc-list::-webkit-scrollbar-thumb{background:#DCCFC6; border-radius:8px}
.dc-scroll::-webkit-scrollbar-track,.dc-list::-webkit-scrollbar-track{background:transparent}

/* ---- the roster rail ---- */
.dc-side{min-width:0; min-height:0; display:flex; flex-direction:column; background:#fff;
  border:1.5px solid var(--line); border-radius:18px; padding:13px 13px 9px}
.dc-sidetop{flex:none}
.dc-srow{display:flex; gap:6px; margin-top:8px}
.dc-srow input{flex:1; min-width:0; padding:9px 13px; border-radius:999px; background:#fff;
  border:1.5px solid var(--line); outline:none; font-size:13px; color:var(--ink)}
.dc-srow input:focus{border-color:var(--teal)}
.dc-srow input.find{background:#FBF7F3; border-width:1px; font-size:12.5px; padding:8px 13px}
.dc-srow .btn{padding:9px 16px; font-size:12.5px}
.dc-tabs{display:flex; gap:4px; margin-top:8px}
.dc-tabs button{flex:1; padding:6px 8px; border-radius:999px; font-size:11.5px; font-weight:600;
  color:#8C9B97; background:#FBF7F3; border:1px solid #EFE6DF}
.dc-tabs button.on{background:var(--ink); border-color:var(--ink); color:#fff}
.dc-list{flex:1; min-height:0; overflow-y:auto; margin-top:10px; padding-right:5px;
  display:flex; flex-direction:column; gap:4px}
.dc-p{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px;
  background:#FBF7F3; border:1px solid #F0E7E0; font-size:13px}
.dc-p.sel{background:var(--teal-soft); border-color:var(--teal-line)}
.dc-p.tied{background:var(--pink-soft); border-color:var(--pink-line)}
.dc-p>i{width:7px; height:7px; border-radius:50%; flex:none; display:block}
.dc-p .nm{flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dc-p .st{flex:none; font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 7px; border-radius:999px}
.dc-p .lk{flex:none; font-size:9px; font-weight:700; letter-spacing:.08em; padding:2px 6px;
  border-radius:999px; color:var(--pink-deep); background:var(--pink-soft); border:1px solid var(--pink-line)}
.dc-tabhint{font-size:11px; color:#B4A79E; line-height:1.4; margin:8px 0 0}
.dc-p .gm{flex:none; font-family:var(--serif); font-size:13px; color:#8C9B97;
  min-width:14px; text-align:right; font-variant-numeric:tabular-nums; margin-left:2px}
.dc-p .chip-x{flex:none; width:26px; height:26px; padding:0; border-radius:8px;
  display:grid; place-items:center; font-size:16px; opacity:.6}
.dc-p .chip-x:hover{opacity:1; background:rgba(176,58,74,.10)}
.dc-p .chip-x.pen{font-size:12.5px}
.dc-p .chip-x.pen:hover{background:var(--teal-soft)}
.dc-p input{width:100%; padding:4px 9px; border-radius:8px; border:1.5px solid var(--teal);
  background:#fff; color:var(--ink); font-size:13px; outline:none}
.dc-selbar{flex:none; margin-top:8px; padding:10px 12px; border-radius:12px;
  background:var(--teal-soft); border:1px solid var(--teal-line)}
.dc-selhead{display:flex; align-items:center; gap:8px; font-size:9.5px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--teal-deep)}
.dc-selhead button{margin-left:auto; padding:4px 10px; border-radius:999px; font-size:10.5px;
  font-weight:700; letter-spacing:.04em; text-transform:none; color:var(--teal-deep);
  border:1px solid var(--teal-line); background:transparent}
.dc-selhead button:hover{background:#fff}
.dc-selnames{font-size:12.5px; color:var(--ink); line-height:1.4; margin-top:7px}
.dc-selact{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px}
.dc-selact .btn{padding:8px 14px; font-size:12px}
.dc-selact .mini{flex:1; min-width:110px; font-size:11px}
.dc-locks{flex:none; margin-top:8px; display:flex; flex-direction:column; gap:4px; max-height:118px;
  overflow-y:auto}
.dc-lock{display:flex; align-items:center; gap:7px; padding:6px 9px; border-radius:9px;
  font-size:11.5px; background:var(--pink-soft); color:var(--pink-deep)}
.dc-lock.crew{background:var(--teal-soft); color:var(--teal-deep)}
.dc-lock span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dc-lock>b{flex:none; font-size:9px; font-weight:700; letter-spacing:.08em; padding:2px 6px;
  border-radius:999px; background:rgba(255,255,255,.75)}
.dc-lock button{flex:none; font-size:11px; font-weight:700; text-decoration:underline; color:inherit}
.dc-foot{flex:none; border-top:1px solid #F0E7E0; margin-top:8px; padding-top:9px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dc-share{flex:none; max-height:34vh; overflow-y:auto; margin-top:6px}

/* a narrow screen gets the same panels, stacked, and the page scrolls again */
@media (max-width:1000px){
  .dc{height:auto; overflow:visible}
  .dc-acts{margin-left:0; width:100%; justify-content:flex-start}
  .dc-body{display:flex; flex-direction:column; padding:12px}
  .dc-queue,.dc-side{flex:none}
  .dc-scroll,.dc-list,.dc-locks,.dc-share{overflow:visible; max-height:none}
  .dc-veil{padding:0}
  .dc-modal{border-radius:0}
  .dc-side{margin-bottom:40px}
}
@media (max-width:560px){
  .dc-head{gap:12px; padding:10px 12px}
  .dc-stat{min-width:0; padding:6px 10px}
  .dc-stat b{font-size:16px}
  .dc-courtgrid{--dc-cols:2; gap:8px}
  .dc-rows{grid-template-columns:minmax(0,1fr)}
  .rc-bar{display:none}
  .dc-four b{font-size:14px}
  .dc-scroll .lineup{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===================== PHONE BOOKING FLOW =====================
   One question per screen. Page gutter 18px, nothing tappable under 44px. */
:root{ --tabh:74px; --mint:#35C49A; }
.mb{--g:18px; display:flex; flex-direction:column; min-height:calc(100dvh - var(--tabh) - 56px);
  padding-bottom:10px}
.mb-body{flex:1; display:flex; flex-direction:column; gap:10px; padding:0 var(--g)}
.mb-eyebrow{display:block; font-size:11px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--soft)}
.mb-h1{font-family:var(--serif); font-weight:600; font-size:25px; line-height:1.15; color:var(--ink)}
.mb-h2{font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.1; color:var(--ink)}
.mb-foot{font-size:12px; line-height:1.5; color:var(--soft); margin:2px 0 0}
.mb-link{font-size:12.5px; font-weight:600; color:var(--teal-deep); padding:6px 0; align-self:flex-start}

/* the day */
.mb-top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px var(--g) 12px}
.mb-word{font-family:var(--serif); font-weight:600; font-size:20px; color:var(--ink)}
.mb-open{display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 12px;
  border-radius:999px; background:#fff; border:1px solid var(--line);
  font-size:12.5px; font-weight:600; color:var(--teal-deep); white-space:nowrap}
.mb-open i{width:7px; height:7px; border-radius:50%; background:var(--mint); flex:none}
.mb-days{display:flex; gap:8px; padding:0 var(--g) 14px; overflow-x:auto; scrollbar-width:none}
.mb-days::-webkit-scrollbar{display:none}
.mb-day{flex:none; width:52px; height:64px; border-radius:16px; background:#fff;
  border:1px solid #E9E0D6; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px}
.mb-day span{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--soft)}
.mb-day b{font-family:var(--serif); font-weight:600; font-size:20px; color:var(--ink)}
.mb-day.on{background:var(--ink); border-color:var(--ink)}
.mb-day.on span{color:rgba(253,249,245,.7)}
.mb-day.on b{color:var(--cream)}
.mb-head{padding:0 var(--g) 14px}
.mb-date{font-family:var(--serif); font-weight:600; font-size:27px; line-height:1.15; color:var(--ink)}
.mb-sub{font-size:13px; color:#7C766E; margin-top:3px}
.mb-durhead{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 var(--g) 8px}
.mb-durs{display:flex; gap:8px; padding:0 var(--g) 16px; overflow-x:auto; scrollbar-width:none}
.mb-durs::-webkit-scrollbar{display:none}
.mb-dur{flex:none; height:38px; padding:0 14px; border-radius:999px; background:#fff;
  border:1px solid #E9E0D6; font-size:13px; font-weight:500; color:var(--ink); white-space:nowrap}
.mb-dur.on{background:var(--ink); border-color:var(--ink); color:var(--cream); font-weight:600}
.mb-starthead{display:flex; align-items:baseline; justify-content:space-between; gap:10px}

/* the rows: starts, courts, plan statuses */
.mb-list{display:flex; flex-direction:column; gap:9px}
.mb-start,.mb-court{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1px solid #EDE5DB; border-radius:18px; padding:13px 16px; min-height:56px}
.mb-startmid,.mb-courtmid{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.mb-startmid b{font-family:var(--serif); font-weight:600; font-size:21px; color:var(--ink); line-height:1.1}
.mb-startmid em,.mb-courtmid em{font-style:normal; font-size:12.5px; color:#7C766E; line-height:1.35}
.mb-courtmid b{font-size:15.5px; font-weight:600; color:var(--ink)}
.mb-start .tag{flex:none; font-size:13px; font-weight:600; color:var(--teal-deep)}
.mb-start .chev,.mb-court .chev{flex:none; font-size:16px; color:#C6BEB4; line-height:1}
.mb-start.wait .tag{color:#C2748A}
.mb-start.full{background:#FBF7F3}
.mb-start.full .tag{color:#B08968}
.mb-start.full .mb-startmid b{color:var(--soft)}
.mb-start.full .mb-startmid em{color:#B08968}
.mb-start:disabled{opacity:.55}

.mb-court{border-color:#B9D6C9}
.mb-court .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--mint)}
.mb-court.picked{background:var(--ink); border-color:var(--ink)}
.mb-court.picked b{color:var(--cream)}
.mb-court.picked em{color:rgba(253,249,245,.72)}
.mb-court.picked .chev{color:rgba(253,249,245,.5)}
.mb-court.live{background:var(--pink-soft); border-color:#F2C7CE}
.mb-court.live b{color:#B4596B}
.mb-court.live em,.mb-court.live .chev{color:#C2748A}
.mb-court.live .dot{background:var(--pink)}
.mb-court.wait{background:#FFF7FA; border-color:#F2C7CE}
.mb-court.wait b{color:#8A6070}
.mb-court.wait em{color:#C2748A}
.mb-court.wait .dot{background:#F2C7CE}
.mb-court:disabled{cursor:default}

/* the bar at the top of screens 2, 4 and 5 */
.mb-bar{display:flex; align-items:center; gap:12px; padding:6px var(--g) 14px}
.mb-back{width:44px; height:44px; flex:none; border-radius:14px; background:#fff;
  border:1px solid var(--line); font-size:20px; line-height:1; color:var(--ink)}
.mb-barmid{flex:1; min-width:0; display:flex; flex-direction:column}
.mb-pill{flex:none; height:36px; padding:0 12px; border-radius:999px; background:#fff;
  border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--teal-deep);
  white-space:nowrap; display:inline-flex; align-items:center}

/* the sticky call to action, clear of the tab bar */
.mb-ctawrap{position:sticky; bottom:0; z-index:6; padding:14px var(--g) 12px;
  background:linear-gradient(180deg, rgba(253,249,245,0), var(--cream) 34%)}
.mb-cta{width:100%; height:54px; border-radius:18px; background:var(--ink); color:var(--cream);
  font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px}
.mb-cta:disabled{background:#B9CFCA; color:#fff}

/* the pink approval note, used on three screens */
.mb-note{display:flex; gap:9px; align-items:flex-start; padding:12px 14px; border-radius:16px;
  background:var(--pink-soft)}
.mb-note i{width:7px; height:7px; border-radius:50%; background:var(--pink); margin-top:6px; flex:none}
.mb-note span{font-size:12.5px; line-height:1.5; color:#A35F70}
.mb-err{padding:11px 14px; border-radius:14px; background:rgba(176,58,74,.08);
  color:var(--alert); font-size:13px; line-height:1.45}

/* 3 · the request sheet */
.mb-veil{position:fixed; inset:0; z-index:80; background:rgba(34,64,60,.42);
  display:flex; align-items:flex-end}
.mb-sheet{width:100%; max-height:92dvh; overflow-y:auto; background:var(--cream);
  border-radius:28px 28px 0 0; padding:12px 20px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px rgba(20,69,58,.16); display:flex; flex-direction:column; gap:13px}
.mb-grab{width:42px; height:4px; border-radius:99px; background:#DFD6CA; align-self:center; flex:none}
.mb-sheethead{display:flex; flex-direction:column; gap:3px}
.mb-sheetsub{font-size:13px; color:#7C766E; line-height:1.4}
.mb-field{display:flex; flex-direction:column; gap:3px; background:#fff; border:1px solid var(--line);
  border-radius:16px; padding:9px 15px}
.mb-field>span{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#A29A90}
.mb-field input,.mb-field textarea{border:none; outline:none; background:none; padding:0;
  font-size:14.5px; color:var(--ink); font-family:var(--sans); resize:none; width:100%}
.mb-field input{min-height:26px}

/* 4 · pay and send */
.mb-full{position:fixed; inset:0; z-index:80; background:var(--cream); overflow-y:auto;
  display:flex; flex-direction:column; padding-top:8px}
.mb-total{margin-bottom:2px; padding:14px 16px; border-radius:18px; background:var(--ink);
  display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.mb-total em{display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(253,249,245,.6)}
.mb-total b{display:block; font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.1;
  color:var(--cream); margin-top:3px}
.mb-total .zone{font-size:12px; color:rgba(253,249,245,.7); white-space:nowrap}
.mb-paytabs{margin:0}
.mb-paycard{display:flex; gap:14px; align-items:flex-start; padding:14px; border-radius:18px;
  background:#fff; border:1px solid var(--line)}
.mb-paycard .qrimg,.mb-paycard .qrbox{width:104px; height:104px; flex:none; border-radius:12px}
.mb-paycard .paydetails{flex:1; min-width:0; display:flex; flex-direction:column; gap:9px}
.mb-receipt{position:relative; display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:14px 16px; border-radius:18px; background:#fff; border:1.5px dashed #D9CFC2}
.mb-receipt.on{border-style:solid; border-color:var(--teal-line)}
.mb-ricon{width:44px; height:44px; flex:none; border-radius:13px; background:var(--sand);
  display:grid; place-items:center; font-size:18px; color:var(--teal-deep)}
.mb-receipt img{width:44px; height:44px; flex:none; border-radius:13px; object-fit:cover}
.mb-receiptmid{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.mb-receiptmid b{font-size:14.5px; font-weight:600; color:var(--ink)}
.mb-receiptmid em{font-style:normal; font-size:12.5px; color:#7C766E}
.mb-x{position:relative; z-index:2; width:32px; height:32px; flex:none; border-radius:10px;
  font-size:18px; color:var(--soft); background:var(--sand)}
.mb-cover{position:absolute; inset:0; border-radius:18px; background:none}
.mb-refcard{display:flex; flex-direction:column; gap:9px; padding:14px 16px; border-radius:18px;
  background:#fff; border:1px solid var(--line)}
.mb-refcard>div{display:flex; align-items:center; justify-content:space-between; gap:10px}
.mb-refcard span{font-size:13px; color:#7C766E}
.mb-refcard b{font-size:13.5px; font-weight:600; color:var(--ink); text-align:right}
.mb-refcard b.rose{color:#B4596B}
.mb-refcard .hr{display:block; height:1px; background:#F0E9E0}
.mb-refcard b.code{font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.02em}
.mb-copy{flex:none; height:32px; padding:0 12px; border-radius:10px; background:var(--teal-soft);
  color:var(--teal-deep); font-size:12.5px; font-weight:600}
.mb-matchhead{display:flex; flex-direction:column; gap:3px; margin-top:2px}
.mb-or{display:flex; align-items:center; gap:10px; margin:1px 0}
.mb-or i{flex:1; height:1px; background:var(--line)}
.mb-or span{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#B4A79E}
.mb-field.want{border-color:var(--pink); box-shadow:0 0 0 2px var(--pink-soft)}
.mb-usecode{align-self:flex-start; margin-top:-4px; padding:6px 0; font-size:12.5px;
  font-weight:600; color:var(--teal-deep)}

/* the hall from above, phone-shaped: one row, six courts */
.mplan{display:grid; grid-template-columns:repeat(6,1fr); gap:5px; padding:12px 8px;
  border-radius:18px; background:#fff; border:1px solid #EFE7DE}
.mplan-c{display:block; width:100%; padding:2px; border-radius:10px; border:3px solid transparent}
/* the flexing happens on a span, never on the button — Safari does not lay a
   button out as a flex container, which collapsed each court into a sliver */
.mp-in{display:flex; flex-direction:column; gap:3px}
.mp-half{display:flex; gap:2px; height:60px}
.mp-half i{flex:1 1 0; min-width:0; border-radius:4px; background:#AFD9CB; display:block}
.mp-band{height:38px; border-radius:4px; background:#EFEFED; display:flex;
  align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:600; font-size:17px; line-height:1; color:#5C8C80}
.mplan-c.picked{border-color:#F79CAC}
.mplan-c.picked .mp-half i{background:#39A491}
.mplan-c.picked .mp-band{background:#EDEDEB; color:#2E7365}
.mplan-c.live .mp-half i{background:#F2C0C8}
.mplan-c.live .mp-band{background:#FBEEF0; color:#B4596B}
.mplan-c.wait .mp-half i{background:#EFD3D8}
.mplan-c.wait .mp-band{background:#FBF1F3; color:#A87784}
.mb-planrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 12px; border-radius:12px; background:#fff; border:1px solid #B9D6C9; min-height:40px}
.mb-planrow .nm{font-size:13.5px; font-weight:600; color:var(--ink)}
.mb-planrow .mt{font-size:12px; color:#7C766E; text-align:right}
.mb-planrow.picked{background:var(--ink); border-color:var(--ink)}
.mb-planrow.picked .nm{color:var(--cream)}
.mb-planrow.picked .mt{color:rgba(253,249,245,.72)}
.mb-planrow.live{background:var(--pink-soft); border-color:#F2C7CE}
.mb-planrow.live .nm{color:#B4596B}
.mb-planrow.live .mt{color:#C2748A}
.mb-planrow.wait{background:#FFF7FA; border-color:#F2C7CE}
.mb-planrow.wait .nm{color:#8A6070}
.mb-planrow.wait .mt{color:#C2748A}

/* request sent */
.mb-done{align-items:center; text-align:center; gap:14px; padding:40px var(--g) 0;
  display:flex; flex-direction:column}
.mb-tick{display:flex; justify-content:center}
.mb-doneline{font-size:15px; line-height:1.5; color:var(--soft); margin:0}
.mb-done .mb-cta{margin-top:6px}

/* the bottom bar */
.tabspacer{height:calc(var(--tabh) + env(safe-area-inset-bottom))}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  background:#FFFDFB; border-top:1px solid #ECE3D9}
.tab-b{position:relative; flex:1; height:48px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; color:#A29A90}
.tab-b .g{display:grid; place-items:center; width:24px; height:22px}
.tab-b .g svg{width:22px; height:22px; display:block}
.tab-b .l{font-size:11px; font-weight:500}
.tab-b.on{color:var(--ink)}
.tab-b.on .l{font-weight:600}
.tab-dot{position:absolute; top:6px; right:calc(50% - 16px); width:7px; height:7px;

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================== SETTINGS ============================ */
const CLUB = {
  name: "Pickle Town Sports Center",
  courts: ["Court 1","Court 2","Court 3","Court 4","Court 5","Court 6"],
  logoUrl: null,          // point at your real logo file to replace the drawn one
};
const ADMIN_USER = "admin";
const ADMIN_PASS = "1234";

const COURTS = 6, OPEN = 6*60, CLOSE = 24*60, STEP = 30, ROW_H = 36;
const GUEST_MAX = 960;   // 16 hours — a customer can book right through the day
const SLOTS = []; for (let m=OPEN; m<CLOSE; m+=STEP) SLOTS.push(m);

/* ---------------------- courts, named ----------------------------
   Numbers stay primary for staff. The names describe the walk in from the
   door, so someone on a phone knows which hall they are being sent to. */
const COURT_ZONES = ["Gateway","North Hall","Center Hall","South Hall","Far Hall","The Deep End"];
const courtZone = c => COURT_ZONES[c] || "";
const courtFull = c => `${CLUB.courts[c]} · ${courtZone(c)}`;
const courtIndoor = c => c > 0 && c < 5;      // 1 is by the door, 6 is the far end

/* What a customer may ask for. The site already promises half an hour up to a
   full day in half-hour steps, so the picker has to actually offer it. */
const DURATIONS = [30,60,90,120,180,240,360,GUEST_MAX];
const durLabel = m => {
  if (m >= GUEST_MAX) return "All day";
  if (m < 60) return `${m} min`;
  const h = m/60;
  return (h === 1.5 ? "1½" : String(h)) + " hr";
};

/* An unfilled seat in a stack. Lowercase, italic and dimmed so it reads as an
   absence rather than as a player called Open Spot. */
const OPEN_SPOT = <em className="openspot">open spot</em>;

/* A face for a player. There are no photographs in the app, so this is their
   initials on a disc tinted from their own name — the same colour every night,
   which is the whole point: across a hall you recognise the colour before you
   have read the name. */
const FACE_TINTS = [
  ["rgba(77,178,164,.2)",  "#5CC9BA"],
  ["rgba(231,129,141,.2)", "#EE96A2"],
  ["rgba(233,196,106,.2)", "#E9C46A"],
  ["rgba(138,160,220,.2)", "#9BB0E4"],
  ["rgba(196,150,214,.2)", "#C79BD8"],
  ["rgba(126,196,140,.2)", "#8ED49E"],
];
const faceHash = t => { let h = 0; for (let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) >>> 0; return h; };
const initialsOf = t => {
  const w = String(t||"").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "";
  return ((w[0][0]||"") + (w.length>1 ? w[w.length-1][0] : "")).toUpperCase();
};
function Face({name, className, style}){
  if (!name) return <span className={"face empty "+(className||"")} style={style}/>;
  const [bg, fg] = FACE_TINTS[faceHash(name) % FACE_TINTS.length];
  return <span className={"face "+(className||"")} title={name}
    style={{...(style||{}), background:bg, color:fg}}>{initialsOf(name)}</span>;
}
/* Array.join stringifies elements, so nodes have to be interleaved by hand */
const joinNodes = (arr, sep) => arr.map((x,i) =>
  <React.Fragment key={i}>{i ? sep : null}{x}</React.Fragment>);

/* when a running session took its courts, rounded to the half hour */
const opStart = s => {
  const began = s && s.startedAt ? new Date(s.startedAt) : new Date();
  const mins = began.getHours()*60 + began.getMinutes();
  return Math.max(OPEN, Math.min(CLOSE-STEP, Math.floor(mins/STEP)*STEP));
};

/* the half-hours a session could run until, from an hour after it starts */
function untilOptions(from){
  const out = [];
  for (let m = from + 60; m <= CLOSE; m += STEP) out.push(m);
  return out.length ? out : [CLOSE];
}

/* ------------------- what is actually free -----------------------
   A confirmed booking blocks a slot. A pending one does not: two people are
   allowed to ask for the same time, and the club works through them in order. */
function freeGrid(bookings){
  const conf = bookings.filter(b => b.status === "confirmed");
  return CLUB.courts.map((_,c) => SLOTS.map(m =>
    !conf.some(b => b.court === c && m >= b.start && m < b.end)));
}
const pendingOn = (bookings, c, start, end) =>
  bookings.filter(b => b.status === "pending" && b.court === c && b.start < end && b.end > start).length;
const bookedOn = (bookings, c, start, end) =>
  bookings.find(b => b.status === "confirmed" && b.court === c && b.start < end && b.end > start);

/* every court with an unbroken free run of `mins` starting at `start` */
function courtsFree(grid, start, mins){
  const i = SLOTS.indexOf(start), need = mins / STEP;
  if (i < 0 || i + need > SLOTS.length) return [];
  return grid.map((_,c) => c).filter(c => {
    for (let k = 0; k < need; k++) if (!grid[c][i+k]) return false;
    return true;
  });
}
/* how far past `start` a court stays free — for the "free till 10:30" line */
function freeUntil(grid, c, start){
  let i = SLOTS.indexOf(start);
  if (i < 0) return start;
  while (i < SLOTS.length && grid[c][i]) i++;
  return i >= SLOTS.length ? CLOSE : SLOTS[i];
}
/* "Courts 2, 4, 5" · "Courts 1, 2, 4 +2" */
function courtList(cs, cap = 3){
  if (!cs.length) return "";
  const names = cs.slice(0, cap).map(c => c + 1);
  const more = cs.length - names.length;
  const head = cs.length === 1 ? "Court " : "Courts ";
  return head + names.join(", ") + (more ? ` +${more}` : "");
}
/* the next duration down, for the "Try 1 hr" nudge on a full slot */
const shorterThan = m => {
  const i = DURATIONS.indexOf(m);
  return i > 0 ? DURATIONS[i-1] : null;
};
/* SANTOS-0831-C4 — what the customer types into the payment note so the desk
   can match a transfer to a request */
function payRef(name, date, court){
  const surname = (name.trim().split(/\s+/).pop() || "GUEST")
    .toUpperCase().replace(/[^A-Z]/g,"").slice(0,10) || "GUEST";
  return `${surname}-${date.slice(5).replace("-","")}-C${court+1}`;
}

/* The phone flow is a different screen, not a restyle of the desktop one, so
   it is chosen in JS rather than hidden with CSS. */
function useIsPhone(max = 760){
  const q = `(max-width:${max}px)`;
  const [is,setIs] = useState(() => { try { return window.matchMedia(q).matches; } catch { return false; } });
  useEffect(()=>{
    let mq;
    try { mq = window.matchMedia(q); } catch { return; }
    const on = e => setIs(e.matches);
    setIs(mq.matches);
    if (mq.addEventListener) mq.addEventListener("change", on); else mq.addListener(on);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", on); else mq.removeListener(on); };
  },[q]);
  return is;
}


/* =========================== HELPERS ============================= */
const pad = n => String(n).padStart(2,"0");
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtTime = m => { const h=Math.floor(m/60), mi=m%60; const ap = h>=12&&h<24?"PM":"AM";
  let hh=h%12; if(!hh) hh=12; return `${hh}:${pad(mi)} ${ap}`; };
const fmtShortTime = m => { const h=Math.floor(m/60), mi=m%60; const ap = h>=12&&h<24?"pm":"am";
  let hh=h%12; if(!hh) hh=12; return mi ? `${hh}:${pad(mi)}${ap}` : `${hh}${ap}`; };
const fmtDur = m => {
  const hrs = Math.floor(m/60), mins = m%60;
  if (!hrs) return `${mins} min`;
  const hp = `${hrs} hr${hrs>1?"s":""}`;
  return mins ? `${hp} ${mins} min` : hp;
};
const fmtDate = k => fromKey(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const fmtDateShort = k => fromKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const fmtStamp = iso => new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});
const fmtClock = iso => new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
const shiftDate = (k,n) => { const d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const makeId = () => "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clash = (a,b) => a.court===b.court && a.start<b.end && a.end>b.start;
const pct = m => ((m-OPEN)/(CLOSE-OPEN))*100;

/* ---------------------------- STORAGE ----------------------------
   Supabase when it's configured — one `kv` table, shared by every
   device, with realtime so the TV and the desk stay in step.
   Falls back to this browser's own storage when it isn't. */
const CFG = window.PT_CONFIG || {};
const SB = (() => {
  try {
    if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
      return window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  } catch {}
  return null;
})();
const ONLINE = !!SB;

const store = {
  async get(k){
    if (SB){
      const {data, error} = await SB.from("kv").select("value").eq("key", k).maybeSingle();
      if (error) throw error;
      return data ? data.value : null;
    }
    if (window.storage) { try { const r = await window.storage.get(k,true); return r ? r.value : null; } catch { return null; } }
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k,v){
    if (SB){
      const {error} = await SB.from("kv").upsert({key:k, value:v, updated_at:new Date().toISOString()});
      if (error) throw error;
      return;
    }
    if (window.storage) return window.storage.set(k,v,true);
    try { localStorage.setItem(k,v); } catch { throw new Error("full"); }
  },
  async list(prefix){
    if (SB){
      const {data, error} = await SB.from("kv").select("key").like("key", prefix+"%");
      if (error) return [];
      return (data||[]).map(r => r.key);
    }
    if (window.storage) { try { const r = await window.storage.list(prefix,true); return (r && r.keys) || []; } catch { return []; } }
    try { return Object.keys(localStorage).filter(k => k.startsWith(prefix)); } catch { return []; }
  }
};

const DAY = d => `court:day:${d}`;
const RCPT = id => `court:receipt:${id}`;
const LOG = "court:log";

const loadDay = async d => { const v = await store.get(DAY(d)); try { return v ? JSON.parse(v)||[] : []; } catch { return []; } };
const saveDay = (d,list) => store.set(DAY(d), JSON.stringify(list));
const loadLog = async () => { const v = await store.get(LOG); try { return v ? JSON.parse(v)||[] : []; } catch { return []; } };
const addLog = async e => { try { const l = await loadLog(); await store.set(LOG, JSON.stringify([e,...l].slice(0,300))); } catch {} };

/* ---- open play books its own courts ----
   A session running on Courts 1-3 has to show up on the schedule, or the desk
   sees "6 of 6 open" while the hall is full and a customer books straight over
   the top of it. One confirmed booking per court, from the moment the session
   started until closing, cleared when the session ends or a court is closed. */
const OP_BOOKING = "openplay";
async function syncOpenPlayCourts(s){
  if (!s || !s.date) return;
  try {
    const list = await loadDay(s.date);
    const kept = list.filter(b => !(b.source === OP_BOOKING && b.openPlay === s.id));
    let next = kept;
    if (s.status === "running" && (s.courts||[]).length){
      const began = s.startedAt ? new Date(s.startedAt) : new Date();
      const mins = began.getHours()*60 + began.getMinutes();
      const start = Math.max(OPEN, Math.min(CLOSE-STEP, Math.floor(mins/STEP)*STEP));
      /* Only the hours the session actually runs. Blocking through to closing
         was handing open play the whole rest of the day on those courts, so a
         7pm session made them unbookable from 7 until midnight. */
      const until = Math.max(start + STEP, Math.min(CLOSE, s.until || CLOSE));
      const stamp = new Date().toISOString();
      next = [...kept, ...s.courts.map(c => ({
        id: `op-${s.id}-${c}`, date:s.date, court:c, start, end:until,
        name: "Open play", phone:"", notes: s.title || "Open play",
        method:"counter", status:"confirmed", until,
        requestedAt: s.startedAt || stamp, decidedAt: stamp, decidedBy:"open play",
        source: OP_BOOKING, openPlay: s.id
      }))];
    }
    const same = next.length === list.length &&
      next.every((b,i) => JSON.stringify(b) === JSON.stringify(list[i]));
    if (!same) await saveDay(s.date, next);
  } catch {}
}

function shrinkPhoto(file, maxSide=1300, q=.7){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("decode"));
      img.onload = () => {
        const s = Math.min(1, maxSide/Math.max(img.width,img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}

function LogoWord({className="logo-nav", light}){
  return <img className={className} src={CLUB.logoUrl || (light ? LOGO_WORD_LIGHT : LOGO_WORD)}
    alt={CLUB.name}/>;
}

/* ---------------- floor plan: the hall seen from above ---------------- */
function CourtPlan({selected, onSelect, status, compact}){
  return (
    <div className={"plan"+(compact?" compact":"")}>
      {CLUB.courts.map((c,i)=>{
        const st = status ? status(i) : null;
        return (
          <button key={i} type="button" disabled={!onSelect}
            className={"plan-court"+(selected===i?" on":"")+(st&&st.busy?" busy":"")}
            onClick={()=>onSelect && onSelect(i)} title={c}>
            <i className="pl-net"/><i className="pl-kitchen"/><i className="pl-mid"/>
            <span className="pl-label">
              <b>{compact ? c.replace("Court ","") : c.replace("Court ","")}</b>
              {st && <em>{st.text}</em>}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ===================== THE PHONE BOOKING FLOW =====================
   The desktop screen is a 7-column time x court matrix. Poured into 390px it
   asks someone to read three axes at once through a horizontal scroller. This
   is the same request system asked one question at a time: which day, how long,
   what time, which court, who's asking, how you're paying. Nothing about the
   data changes — it still writes a pending request the club approves.        */
function MobileBook({date, setDate, today, bookings, admin, isPast, submit, say}){
  const [dur,setDur] = useState(60);
  const [view,setView] = useState("times");     // times · courts · plan
  const [start,setStart] = useState(null);
  const [court,setCourt] = useState(null);
  const [sheet,setSheet] = useState(null);      // null · details · pay
  const [name,setName] = useState("");
  const [phone,setPhone] = useState("");
  const [notes,setNotes] = useState("");
  const [method,setMethod] = useState("gcash");
  const [receipt,setReceipt] = useState(null);
  const [payref,setPayref] = useState("");
  const [err,setErr] = useState("");
  const [saving,setSaving] = useState(false);
  const [sent,setSent] = useState(null);
  const [cfg,setCfg] = useState(null);
  const fileRef = useRef(null);
  const stripRef = useRef(null);

  useEffect(()=>{ loadSettings().then(setCfg); },[]);
  /* a new day is a new question — drop whatever was half-picked */
  useEffect(()=>{ setView("times"); setStart(null); setCourt(null); setSheet(null); },[date]);

  const grid = useMemo(()=>freeGrid(bookings),[bookings]);
  const end = start != null ? start + dur : null;
  const windowText = start != null ? `${fmtTime(start)} – ${fmtTime(end)}` : "";

  const days = useMemo(()=>{
    const base = fromKey(today);
    return Array.from({length:14},(_,i)=>{
      const d = new Date(base); d.setDate(base.getDate()+i);
      return {key:toKey(d), dow:d.toLocaleDateString([], {weekday:"short"}), num:d.getDate()};
    });
  },[today]);

  /* A start is only offered when some court is free for the WHOLE span asked
     for — the old grid let you tap a 30-minute cell and discover the limit in
     the modal afterwards. */
  const starts = useMemo(()=>SLOTS
    .filter(m => m + dur <= CLOSE && !(isPast(m) && !admin))
    .map(m => {
      const ok = courtsFree(grid, m, dur);
      const contested = ok.filter(c => pendingOn(bookings, c, m, m+dur) > 0);
      const till = ok.length ? Math.min(...ok.map(c => freeUntil(grid, c, m))) : null;
      return {m, ok, contested, till};
    }),[grid, dur, bookings, admin, date]);

  const openCount = starts.filter(s => s.ok.length).length;
  const pendingCount = bookings.filter(b => b.status === "pending").length;

  const rows = useMemo(()=>{
    /* no time chosen yet — describe where each court is instead of leaving the
       list empty, which is what the plan screen shows when you arrive from the
       day view rather than from a chosen window */
    if (start == null) return CLUB.courts.map((_,c) => ({
      c, isFree:true, state: court === c ? "picked" : "open",
      meta: c === 0 ? "By the door" : c === 5 ? "Furthest in · quietest" : "Indoors"
    }));
    const free = courtsFree(grid, start, dur);
    return CLUB.courts.map((_,c) => {
      const isFree = free.includes(c);
      const pend = pendingOn(bookings, c, start, end);
      const conf = bookedOn(bookings, c, start, end);
      let state = "open", meta = `Free ${durLabel(dur)} · ${courtIndoor(c) ? "indoors" : c === 0 ? "by the door" : "far end"}`;
      if (!isFree && conf){
        state = "live";
        meta = conf.source === OP_BOOKING
          ? "Open play running"
          : `Booked ${fmtShortTime(conf.start)} – ${fmtShortTime(conf.end)}`;
      } else if (!isFree){
        state = "live"; meta = "Not free for the whole slot";
      } else if (pend){
        state = "wait"; meta = `${pend} request${pend>1?"s":""} ahead of you`;
      }
      if (court === c && isFree) state = "picked";
      return {c, isFree, state, meta};
    });
  },[grid, start, dur, court, bookings, end]);

  const total = cfg ? priceFor(dur, cfg.rate) : 0;
  const ref = court != null ? payRef(name || "Guest", date, court) : "";

  const pickStart = s => {
    if (!s.ok.length){
      const shorter = shorterThan(dur);
      if (shorter){ setDur(shorter); say(`Showing ${durLabel(shorter)} blocks instead`); }
      return;
    }
    setStart(s.m); setCourt(s.ok[0]); setView("courts");
  };

  const pickPhoto = async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!f.type.startsWith("image/")){ setErr("That file isn't a photo. Use a JPG or PNG."); return; }
    try {
      const url = await shrinkPhoto(f);
      if (url.length > 4000000){ setErr("That photo is too big even after shrinking. Try another."); return; }
      setReceipt(url); setErr("");
    } catch { setErr("Couldn't read that photo. Try another one."); }
  };

  const toPayment = () => {
    if (!name.trim()){ setErr("Add the name the court is for."); return; }
    if (phone.replace(/\D/g,"").length < 7){ setErr("Add a mobile number we can reach you on."); return; }
    setErr(""); setSheet("pay");
  };

  /* A request with neither a screenshot nor a reference is one the desk cannot
     tie to any payment. Staff booking at the counter are taking the money in
     person, so the rule is for customers only. */
  const needsProof = !admin && !receipt && !payref.trim();

  const send = async () => {
    if (needsProof){
      setErr("Attach your receipt, or type the reference from your payment — we need one of the two to match it to you.");
      return;
    }
    setSaving(true);
    const withRef = [notes.trim(), payref.trim() ? `Ref: ${payref.trim()}` : ""]
      .filter(Boolean).join(" · ");
    const problem = await submit({court, start, duration:dur, name, phone, notes:withRef, receipt, method});
    setSaving(false);
    if (problem){ setErr(problem); return; }
    setSent({court, start, end, phone});
    setSheet(null);
  };

  const reset = () => {
    setSent(null); setStart(null); setCourt(null); setName(""); setPhone("");
    setNotes(""); setReceipt(null); setPayref(""); setErr(""); setView("times");
  };

  /* Overlays, not screens: whichever view is showing stays mounted behind them. */
  const overlays = (
    <>
    {/* ------------------- 3 · the request sheet ------------------ */}
    {sheet === "details" && (
      <div className="mb-veil" onClick={()=>setSheet(null)}>
        <div className="mb-sheet" onClick={e=>e.stopPropagation()}>
          <span className="mb-grab"/>
          <div className="mb-sheethead">
            <span className="mb-eyebrow">Request</span>
            <span className="mb-h1">{courtZone(court)} · {windowText}</span>
            <span className="mb-sheetsub">{CLUB.courts[court]} · {courtIndoor(court)?"indoors":"by the door"} ·
              {" "}{durLabel(dur)} · {peso(total)} · {fmtDateShort(date)}</span>
          </div>
          {err && <div className="mb-err">{err}</div>}
          <label className="mb-field">
            <span>Your name</span>
            <input autoFocus value={name} placeholder="Who the court is for"
              onChange={e=>{setName(e.target.value); setErr("");}}/>
          </label>
          <label className="mb-field">
            <span>Mobile</span>
            <input type="tel" inputMode="tel" value={phone} placeholder="0917 000 0000"
              onChange={e=>{setPhone(e.target.value); setErr("");}}/>
          </label>
          <label className="mb-field">
            <span>Anything we should know? · optional</span>
            <textarea rows="2" value={notes} placeholder="Bringing a coach, need extra paddles…"
              onChange={e=>setNotes(e.target.value)}/>
          </label>
          <div className="mb-note">
            <i/><span>Not confirmed until the club approves — usually within an hour. Two people can
            ask for the same slot; requests are worked through in the order they arrive.</span>
          </div>
          <button className="mb-cta" onClick={toPayment}>Continue to payment →</button>
        </div>
      </div>
    )}

    {/* ---------------------- 4 · pay & send --------------------- */}
    {sheet === "pay" && (
      <div className="mb-full">
        <div className="mb-bar">
          <button className="mb-back" onClick={()=>setSheet("details")} aria-label="Back">‹</button>
          <div className="mb-barmid">
            <span className="mb-eyebrow">{CLUB.courts[court]} · {windowText}</span>
            <span className="mb-h2">How you're paying</span>
          </div>
        </div>
        <div className="mb-body">
          <div className="mb-total">
            <span>
              <em>Total · {durLabel(dur)} @ {cfg ? peso(cfg.rate) : "—"}</em>
              <b>{peso(total)}</b>
            </span>
            <span className="zone">{courtZone(court)}</span>
          </div>

          <div className="paytabs mb-paytabs">
            <button className={method==="gcash"?"on":""} onClick={()=>setMethod("gcash")}>GCash</button>
            <button className={method==="bank"?"on":""} onClick={()=>setMethod("bank")}>Bank transfer</button>
          </div>

          <div className="mb-paycard">
            <QrBox method={method} label={method==="bank"?"bank":"GCash"}/>
            <div className="paydetails">
              {method==="bank" ? (
                <>
                  <CopyRow label="Bank" value={cfg && cfg.bankName}/>
                  <CopyRow label="Account name" value={cfg && cfg.bankAccountName}/>
                  <CopyRow label="Account number" value={cfg && cfg.bankAccountNumber}/>
                  {cfg && !cfg.bankName && !cfg.bankAccountNumber &&
                    <p className="mini">Bank details haven't been set up yet.</p>}
                </>
              ) : (
                <>
                  <CopyRow label="GCash name" value={cfg && cfg.gcashName}/>
                  <CopyRow label="GCash number" value={cfg && cfg.gcashNumber}/>
                  {cfg && !cfg.gcashNumber && <p className="mini">GCash details haven't been set up yet.</p>}
                </>
              )}
            </div>
          </div>

          <div className="mb-matchhead">
            <span className="mb-eyebrow">So we can find your payment</span>
            <span className="mb-foot">{admin
              ? "Optional for a staff booking."
              : "Attach a screenshot or type the reference — we need one of the two."}</span>
          </div>

          {receipt ? (
            <div className="mb-receipt on">
              <img src={receipt} alt="Receipt"/>
              <span className="mb-receiptmid"><b>Receipt attached</b><em>Tap to replace</em></span>
              <button className="mb-x" onClick={()=>setReceipt(null)} aria-label="Remove receipt">×</button>
              <button className="mb-cover" onClick={()=>fileRef.current.click()} aria-label="Replace receipt"/>
            </div>
          ) : (
            <button className="mb-receipt" onClick={()=>fileRef.current.click()}>
              <span className="mb-ricon">↑</span>
              <span className="mb-receiptmid"><b>Attach your receipt</b>
                <em>Screenshot of the transfer{admin ? " · optional" : ""}</em></span>
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickPhoto}/>

          <div className="mb-or"><i/><span>or</span><i/></div>

          <label className={"mb-field"+(needsProof?" want":"")}>
            <span>Payment reference</span>
            <input value={payref} placeholder={ref} autoCapitalize="characters"
              onChange={e=>{setPayref(e.target.value); setErr("");}}/>
          </label>
          {!payref.trim() && (
            <button className="mb-usecode" onClick={()=>{setPayref(ref); setErr("");}}>Use {ref}</button>
          )}

          {err && <div className="mb-err">{err}</div>}

          <div className="mb-note">
            <i/><span>Send the payment to hold your slot — the court is only yours once the club
            approves. Refunded if we can't take it.</span>
          </div>

          <div className="mb-refcard">
            <div>
              <span>Put this in the payment note</span>
              <b className="code">{ref}</b>
              <button className="mb-copy" onClick={()=>{
                try { navigator.clipboard.writeText(ref); say("Reference copied"); } catch {}
              }}>Copy</button>
            </div>
            <div className="hr"/>
            <div><span>Still open to others</span><b className="rose">Until the club approves</b></div>
          </div>
          {cfg && cfg.note && <p className="mb-foot">{cfg.note}</p>}
        </div>
        <div className="mb-ctawrap">
          <button className="mb-cta" disabled={saving} onClick={send}>
            {saving ? "Sending…" : `Send request · ${peso(total)}`}
          </button>
        </div>
      </div>
    )}
    </>
  );

  /* ---------------------------- sent ---------------------------- */
  if (sent) return (
    <div className="mb mb-done">
      <div className="mb-tick"><Ball size={54} color="var(--teal)"/></div>
      <h2>Request sent</h2>
      <p className="mb-doneline">{courtFull(sent.court)}<br/>{fmtDate(date)}</p>
      <div className="mb-note">
        <i/><span>{fmtTime(sent.start)} – {fmtTime(sent.end)} is with the club for review. We'll confirm
        on {sent.phone}. The slot stays open to others until then.</span>
      </div>
      <button className="mb-cta" onClick={reset}>Book another</button>
    </div>
  );

  /* ------------------------ 5 · court layout -------------------- */
  if (view === "plan") return (
    <div className="mb">
      <div className="mb-bar">
        <button className="mb-back" onClick={()=>setView(start==null?"times":"courts")} aria-label="Back">‹</button>
        <div className="mb-barmid">
          <span className="mb-eyebrow">The hall from above</span>
          <span className="mb-h2">Tap a court</span>
        </div>
        {start != null && <span className="mb-pill">{fmtShortTime(start)} · {durLabel(dur)}</span>}
      </div>
      <div className="mb-body">
        <span className="mb-eyebrow">Six courts, side by side</span>
        <div className="mplan">
          {CLUB.courts.map((_,c)=>{
            const r = rows.find(x=>x.c===c) || {state:"open"};
            return (
              <button key={c} className={"mplan-c "+r.state} onClick={()=>setCourt(c)}
                title={courtFull(c)} aria-label={courtFull(c)}>
                <span className="mp-in">
                  <span className="mp-half"><i/><i/></span>
                  <span className="mp-band">{c+1}</span>
                  <span className="mp-half"><i/><i/></span>
                </span>
              </button>
            );
          })}
        </div>
        <div className="mb-list">
          {rows.map(r=>(
            <div className={"mb-planrow "+r.state} key={r.c}>
              <span className="nm">{courtFull(r.c)}</span>
              <span className="mt">{r.meta}</span>
            </div>
          ))}
        </div>
        <p className="mb-foot">Gateway is by the door, Courts 2–5 are the indoor halls, and the Deep
          End sits furthest in.</p>
      </div>
      {overlays}
      <div className="mb-ctawrap">
        <button className="mb-cta" disabled={court==null}
          onClick={()=>setView(start==null ? "times" : "courts")}>
          {court==null ? "Pick a court" : `Show ${CLUB.courts[court]}'s free times`}
        </button>
      </div>
    </div>
  );

  /* --------------------- 2 · courts in that window --------------- */
  if (view === "courts") return (
    <div className="mb">
      <div className="mb-bar">
        <button className="mb-back" onClick={()=>setView("times")} aria-label="Back">‹</button>
        <div className="mb-barmid">
          <span className="mb-eyebrow">{fmtDateShort(date)}</span>
          <span className="mb-h2">{windowText}</span>
        </div>
        <button className="mb-pill" onClick={()=>setView("times")}>{durLabel(dur)} ▾</button>
      </div>
      <div className="mb-body">
        <span className="mb-eyebrow">Six courts</span>
        <div className="mb-list">
          {rows.map(r=>(
            <button key={r.c} className={"mb-court "+r.state} disabled={!r.isFree}
              onClick={()=>setCourt(r.c)}>
              <span className="dot"/>
              <span className="mb-courtmid">
                <b>{courtFull(r.c)}</b>
                <em>{r.meta}</em>
              </span>
              <span className="chev">›</span>
            </button>
          ))}
        </div>
        <button className="mb-link" onClick={()=>setView("plan")}>See the hall from above ›</button>
      </div>
      {overlays}
      <div className="mb-ctawrap">
        <button className="mb-cta" disabled={court==null || !(rows.find(r=>r.c===court)||{}).isFree}
          onClick={()=>{ setErr(""); setSheet("details"); }}>
          {court==null ? "Pick a court" : `Request ${CLUB.courts[court]} · ${fmtShortTime(start)}–${fmtShortTime(end)}`}
        </button>
      </div>
    </div>
  );

  /* ------------------- 1 · day, duration, starts ----------------- */
  return (
    <div className="mb">
      <div className="mb-top">
        <span className="mb-word">{CLUB.name.replace(" Sports Center","")}</span>
        <span className="mb-open"><i/>Open till 12 AM</span>
      </div>

      <div className="mb-days" ref={stripRef}>
        {days.map(d=>(
          <button key={d.key} className={"mb-day"+(d.key===date?" on":"")} onClick={()=>setDate(d.key)}>
            <span>{d.dow}</span><b>{d.num}</b>
          </button>
        ))}
      </div>

      <div className="mb-head">
        <div className="mb-date">{fmtDate(date)}</div>
        <div className="mb-sub">{openCount} start{openCount===1?"":"s"} open · 6 courts
          {pendingCount ? ` · ${pendingCount} request${pendingCount>1?"s":""} pending` : ""}</div>
      </div>

      <div className="mb-durhead">
        <span className="mb-eyebrow">How long do you need?</span>
        <button className="mb-link" onClick={()=>setView("plan")}>Court layout ›</button>
      </div>
      <div className="mb-durs">
        {DURATIONS.map(d=>(
          <button key={d} className={"mb-dur"+(d===dur?" on":"")} onClick={()=>setDur(d)}>{durLabel(d)}</button>
        ))}
      </div>

      <div className="mb-body">
        <div className="mb-starthead">
          <span className="mb-eyebrow">Starts · {durLabel(dur)} blocks</span>
        </div>
        <div className="mb-list">
          {!starts.length && <p className="mb-foot">Nothing left today that fits {durLabel(dur)}. Try a
            shorter block, or pick tomorrow.</p>}
          {starts.map(s=>{
            const full = !s.ok.length;
            const shorter = shorterThan(dur);
            return (
              <button key={s.m} className={"mb-start"+(full?" full":"")+(s.contested.length?" wait":"")}
                onClick={()=>pickStart(s)} disabled={full && !shorter}>
                <span className="mb-startmid">
                  <b>{fmtTime(s.m)}</b>
                  <em>{full
                    ? `No court free for ${durLabel(dur)} straight`
                    : `${s.ok.length > 3 ? "Free" : courtList(s.ok) + " free"} till ${fmtShortTime(s.till)}${
                        s.contested.length ? ` · ${s.contested.length} with a request in` : ""}`}</em>
                </span>
                <span className="tag">{full ? (shorter ? `Try ${durLabel(shorter)}` : "Full") :
                  `${s.ok.length} court${s.ok.length>1?"s":""}`}</span>
                <span className="chev">›</span>
              </button>
            );
          })}
        </div>
      </div>

      {overlays}
    </div>
  );
}
